<!doctype html><html><head><meta charset="utf-8">
<title>聞こえてる？ タイポ</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#0d1018}canvas{display:block;width:100vw;height:auto}</style></head><body>
<!-- #transparent で背景なし / #t=秒 でその瞬間を表示 -->
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,DUR=8;
const TEXT=[...'聞こえてる？'];
const FONT="400 150px 'Shippori Mincho'";
const transparent=location.hash.includes('transparent');
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

// 再現性のある乱数
let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)-1)/2147483646;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);

let chars=[],dust=[];
function setup(){
 ctx.font=FONT;
 const gap=26,ws=TEXT.map(c=>ctx.measureText(c).width);
 const total=ws.reduce((a,b)=>a+b,0)+gap*(TEXT.length-1);
 let x=(W-total)/2;
 chars=TEXT.map((c,i)=>{
  const ch={c,x:x+ws[i]/2,y:H/2,w:ws[i],parts:[]};x+=ws[i]+gap;
  // 文字の形から粒子を拾う
  const oc=document.createElement('canvas');oc.width=220;oc.height=220;
  const o=oc.getContext('2d');o.font=FONT;o.textAlign='center';o.textBaseline='middle';
  o.fillStyle='#fff';o.fillText(c,110,110);
  const d=o.getImageData(0,0,220,220).data;
  for(let py=0;py<220;py+=3)for(let px=0;px<220;px+=3){
   if(d[(py*220+px)*4+3]>120&&rnd()<.75)ch.parts.push({
    ox:px-110,oy:py-110,
    vx:20+rnd()*90,vy:-(30+rnd()*110),
    sw:rnd()*6.28,amp:6+rnd()*14,
    delay:(px/220)*.45+rnd()*.25,
    life:1.1+rnd()*.9,r:.8+rnd()*1.6
   });
  }
  return ch;
 });
 for(let i=0;i<70;i++)dust.push({x:rnd()*W,y:rnd()*H,r:.6+rnd()*2.2,sp:6+rnd()*18,ph:rnd()*6.28,a:.15+rnd()*.35});
}

function render(t){
 ctx.clearRect(0,0,W,H);
 const fadeAll=clamp(t/.6)*clamp((DUR-t)/.5);
 if(!transparent){
  const g=ctx.createRadialGradient(W/2,H/2,80,W/2,H/2,W*.65);
  g.addColorStop(0,'#232a3a');g.addColorStop(.55,'#121620');g.addColorStop(1,'#07080c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 }
 // 漂う光の塵
 for(const d of dust){
  const y=((d.y-d.sp*t)%H+H)%H,x=d.x+Math.sin(t*.6+d.ph)*12;
  const a=d.a*fadeAll*(.6+.4*Math.sin(t*1.7+d.ph));
  ctx.fillStyle=`rgba(210,225,255,${a})`;
  ctx.beginPath();ctx.arc(x,y,d.r,0,6.283);ctx.fill();
 }
 ctx.font=FONT;ctx.textAlign='center';ctx.textBaseline='middle';
 const breathe=.85+.15*Math.sin(t*2.2);

 // 声が届くような淡い残響
 const echoT=clamp((t-3.6)/1.6);
 if(echoT>0&&echoT<1){
  ctx.save();
  ctx.globalAlpha=.22*(1-echoT);ctx.filter=`blur(${2+echoT*6}px)`;
  ctx.translate(W/2,H/2);ctx.scale(1+echoT*.12,1+echoT*.12);ctx.translate(-W/2,-H/2);
  ctx.fillStyle='#cfe0ff';
  for(const ch of chars)ctx.fillText(ch.c,ch.x,ch.y);
  ctx.restore();
 }

 chars.forEach((ch,i)=>{
  const inT=clamp((t-.7-i*.36)/1.3),k=easeOut(inT);
  const outStart=5.1+i*.2,outT=clamp((t-outStart)/1.1);
  const a=k*(1-ease(outT));
  const drift=Math.sin(t*1.1+i*.9)*3;
  if(a>0.003){
   const blur=(1-k)*14+outT*10;
   const y=ch.y+(1-k)*18+drift-outT*10;
   ctx.save();
   // にじむ光
   ctx.globalAlpha=a*.55*breathe;ctx.filter=`blur(${10+blur}px)`;ctx.fillStyle='#9fb8ff';
   ctx.fillText(ch.c,ch.x,y);
   // 本体
   ctx.globalAlpha=a;ctx.filter=`blur(${blur}px)`;ctx.fillStyle='#f3f6ff';
   ctx.fillText(ch.c,ch.x,y);
   ctx.restore();
  }
  // 崩れて舞い上がる粒子
  const pt=t-outStart;
  if(pt>0){
   for(const p of ch.parts){
    const lt=(pt-p.delay)/p.life;
    if(lt<=0||lt>=1)continue;
    const e=easeOut(lt);
    const x=ch.x+p.ox+p.vx*e+Math.sin(p.sw+lt*5)*p.amp*lt;
    const y=ch.y+p.oy+drift+p.vy*e;
    const pa=Math.sin(Math.PI*Math.min(1,lt*3))*(1-lt)*.9;
    ctx.fillStyle=`rgba(225,235,255,${pa})`;
    ctx.beginPath();ctx.arc(x,y,p.r*(1-lt*.5),0,6.283);ctx.fill();
   }
  }
 });
}

window.ready=document.fonts.load(FONT,'聞こえてる？').then(()=>document.fonts.ready).then(()=>{
 setup();
 const m=location.hash.match(/t=([\d.]+)/);
 if(m)render(+m[1]);
 else if(!window.__capture){const s=performance.now();const loop=()=>{render(((performance.now()-s)/1000)%DUR);requestAnimationFrame(loop)};loop();}
});
window.render=render;
</script></body></html>
