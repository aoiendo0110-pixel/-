<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#fff8fb}svg{display:block}</style></head><body>
<svg id="art" width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="pk" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffb3d1"/><stop offset=".55" stop-color="#ff7fb3"/><stop offset="1" stop-color="#f45f9f"/>
 </linearGradient>
 <radialGradient id="bg" cx=".5" cy=".5" r=".7">
  <stop offset="0" stop-color="#fffdf0"/><stop offset="1" stop-color="#ffeef5"/>
 </radialGradient>
 <g id="heart"><path d="M0 8 C-14 -6 -6 -18 0 -9 C6 -18 14 -6 0 8Z"/></g>
 <g id="star"><path d="M0 -14 L4 -4 L14 -4 L6 3 L9 13 L0 7 L-9 13 L-6 3 L-14 -4 L-4 -4Z" stroke-linejoin="round" stroke-width="3"/></g>
 <g id="spark"><path d="M0 -16 Q2 -2 16 0 Q2 2 0 16 Q-2 2 -16 0 Q-2 -2 0 -16Z"/></g>
</defs>
<rect width="1200" height="560" fill="url(#bg)"/>
<!-- soft dots -->
<g fill="#fff3a6" opacity=".7">
 <circle cx="90" cy="90" r="40"/><circle cx="1110" cy="470" r="52"/><circle cx="1080" cy="80" r="22"/><circle cx="130" cy="470" r="26"/>
</g>
<g fill="#d6f28a" opacity=".6"><circle cx="160" cy="120" r="18"/><circle cx="1040" cy="420" r="20"/><circle cx="60" cy="400" r="14"/></g>
<g id="txt" font-family="'Mochiy Pop One'" font-size="140" text-anchor="middle"></g>
<!-- decorations -->
<g fill="#ffe14d" stroke="#ffe14d"><use href="#star" transform="translate(205 160) rotate(-15) scale(1.6)"/><use href="#star" transform="translate(1010 175) rotate(12) scale(1.3)"/><use href="#star" transform="translate(600 470) scale(.9)"/></g>
<g fill="#b5e055"><use href="#spark" transform="translate(1150 120) scale(1.2)"/><use href="#spark" transform="translate(70 290) scale(1)"/><use href="#spark" transform="translate(430 110) scale(.7)"/><use href="#spark" transform="translate(800 460) scale(.8)"/></g>
<g fill="#ff8fbf"><use href="#heart" transform="translate(1120 330) rotate(15) scale(1.4)"/><use href="#heart" transform="translate(195 420) rotate(-12) scale(1.1)"/><use href="#heart" transform="translate(760 108) rotate(10) scale(.9)"/></g>
<!-- little sweat drops for 掴めない feel -->
<g fill="#bfe8ff" stroke="#fff" stroke-width="3"><path d="M1095 215 q10 14 0 22 q-10 -8 0 -22z"/><path d="M1113 193 q7 10 0 16 q-7 -6 0 -16z"/></g>
</svg>
<script>
const chars=[..."全然掴めない"], g=document.getElementById('txt');
const x0=212, step=155, ys=[300,330,295,335,300,330], rot=[-6,4,-4,6,-5,5];
const NS='http://www.w3.org/2000/svg';
const layers=[
 {stroke:'#b5e055',w:34,fill:'#b5e055',dx:6,dy:8},
 {stroke:'#ffe14d',w:30,fill:'#ffe14d',dx:0,dy:0},
 {stroke:'#ffffff',w:16,fill:'#fff',dx:0,dy:0},
 {stroke:'none',w:0,fill:'url(#pk)',dx:0,dy:0}];
layers.forEach(l=>chars.forEach((c,i)=>{
 const x=x0+i*step, y=ys[i]+30;
 const t=document.createElementNS(NS,'text');
 t.textContent=c; t.setAttribute('x',x+l.dx); t.setAttribute('y',y+l.dy);
 t.setAttribute('fill',l.fill);
 if(l.w){t.setAttribute('stroke',l.stroke);t.setAttribute('stroke-width',l.w);t.setAttribute('stroke-linejoin','round');}
 t.setAttribute('transform',`rotate(${rot[i]} ${x} ${y-50})`);
 g.appendChild(t);
}));
</script></body></html>
