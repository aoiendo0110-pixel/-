<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Choco Parts</title>
<style>html,body{margin:0;padding:0;background:transparent}svg{display:block}</style>
</head>
<body>
<div id="stage"></div>
<svg id="measure" width="0" height="0" style="position:absolute"><path id="mp"/></svg>
<script>
// Flat, thick-outline pastel style (no gradients, no gloss)
const Q=new URLSearchParams(location.search);
let W=1920,H=1080;

const LINE='#7a4434';
const P={
  cream:'#fff6f3', ivory:'#fffaf6', beige:'#e9c28e', biscuit:'#e8b98a',
  pink1:'#fbd9e2', pink2:'#f8c6d4', pink3:'#ff9fbc', rose:'#e2506a',
  berry:'#e2506a', choco:'#85503f', chocoD:'#5c3125', chocoL:'#b07a64', white:'#fffdfb'
};

// ---------- utils ----------
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(2024), rr=(a,b)=>a+(b-a)*R();
const f=n=>(+n).toFixed(1);
function tp(d,cx,cy,s,rot=0){
  const c=Math.cos(rot*Math.PI/180),sn=Math.sin(rot*Math.PI/180);
  const toks=d.match(/[MLCQZ]|-?\d*\.?\d+/g);let out='',buf=[];
  for(const t of toks){if(/[MLCQZ]/.test(t)){out+=t+' ';continue}buf.push(+t);
    if(buf.length===2){const[x,y]=buf;buf=[];out+=f(cx+(x*c-y*sn)*s)+','+f(cy+(x*sn+y*c)*s)+' '}}
  return out;
}
function mx(d){let i=0;return d.replace(/-?\d*\.?\d+/g,n=>(i++%2===0)?String(-n):n)}
const mp=document.getElementById('mp');
function along(d,step){mp.setAttribute('d',d);const L=mp.getTotalLength(),n=Math.max(1,Math.round(L/step)),o=[];
  for(let i=0;i<n;i++){const p=mp.getPointAtLength(i*L/n);o.push({x:p.x,y:p.y})}return o}
const circ=(cx,cy,r)=>`M${f(cx-r)},${f(cy)} A${f(r)},${f(r)} 0 1 0 ${f(cx+r)},${f(cy)} A${f(r)},${f(r)} 0 1 0 ${f(cx-r)},${f(cy)} Z`;
const ell=(cx,cy,rx,ry)=>`M${f(cx-rx)},${f(cy)} A${f(rx)},${f(ry)} 0 1 0 ${f(cx+rx)},${f(cy)} A${f(rx)},${f(ry)} 0 1 0 ${f(cx-rx)},${f(cy)} Z`;
const rect=(x,y,w,h,r=0)=>`M${f(x+r)},${f(y)} L${f(x+w-r)},${f(y)} Q${f(x+w)},${f(y)} ${f(x+w)},${f(y+r)} L${f(x+w)},${f(y+h-r)} Q${f(x+w)},${f(y+h)} ${f(x+w-r)},${f(y+h)} L${f(x+r)},${f(y+h)} Q${f(x)},${f(y+h)} ${f(x)},${f(y+h-r)} L${f(x)},${f(y+r)} Q${f(x)},${f(y)} ${f(x+r)},${f(y)} Z`;
// O(): union outline — stroke pass under, fill pass on top
function O(items,lw){
  let a='',b='';
  for(const [d,fill] of items){
    a+=`<path d="${d}" fill="${LINE}" stroke="${LINE}" stroke-width="${f(lw*2)}" stroke-linejoin="round"/>`;
    b+=`<path d="${d}" fill="${fill}"/>`;
  }
  return a+b;
}
const Ln=(d,lw,col=LINE,extra='')=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${f(lw)}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
const lwOf=s=>Math.max(2.4,Math.min(5,s*0.065));
const HEART='M0,0.45 C-0.1,0.33 -0.5,0.1 -0.5,-0.18 C-0.5,-0.4 -0.3,-0.5 -0.18,-0.48 C-0.08,-0.46 -0.02,-0.38 0,-0.3 C0.02,-0.38 0.08,-0.46 0.18,-0.48 C0.3,-0.5 0.5,-0.4 0.5,-0.18 C0.5,0.1 0.1,0.33 0,0.45 Z';
let uid=0;

// ---------- flat motifs ----------
function fHeart(cx,cy,s,rot,fill){return O([[tp(HEART,cx,cy,s,rot),fill]],lwOf(s))}
function fBow(cx,cy,s,rot,fill,knotFill){
  const lw=lwOf(s*0.9);
  const LOOP='M-0.1,-0.06 C-0.26,-0.44 -0.64,-0.66 -0.88,-0.52 C-1.1,-0.38 -1.1,0.04 -0.9,0.22 C-0.72,0.38 -0.36,0.26 -0.1,0.08 Z';
  const TAIL='M-0.12,0.06 C-0.24,0.28 -0.44,0.5 -0.68,0.72 L-0.48,0.75 L-0.42,0.92 C-0.22,0.72 -0.02,0.46 0.1,0.12 Z';
  const KNOT='M-0.17,-0.13 Q-0.18,-0.21 -0.1,-0.21 L0.1,-0.21 Q0.18,-0.21 0.17,-0.13 L0.14,0.14 Q0.13,0.21 0.07,0.21 L-0.07,0.21 Q-0.13,0.21 -0.14,0.14 Z';
  const T=d=>tp(d,cx,cy,s,rot);
  let g=O([[T(TAIL),fill],[T(mx(TAIL)),fill]],lw);
  g+=O([[T(LOOP),fill],[T(mx(LOOP)),fill]],lw);
  g+=Ln(T('M-0.2,-0.02 C-0.4,-0.18 -0.58,-0.2 -0.66,-0.08'),lw)+Ln(T(mx('M-0.2,-0.02 C-0.4,-0.18 -0.58,-0.2 -0.66,-0.08')),lw);
  g+=O([[T(KNOT),knotFill||fill]],lw);
  return g;
}
const BERRY='M0,0.5 C-0.36,0.36 -0.5,0 -0.45,-0.22 C-0.4,-0.44 0.4,-0.44 0.45,-0.22 C0.5,0 0.36,0.36 0,0.5 Z';
function fBerry(cx,cy,s,rot,dip){
  const lw=lwOf(s), T=d=>tp(d,cx,cy,s,rot), id='b'+(uid++);
  let g=O([[T(BERRY),P.berry]],lw);
  if(dip){
    const col=dip==='choco'?P.choco:dip==='pink'?'#f7a6bf':P.ivory;
    const wave='M-0.6,0.04 Q-0.42,0.16 -0.26,0.06 Q-0.12,0.18 0,0.06 Q0.14,0.18 0.26,0.06 Q0.42,0.16 0.6,0.04';
    g+=`<clipPath id="${id}"><path d="${T(BERRY)}"/></clipPath><g clip-path="url(#${id})"><path d="${T(wave+' L0.6,0.7 L-0.6,0.7 Z')}" fill="${col}"/>${Ln(T(wave),lw)}</g>`;
  }
  for(const [x,y] of [[-0.2,-0.18],[0.2,-0.18],[0,-0.06],[-0.24,0.0],[0.24,0.0]]){ if(dip&&y>0.0)continue;
    g+=Ln(T(`M${x},${y} L${x},${y+0.06}`),lw*0.8,'#ffe7a6')}
  const G='#5f9a6e';g+=Ln(T('M-0.3,-0.36 Q-0.14,-0.24 0,-0.34 Q0.14,-0.24 0.3,-0.36'),lw*1.3,G)+Ln(T('M0,-0.34 L0,-0.52'),lw*1.3,G)+Ln(T('M-0.16,-0.36 L-0.2,-0.5'),lw*1.3,G)+Ln(T('M0.16,-0.36 L0.2,-0.5'),lw*1.3,G);
  return g;
}
function fCandy(cx,cy,s,rot){
  const lw=lwOf(s*0.8),T=d=>tp(d,cx,cy,s,rot),id='c'+(uid++);
  const end='M0.28,-0.1 Q0.42,-0.28 0.56,-0.36 Q0.52,-0.12 0.62,0.06 Q0.46,0.06 0.3,0.12 Z';
  let g=O([[T(end),P.pink3],[T(mx(end).replace(/(-?\d*\.?\d+),(-?\d*\.?\d+)/g,(m,a,b)=>a+','+(-b)) ),P.pink3]],lw);
  g+=Ln(T('M0.32,0 Q0.44,-0.04 0.52,-0.14'),lw)+Ln(T('M-0.32,0 Q-0.44,0.04 -0.52,0.14'),lw);
  const body=circ(cx,cy,s*0.3);
  let st='';for(let k=-3;k<=3;k++){const x=k*0.1;st+=`<path d="${T(`M${x-0.05},-0.4 L${x+0.05},-0.4 L${x+0.05},0.4 L${x-0.05},0.4 Z`)}" fill="${k%2?P.pink3:P.pink1}"/>`;}
  g+=O([[body,P.pink1]],lw)+`<clipPath id="${id}"><path d="${body}"/></clipPath><g clip-path="url(#${id})">${st}`;
  for(let k=-3;k<=3;k++){const x=k*0.1+0.05;g+=Ln(T(`M${x},-0.4 L${x},0.4`),lw*0.8)}
  g+=`</g>`+Ln(body,lw);
  return g;
}
function fCupcake(cx,cy,s,frost){
  const lw=lwOf(s),T=d=>tp(d,cx,cy,s);
  let g=O([[T('M-0.36,0.02 L0.36,0.02 L0.28,0.44 Q0.27,0.48 0.22,0.48 L-0.22,0.48 Q-0.27,0.48 -0.28,0.44 Z'),P.beige]],lw);
  for(const x of [-0.16,0,0.16]) g+=Ln(T(`M${x*1.1},0.06 L${x*0.85},0.44`),lw);
  const bumps=[[-0.3,-0.02,0.15],[-0.12,-0.06,0.15],[0.12,-0.06,0.15],[0.3,-0.02,0.15],[-0.2,-0.18,0.15],[0.2,-0.18,0.15],[0,-0.24,0.16]];
  g+=O(bumps.map(([x,y,r])=>[circ(cx+x*s,cy+y*s,r*s),frost]),lw);
  g+=Ln(T('M0.02,-0.48 Q0.04,-0.62 0.14,-0.66'),lw);
  g+=O([[circ(cx+0.02*s,cy-0.42*s,0.09*s),P.berry]],lw);
  return g;
}
function fSlice(cx,cy,s,chocoSponge){
  const lw=lwOf(s),T=d=>tp(d,cx,cy,s);
  const sp=chocoSponge?P.chocoL:'#fbe9cf', side=chocoSponge?P.choco:P.beige;
  let g=O([[T('M0.3,0 L0.46,-0.2 L0.46,0.3 Q0.46,0.34 0.42,0.36 L0.3,0.44 Z'),side]],lw);
  g+=O([[T('M-0.5,0.02 L0.3,0.02 L0.3,0.44 L-0.46,0.44 Q-0.5,0.44 -0.5,0.4 Z'),sp]],lw);
  g+=`<path d="${T('M-0.5,0.04 L0.3,0.04 L0.3,0.2 Q0.2,0.28 0.12,0.2 Q0.02,0.12 -0.08,0.22 Q-0.2,0.3 -0.3,0.2 Q-0.4,0.12 -0.5,0.2 Z')}" fill="${P.pink2}"/>`;
  g+=Ln(T('M-0.5,0.2 Q-0.4,0.12 -0.3,0.2 Q-0.2,0.3 -0.08,0.22 Q0.02,0.12 0.12,0.2 Q0.2,0.28 0.3,0.2'),lw);
  g+=Ln(T('M-0.5,0.36 L0.3,0.36'),lw);
  g+=O([[T('M-0.5,0.02 L0.22,-0.26 L0.46,-0.2 L0.3,0.02 Z'),P.ivory]],lw);
  g+=O([[circ(cx+0.26*s,cy-0.3*s,0.08*s),P.white],[circ(cx+0.38*s,cy-0.27*s,0.08*s),P.white],[circ(cx+0.48*s,cy-0.22*s,0.07*s),P.white]],lw);
  g+=fBerry(cx-0.08*s,cy-0.22*s,s*0.34,0,null);
  return g;
}
function fBar(cx,cy,s,rot){
  const lw=lwOf(s*0.85),T=d=>tp(d,cx,cy,s,rot);
  let g=O([[T('M-0.26,-0.5 Q-0.26,-0.56 -0.2,-0.56 L0.2,-0.56 Q0.26,-0.56 0.26,-0.5 L0.26,0.1 L-0.26,0.1 Z'),P.choco]],lw);
  for(const [x,y] of [[-0.19,-0.49],[0.02,-0.49],[-0.19,-0.28],[0.02,-0.28]]) g+=O([[T(`M${x},${y} L${x+0.17},${y} L${x+0.17},${y+0.15} L${x},${y+0.15} Z`),P.chocoL]],lw*0.7);
  g+=O([[T('M-0.32,-0.14 L0.32,-0.24 L0.32,0.5 Q0.32,0.56 0.26,0.56 L-0.26,0.56 Q-0.32,0.56 -0.32,0.5 Z'),P.ivory]],lw);
  g+=O([[T('M-0.32,-0.14 L0.32,-0.24 L0.1,-0.06 Z'),P.beige],[T('M-0.32,0.44 L0.32,0.44 L0.32,0.5 Q0.32,0.56 0.26,0.56 L-0.26,0.56 Q-0.32,0.56 -0.32,0.5 Z'),P.beige]],lw*0.8);
  const a=rot*Math.PI/180, hx=cx-Math.sin(a)*0.2*s*-1*0, hy=0;
  const ox=0, oy=0.2*s; const hcx=cx+ox*Math.cos(a)-oy*Math.sin(a), hcy=cy+ox*Math.sin(a)+oy*Math.cos(a);
  g+=O([[tp(HEART,hcx,hcy,s*0.4,rot),P.pink2]],lw*0.9);
  return g;
}
function fCookie(cx,cy,s,fill){
  const lw=lwOf(s),r=s*0.42;let items=[[circ(cx,cy,r),fill]];
  for(let k=0;k<14;k++){const a=k/14*Math.PI*2;items.push([circ(cx+Math.cos(a)*r,cy+Math.sin(a)*r,r*0.16),fill])}
  let g=O(items,lw);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++) g+=`<rect x="${f(cx+i*r*0.42-r*0.08)}" y="${f(cy+j*r*0.42-r*0.08)}" width="${f(r*0.16)}" height="${f(r*0.16)}" rx="${f(r*0.04)}" fill="${LINE}" fill-opacity=".75"/>`;
  return g;
}
function fBonbon(cx,cy,s,fill){
  const lw=lwOf(s),r=s*0.3;let cup=[];
  for(let k=0;k<12;k++){const a=k/12*Math.PI*2;cup.push([circ(cx+Math.cos(a)*r*1.15,cy+r*0.15+Math.sin(a)*r*1.15,r*0.3),P.pink1])}
  cup.push([circ(cx,cy+r*0.15,r*1.15),P.pink1]);
  let g=O(cup,lw)+O([[circ(cx,cy,r),fill]],lw);
  g+=Ln(`M${f(cx-r*0.55)},${f(cy-r*0.1)} Q${f(cx-r*0.28)},${f(cy-r*0.45)} ${f(cx)},${f(cy-r*0.1)} Q${f(cx+r*0.28)},${f(cy+r*0.25)} ${f(cx+r*0.55)},${f(cy-r*0.1)}`,lw*0.9,P.pink1);
  return g;
}
function fFlower(cx,cy,r,fill){
  const lw=lwOf(r*2.2);let it=[];
  for(let k=0;k<5;k++){const a=(k/5*360-90)*Math.PI/180;it.push([circ(cx+Math.cos(a)*r*0.62,cy+Math.sin(a)*r*0.62,r*0.5),fill])}
  return O(it,lw)+O([[circ(cx,cy,r*0.3),P.beige]],lw);
}
function fDot(cx,cy,r,fill){return O([[circ(cx,cy,r),fill]],Math.max(2,r*0.35))}
// ribbon polygon along a polyline of points
function ribbonPoly(pts,w){
  const L=[],Rt=[];
  for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
    const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,nx=-dy/l*w/2,ny=dx/l*w/2;
    L.push([pts[i].x+nx,pts[i].y+ny]);Rt.push([pts[i].x-nx,pts[i].y-ny])}
  return 'M'+L.map(p=>f(p[0])+','+f(p[1])).join(' L')+' L'+Rt.reverse().map(p=>f(p[0])+','+f(p[1])).join(' L')+' Z';
}

// =====================================================================
//  Decoration parts (transparent). ?part=<name>
// =====================================================================
const RED=P.rose, PINK=P.pink3;
function circPts(cx,cy,r,step){return along(circ(cx,cy,r),step)}
function laceAround(d,r,step,fill,hole){ // scalloped lace following a closed path
  const pts=along(d,step);
  return {items:pts.map(p=>[circ(p.x,p.y,r),fill]),holes:pts.map(p=>`<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${f(r*0.28)}" fill="${hole}"/>`).join('')};
}
const dotsIn=(id,d,x0,y0,x1,y1,sp,r,col)=>{let g=`<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})">`;
  for(let j=0,y=y0;y<y1;y+=sp/2,j++)for(let x=x0+(j%2)*sp/2;x<x1;x+=sp)g+=`<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${col}"/>`;return g+'</g>'};

const PARTS={
  // ---------- small motifs ----------
  bow_red:()=>[260,220,fBow(130,96,110,0,RED)],
  bow_pink:()=>[260,220,fBow(130,96,110,0,PINK)],
  bow_choco:()=>[260,220,fBow(130,96,110,0,P.choco,P.chocoL)],
  heart_red:()=>[200,190,fHeart(100,98,170,0,RED)],
  heart_pink:()=>[200,190,fHeart(100,98,170,0,PINK)],
  heart_choco:()=>[200,190,fHeart(100,98,170,0,P.choco)],
  heart_choco_drizzle:()=>{const d=tp(HEART,100,98,170);let g=fHeart(100,98,170,0,P.choco);
    let z='M20,70';for(let k=0;k<9;k++)z+=` L${30+k*18},${k%2?60:110}`;g+=`<clipPath id="hz"><path d="${d}"/></clipPath><g clip-path="url(#hz)">${Ln(z,7,PINK)}</g>`;return [200,190,g]},
  strawberry:()=>[180,200,fBerry(90,108,170,0,null)],
  strawberry_choco:()=>[180,200,fBerry(90,108,170,0,'choco')],
  strawberry_pink:()=>[180,200,fBerry(90,108,170,0,'pink')],
  strawberry_white:()=>[180,200,fBerry(90,108,170,0,'white')],
  cupcake_pink:()=>[220,260,fCupcake(110,148,200,P.pink2)],
  cupcake_choco:()=>[220,260,fCupcake(110,148,200,P.choco)],
  cake_slice:()=>[260,220,fSlice(126,122,220,false)],
  cake_slice_choco:()=>[260,220,fSlice(126,122,220,true)],
  candy:()=>[260,200,fCandy(130,100,220,-30)],
  choco_bar:()=>[220,260,fBar(110,130,210,-30)],
  cookie:()=>[200,200,fCookie(100,100,170,P.biscuit)],
  bonbon:()=>[180,180,fBonbon(90,88,150,P.choco)],
  bonbon_pink:()=>[180,180,fBonbon(90,88,150,P.pink3)],
  flower_pink:()=>[140,140,fFlower(70,70,52,P.pink2)],
  flower_white:()=>[140,140,fFlower(70,70,52,P.white)],

  // ---------- frames ----------
  frame_heart:()=>{
    const w=640,h=600,cx=320,cy=318,s=560;let g='';
    const L=laceAround(tp(HEART,cx,cy,s*1.02),22,30,P.white,P.pink2);
    g+=O([...L.items,[tp(HEART,cx,cy,s*1.02),P.white]],3)+L.holes;
    g+=O([[tp(HEART,cx,cy+4,s*0.88),P.pink1]],4);
    g+=Ln(tp(HEART,cx,cy+6,s*0.8),3,RED,'stroke-dasharray="12 10"');
    for(const p of along(tp(HEART,cx,cy+4,s*0.93),24)) g+=fDot(p.x,p.y,7,P.choco);
    g+=fBow(cx,cy-s*0.33,96,0,RED);
    return [w,h,g];
  },
  frame_heart_choco:()=>{
    const w=640,h=600,cx=320,cy=318,s=560;let g='';
    const L=laceAround(tp(HEART,cx,cy,s*1.0),22,30,P.choco,P.chocoL);
    g+=O([...L.items,[tp(HEART,cx,cy,s*1.0),P.choco]],4);
    g+=O([[tp(HEART,cx,cy+4,s*0.86),P.chocoL]],3);
    g+=dotsIn('fhc',tp(HEART,cx,cy+4,s*0.86),40,40,600,600,56,4,P.choco);
    g+=Ln(tp(HEART,cx,cy+6,s*0.8),3,P.chocoD,'stroke-dasharray="10 9"');
    g+=fBow(cx,cy-s*0.33,96,0,PINK);
    return [w,h,g];
  },
  frame_doily:()=>{
    const w=540,h=540,c=270;let g='';
    const L=laceAround(circ(c,c,228),24,30,P.white,P.pink2);
    g+=O([...L.items,[circ(c,c,228),P.white]],3)+L.holes;
    for(const p of circPts(c,c,196,22)) g+=`<circle cx="${f(p.x)}" cy="${f(p.y)}" r="5" fill="${P.pink2}"/>`;
    g+=O([[circ(c,c,175),P.pink1]],3)+Ln(circ(c,c,160),3,RED,'stroke-dasharray="11 9"');
    return [w,h,g];
  },
  frame_doily_bow:()=>{const [w,h,g]=PARTS.frame_doily();return [w,h+30,`<g transform="translate(0,30)">${g}</g>`+fBow(270,90,90,0,RED)]},
  frame_label:()=>{
    const w=720,h=440,x=60,y=80,rw=600,rh=320;let g='';
    const L=laceAround(rect(x,y,rw,rh,30),18,26,P.pink2,P.pink1);
    g+=O([...L.items,[rect(x,y,rw,rh,30),P.pink2]],4)+L.holes;
    g+=O([[rect(x+26,y+26,rw-52,rh-52,20),P.ivory]],3);
    g+=dotsIn('fl',rect(x+26,y+26,rw-52,rh-52,20),x,y,x+rw,y+rh,46,4.5,P.pink2);
    g+=Ln(rect(x+40,y+40,rw-80,rh-80,14),3,PINK,'stroke-dasharray="11 9"');
    g+=fBow(w/2,y+4,100,0,RED);
    return [w,h,g];
  },
  frame_biscuit:()=>{
    const w=700,h=470,x=60,y=80,rw=580,rh=340;let g='';
    const L=laceAround(rect(x,y,rw,rh,24),20,30,P.chocoD,P.choco);
    g+=O([...L.items,[rect(x,y,rw,rh,24),P.chocoD]],4);
    g+=O([[rect(x+24,y+24,rw-48,rh-48,16),P.choco]],2.5);
    g+=Ln(rect(x+34,y+34,rw-68,rh-68,12),3,P.chocoD,'stroke-dasharray="8 7"');
    for(let i=0;i<9;i++)for(const yy of [y+60,y+rh-60]) g+=`<circle cx="${f(x+80+i*(rw-160)/8)}" cy="${yy}" r="5" fill="${P.chocoL}"/>`;
    g+=fBow(w/2,y+6,96,0,PINK);
    return [w,h,g];
  },
  frame_biscuit_heart_drip:()=>{
    const w=640,h=620,cx=320,cy=330,s=540;let g='';
    const L=laceAround(tp(HEART,cx,cy,s),22,30,P.chocoD,P.choco);
    g+=O([...L.items,[tp(HEART,cx,cy,s),P.chocoD]],4);
    g+=O([[tp(HEART,cx,cy+3,s*0.88),P.choco]],2.5);
    g+=Ln(tp(HEART,cx,cy+4,s*0.82),3,P.chocoD,'stroke-dasharray="8 7"');
    // white chocolate drip on upper right
    g+=`<clipPath id="bhd">${L.items.map(it=>`<path d="${it[0]}"/>`).join('')}<path d="${tp(HEART,cx,cy,s)}"/></clipPath>`;
    let d='M330,20 L660,20 L660,250 L626,250 L626,232 Q614,252 602,232 L602,176 Q590,162 578,176 L578,200 Q566,222 554,200 L554,150 Q540,136 526,150 L526,182 Q514,204 502,182 L502,140 Q484,124 466,140 L466,156 Q454,176 442,156 L442,128 Q420,112 398,128 L398,166 Q386,188 374,166 L374,126 Q356,110 340,124 Z';
    g+=`<g clip-path="url(#bhd)">${O([[d,P.ivory]],4)}</g>`;
    return [w,h,g];
  },
  frame_arch:()=>{
    const w=420,h=600,cx=210,top=60,hw=170,bot=570;let g='';
    const arch=(t,hw_)=>`M${cx-hw_},${bot} L${cx-hw_},${t+hw_} A${hw_},${hw_} 0 0 1 ${cx+hw_},${t+hw_} L${cx+hw_},${bot} Z`;
    g+=O([[arch(top,hw),P.beige]],5);
    const pts=along(arch(top+24,hw-24),24);g+=O(pts.map(p=>[circ(p.x,p.y,11),P.white]),3);
    const inner=arch(top+30,hw-30);let st='';for(let x=cx-hw;x<cx+hw;x+=36)st+=`<rect x="${x}" y="0" width="18" height="${h}" fill="${P.pink2}"/>`;
    g+=`<clipPath id="fa"><path d="${inner}"/></clipPath><path d="${inner}" fill="${P.pink1}"/><g clip-path="url(#fa)">${st}</g>`+Ln(inner,3);
    g+=fFlower(cx-50,top+6,15,P.pink2)+fFlower(cx+50,top+6,15,P.pink2)+fHeart(cx,top+12,74,0,P.pink3)+fHeart(cx,top+15,40,0,P.choco);
    return [w,h,g];
  },
  frame_cameo:()=>{const w=360,h=300,cx=180,cy=160;let g='';
    const L=laceAround(ell(cx,cy,150,116),16,24,P.white,P.pink2);g+=O([...L.items,[ell(cx,cy,150,116),P.white]],3)+L.holes;
    g+=O([[ell(cx,cy,126,94),P.beige]],4)+O([[ell(cx,cy,106,76),P.ivory]],3)+Ln(ell(cx,cy,94,65),2.5,PINK,'stroke-dasharray="9 7"');
    g+=fBow(cx,cy-104,64,0,P.choco,P.chocoL);return [w,h,g]},

  // ---------- ribbon banners ----------
  ribbon_banner_red:()=>banner(RED),
  ribbon_banner_pink:()=>banner(PINK),
  ribbon_banner_choco:()=>banner(P.choco),

  // ---------- borders (full width 1920) ----------
  border_drip:()=>{
    const w=1920,h=240,y0=70;const RS=rng(5);let d=`M-20,-10 L${w+20},-10 L${w+20},${y0}`,x=w+20;
    while(x>-20){const nx=x-(30+RS()*60);d+=` Q${f((x+nx)/2)},${f(y0+RS()*14)} ${f(nx)},${y0}`;x=nx;if(x<=-20)break;
      const dw=16+RS()*10,len=30+RS()*(RS()<.35?110:55);
      d+=` L${f(x)},${f(y0+len)} Q${f(x)},${f(y0+len+dw)} ${f(x-dw)},${f(y0+len+dw)} Q${f(x-2*dw)},${f(y0+len+dw)} ${f(x-2*dw)},${f(y0+len)} L${f(x-2*dw)},${y0}`;x-=2*dw;}
    d+=` L-20,${y0} Z`;
    let g=O([[d,P.choco]],5);
    for(let i=0;i<70;i++){const xx=RS()*w,yy=10+RS()*50;g+=i%3?`<rect x="${f(xx)}" y="${f(yy)}" width="16" height="6" rx="3" fill="${[PINK,P.white,P.pink2][i%3]}" transform="rotate(${f(RS()*180)} ${f(xx+8)} ${f(yy+3)})"/>`:fHeart(xx,yy,18,0,[PINK,P.white][i%2])}
    return [w,h,g];
  },
  border_lace_ribbon:()=>{
    const w=1920,h=150;let g='';let it=[];
    for(let x=0;x<w+30;x+=30){it.push([circ(x,30,16),P.white]);it.push([circ(x+15,118,16),P.white])}
    it.push([rect(-20,30,w+40,88),P.white]);g+=O(it,3);
    for(let x=0;x<w+30;x+=30)g+=`<circle cx="${x}" cy="26" r="4" fill="${P.pink2}"/><circle cx="${x+15}" cy="122" r="4" fill="${P.pink2}"/>`;
    g+=O([[rect(-20,52,w+40,44),PINK]],4)+Ln(`M0,74 L${w},74`,3,P.white,'stroke-dasharray="12 9"');
    return [w,h,g];
  },
  border_cream_berry:()=>{
    const w=1920,h=170;let g='';let it=[];
    for(let x=-10;x<w+40;x+=42)it.push([circ(x,122,24),P.white]);it.push([rect(-20,122,w+40,40),P.white]);
    for(let x=10,k=0;x<w+40;x+=64,k++)g+=fBerry(x,84,60,k%2?10:-10,['choco',null,'pink',null][k%4]);
    g=g+O(it,4);
    for(let x=10;x<w+40;x+=42)g+=Ln(`M${x-14},130 Q${x-4},122 ${x+6},130`,3,P.pink2);
    return [w,h,g];
  },
  border_garland:()=>{
    const w=1920,h=280,U=480;let g='';
    for(let i=0;i<4;i++){const x1=i*U,x2=x1+U,pts=[];
      for(let t=0;t<=1.0001;t+=0.02)pts.push({x:(1-t)*(1-t)*x1+2*(1-t)*t*(x1+x2)/2+t*t*x2,y:(1-t)*(1-t)*60+2*(1-t)*t*170+t*t*60});
      g+=O([[ribbonPoly(pts,28),PINK]],4);
      for(let t=0.08;t<0.95;t+=0.06){const p=pts[Math.round(t*50)];g+=`<circle cx="${f(p.x)}" cy="${f(p.y)}" r="3" fill="${P.white}"/>`}
      const m=pts[25];g+=Ln(`M${f(m.x)},${f(m.y+12)} L${f(m.x)},${f(m.y+50)}`,3)+fHeart(m.x,m.y+70,44,0,i%2?RED:P.choco);}
    for(let i=0;i<=4;i++){const x=i*U;g+=fFlower(x-58,74,18,P.white)+fFlower(x+58,74,18,P.white)+fBow(x,58,80,0,i%2?RED:PINK)}
    return [w,h,g];
  },
  border_dots_scallop:()=>{
    const w=1920,h=110;let g='';let it=[];
    for(let x=0;x<w+40;x+=40)it.push([circ(x,78,20),PINK]);it.push([rect(-20,-10,w+40,88),PINK]);g+=O(it,4);
    for(let j=0,y=10;y<84;y+=18,j++)for(let x=(j%2)*18;x<w+20;x+=36)g+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${P.white}"/>`;
    return [w,h,g];
  },
};
function banner(col){
  const w=860,h=260;const dk=shade(col);let g='';
  // ends (behind)
  g+=O([[`M40,104 L190,104 L190,200 L40,200 L90,152 Z`,dk],[`M820,104 L670,104 L670,200 L820,200 L770,152 Z`,dk]],4);
  g+=O([[`M150,170 L200,200 L200,160 Z`,shade(dk)],[`M710,170 L660,200 L660,160 Z`,shade(dk)]],3);
  // main band, gently arched
  const top='M150,70 Q430,30 710,70', bot='M710,170 Q430,130 150,170';
  g+=O([[`${top} L710,170 Q430,130 150,170 Z`,col]],4);
  g+=Ln('M170,86 Q430,48 690,86',3,P.white,'stroke-dasharray="12 9"')+Ln('M170,156 Q430,118 690,156',3,P.white,'stroke-dasharray="12 9"');
  return [w,h,g];
}
function shade(hex){const n=parseInt(hex.slice(1),16);const r=(n>>16)*0.84,g=((n>>8)&255)*0.84,b=(n&255)*0.84;return '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}

const name=Q.get('part');
if(name==='__list'){document.title=JSON.stringify(Object.keys(PARTS));}
else{
  const [w,h,g]=PARTS[name]();W=w;H=h;
  document.getElementById('stage').innerHTML=`<svg id="bg" xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" overflow="hidden">${g}</svg>`;
  document.title='ready';
}
</script>
