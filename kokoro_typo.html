<!doctype html><html><head><meta charset="utf-8">
<title>心奪われる タイポ</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#8a55e6}svg{display:block}</style></head><body>
<!-- #transparent で背景なし / #t=秒 でその瞬間を表示 -->
<svg id="art" width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
<defs>
 <path id="heartP" d="M0 12 C-26 -8 -13 -30 0 -14 C13 -30 26 -8 0 12Z"/>
 <path id="bigHeart" d="M0 150 C-120 70 -230 0 -230 -95 C-230 -175 -150 -215 -85 -200 C-40 -190 -12 -160 0 -130 C12 -160 40 -190 85 -200 C150 -215 230 -175 230 -95 C230 0 120 70 0 150Z"/>
 <path id="sparkP" d="M0 -20 Q2.5 -2.5 20 0 Q2.5 2.5 0 20 Q-2.5 2.5 -20 0 Q-2.5 -2.5 0 -20Z"/>
 <pattern id="felt" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".25"/><circle cx="6.5" cy="6" r=".8" fill="#000" opacity=".05"/></pattern>
 <radialGradient id="rayFade" cx=".5" cy=".5" r=".5"><stop offset=".25" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <mask id="rayMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900"><circle cx="800" cy="360" r="400" fill="url(#rayFade)"/></mask>
 <linearGradient id="heartG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb3cf"/><stop offset="1" stop-color="#ff86b6"/></linearGradient>
</defs>
<rect id="bg" width="1600" height="900" fill="#8a55e6"/>
<g id="stage"></g>
</svg>
<script>
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const stage=document.getElementById('stage');
const FONT="'Mochiy Pop One'";
const HX=800, HY=360;
const COL={
 pink:  {fill:'#ff9cc4',line:'#f06d9f',depth:'#d9578b'},
 yellow:{fill:'#ffe76e',line:'#efb21f',depth:'#d29a10'},
 lime:  {fill:'#c4ea6c',line:'#86c234',depth:'#6ea726'},
 white: {fill:'#fffafc',line:'#f9b6cf',depth:'#e98bb0'},
};
// フェルトのワッペン文字（白フチ＋色の縁＋ステッチ）
function felt(ch,size,c,kanji=false){
 const g=el('g',{});
 const k=kanji?0.45:1;
 const base={'font-family':FONT,'font-size':size,'text-anchor':'middle','dominant-baseline':'central','stroke-linejoin':'round'};
 const T=a=>{const t=el('text',{...base,...a},g);t.textContent=ch;return t;};
 T({x:5,y:8,fill:c.depth,stroke:c.depth,'stroke-width':size*0.22*k,opacity:.55});
 T({fill:'#fff',stroke:'#fff','stroke-width':size*0.22*k});
 T({fill:c.line,stroke:c.line,'stroke-width':size*0.07*k});
 T({fill:c.fill});
 T({fill:'url(#felt)'});
 if(!kanji) T({fill:'none',stroke:'#fff','stroke-width':size*0.018,'stroke-dasharray':`${size*0.045*k} ${size*0.035*k}`,'stroke-linecap':'round'});
 return g;}
function miniHeart(fill,line,sc){const g=el('g',{});
 el('use',{href:'#heartP',fill:'#fff',stroke:'#fff','stroke-width':10,'stroke-linejoin':'round',transform:`scale(${sc})`},g);
 el('use',{href:'#heartP',fill,stroke:line,'stroke-width':2.5,transform:`scale(${sc})`},g);
 el('ellipse',{cx:-8*sc,cy:-13*sc,rx:4*sc,ry:2.4*sc,fill:'#fff',transform:`rotate(-35 ${-8*sc} ${-13*sc})`},g);return g;}
function spark(fill,sc){const g=el('g',{});
 el('use',{href:'#sparkP',fill:'#fff',stroke:'#fff','stroke-width':8,'stroke-linejoin':'round',transform:`scale(${sc})`},g);
 el('use',{href:'#sparkP',fill,transform:`scale(${sc})`},g);return g;}

// ===== 放射状の光 =====
const rays=el('g',{mask:'url(#rayMask)'},stage);
const rayRot=el('g',{},rays);
for(let i=0;i<24;i++){const a1=i/24*Math.PI*2,a2=(i+0.5)/24*Math.PI*2,R=420;
 el('path',{d:`M${HX} ${HY} L${HX+R*Math.cos(a1)} ${HY+R*Math.sin(a1)} L${HX+R*Math.cos(a2)} ${HY+R*Math.sin(a2)}Z`,fill:i%2?'#fff1a6':'#ffd0e1',opacity:.85},rayRot);}

// ===== キューピッドの矢（ハートの後ろ） =====
const arrow=el('g',{},stage);
const arrowInner=el('g',{},arrow);
(()=>{const g=arrowInner;
 el('line',{x1:-330,y1:0,x2:300,y2:0,stroke:'#fff','stroke-width':22,'stroke-linecap':'round'},g);
 el('line',{x1:-330,y1:0,x2:300,y2:0,stroke:'#ffe76e','stroke-width':10,'stroke-linecap':'round'},g);
 // 羽根
 [[-1],[1]].forEach(([s])=>{[0,28,56].forEach(dx=>{
  el('path',{d:`M${-330+dx} 0 L${-360+dx} ${s*30} L${-318+dx} ${s*30} L${-292+dx} 0Z`,fill:'#fff',stroke:'#fff','stroke-width':10,'stroke-linejoin':'round'},g);
  el('path',{d:`M${-330+dx} 0 L${-360+dx} ${s*30} L${-318+dx} ${s*30} L${-292+dx} 0Z`,fill:'#c4ea6c',stroke:'#86c234','stroke-width':2.5,'stroke-linejoin':'round'},g);});});
 // 矢じり（ハート）
 const tip=el('g',{transform:'translate(318 0) rotate(90)'},g);
 el('use',{href:'#heartP',fill:'#fff',stroke:'#fff','stroke-width':12,'stroke-linejoin':'round',transform:'scale(1.6)'},tip);
 el('use',{href:'#heartP',fill:'#ff86b6',stroke:'#f06d9f','stroke-width':2.5,transform:'scale(1.6)'},tip);
})();

// ===== 大きいハート＋心 =====
const heartG=el('g',{},stage);
el('use',{href:'#bigHeart',fill:'#d9578b',opacity:.5,transform:'translate(8 12)'},heartG);
el('use',{href:'#bigHeart',fill:'#fff',stroke:'#fff','stroke-width':34,'stroke-linejoin':'round'},heartG);
el('use',{href:'#bigHeart',fill:'url(#heartG)',stroke:'#f06d9f','stroke-width':6},heartG);
el('use',{href:'#bigHeart',fill:'url(#felt)'},heartG);
el('use',{href:'#bigHeart',fill:'none',stroke:'#fff','stroke-width':4.5,'stroke-dasharray':'14 11','stroke-linecap':'round',transform:'scale(.9) translate(0 -6)'},heartG);
el('ellipse',{cx:-135,cy:-120,rx:34,ry:16,fill:'#fff',opacity:.8,transform:'rotate(-35 -135 -120)'},heartG);
el('circle',{cx:-92,cy:-148,r:7,fill:'#fff',opacity:.8},heartG);
const kokoro=felt('心',215,COL.white,true);kokoro.setAttribute('transform','translate(0 -20)');heartG.appendChild(kokoro);

// ===== 奪われる（にっこり弧の上） =====
const ARC={cx:800,cy:300,r:440};
const chars=[['奪',190,COL.pink,152],['わ',150,COL.yellow,118],['れ',150,COL.lime,84],['る',160,COL.pink,50]].map(([c,s,col,ang],i)=>{
 const g=felt(c,s,col,c==='奪');stage.appendChild(g);
 const a=ang*Math.PI/180;
 return {g,x:ARC.cx+ARC.r*Math.cos(a),y:ARC.cy+ARC.r*Math.sin(a),t0:1.55+i*0.16,ph:i*0.9,r:(ang-90)*0.5};});

// ===== はじけるハート＆キラキラ =====
const burst=[];
const bcols=[['#ff9cc4','#f06d9f'],['#ffe76e','#efb21f'],['#c4ea6c','#86c234']];
for(let i=0;i<10;i++){const [f,l]=bcols[i%3];const g=miniHeart(f,l,0.7+(i%3)*0.18);stage.appendChild(g);
 const a=(-90+i*36+(i%2?10:-6))*Math.PI/180, d=300+(i%3)*45;
 burst.push({g,a,d,ph:i*0.7});}
const sparks=[[440,330,'#fff',1.2],[1130,160,'#ffe76e',1.3],[1220,420,'#fff',0.9],[380,420,'#c4ea6c',1.0],[620,90,'#ffe76e',0.8],[990,80,'#fff',0.9]]
 .map(([x,y,f,s],i)=>{const g=spark(f,s);stage.appendChild(g);return {g,x,y,s,ph:i*1.1};});

// ===== アニメーション =====
const clamp=x=>Math.max(0,Math.min(1,x));
const back=(x,c=2.4)=>1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);
const eOut=x=>1-Math.pow(1-x,3), eIn=x=>x*x*x;
const TAU=Math.PI*2;
const HIT=1.25;   // 矢が刺さる時間
window.render=function(t){
 // 光
 const rp=eOut(clamp(t/0.6));
 rays.setAttribute('transform',`translate(${HX} ${HY}) scale(${rp<=0?0.0001:rp}) translate(${-HX} ${-HY})`);
 rayRot.setAttribute('transform',`rotate(${t*14} ${HX} ${HY})`);
 // ハート：ぽんっ→刺さってむにゅ→ドキドキ
 const hp=clamp((t-0.15)/0.5);
 let hs=hp<=0?0.0001:back(hp), sx=1, sy=1;
 const imp=clamp((t-HIT)/0.45);
 if(t>=HIT&&imp<1){const q=Math.sin(Math.PI*imp)*(1-imp*0.5);sx=1+0.16*q;sy=1-0.14*q;}
 if(t>HIT+0.45){const b=((t-HIT-0.45)%1);const beat=Math.max(0,Math.sin(Math.PI*clamp(b/0.18)))*0.07+Math.max(0,Math.sin(Math.PI*clamp((b-0.22)/0.18)))*0.05;hs*=1+beat;}
 heartG.setAttribute('transform',`translate(${HX} ${HY}) scale(${hs*sx} ${hs*sy})`);
 // 矢：左上からシュッと飛んできて刺さる
 const ap=clamp((t-(HIT-0.35))/0.35);
 const shake=t>HIT?6*Math.sin((t-HIT)*60)*Math.exp(-(t-HIT)*6):0;
 arrow.setAttribute('transform',`translate(${HX} ${HY-10}) rotate(22)`);
 arrowInner.setAttribute('transform',`translate(${ap<=0?-2000:-900*(1-ap)} 0) rotate(${shake})`);
 arrow.style.visibility=ap>0?'visible':'hidden';
 // 奪われる
 chars.forEach(o=>{const p=clamp((t-o.t0)/0.38);
  if(p<=0){o.g.setAttribute('transform','scale(0)');return;}
  const s=back(p,2.8), spin=(1-eOut(p))*-180;
  const idle=clamp((t-o.t0-0.38)/0.4);
  const dy=Math.sin(TAU*t*0.7+o.ph)*6*idle, wob=Math.sin(TAU*t*0.5+o.ph)*3*idle;
  o.g.setAttribute('transform',`translate(${o.x} ${o.y+dy}) rotate(${o.r+spin+wob}) scale(${s})`);});
 // はじけるハート
 burst.forEach(o=>{const p=clamp((t-HIT)/0.6);
  if(p<=0){o.g.setAttribute('transform','scale(0)');return;}
  const d=o.d*eOut(p), idle=clamp((t-HIT-0.6)/0.5);
  const a=o.a+0.12*Math.sin(TAU*t*0.3+o.ph)*idle;
  const x=HX+d*Math.cos(a)*1.25, y=HY+d*Math.sin(a)*0.95+Math.sin(TAU*t*0.8+o.ph)*8*idle;
  o.g.setAttribute('transform',`translate(${x} ${y}) rotate(${(1-p)*200+10*Math.sin(TAU*t*0.6+o.ph)}) scale(${back(clamp(p*1.6),2)})`);});
 sparks.forEach(o=>{const p=clamp((t-0.5-o.ph*0.1)/0.4);
  const s=(p<=0?0.0001:back(p))*o.s*(0.55+0.45*Math.abs(Math.sin(TAU*t*0.7+o.ph)));
  o.g.setAttribute('transform',`translate(${o.x} ${o.y}) rotate(${t*40}) scale(${s})`);});
};
if(location.hash.includes('transparent')){document.getElementById('bg').style.display='none';document.body.style.background='transparent';}
document.fonts.ready.then(()=>{const m=location.hash.match(/t=([\d.]+)/);render(m?parseFloat(m[1]):5);});
</script></body></html>
