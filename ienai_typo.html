<!doctype html><html><head><meta charset="utf-8">
<title>言えない タイポ</title>
<style>@font-face{font-family:"Mochiy Pop One";src:url(fonts/MochiyPopOne.ttf)}
html,body{margin:0;background:#00ff00;overflow:hidden}svg{display:block}</style></head><body>
<!-- #transparent で背景なし / #t=秒 でその瞬間を表示 -->
<svg id="art" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
 <path id="heartP" d="M0 14 C-28 -6 -15 -32 0 -15 C15 -32 28 -6 0 14Z"/>
 <path id="sparkP" d="M0 -22 Q3 -3 22 0 Q3 3 0 22 Q-3 3 -22 0 Q-3 -3 0 -22Z"/>
 <pattern id="dotsS" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.2" fill="#fff" opacity=".55"/><circle cx="12" cy="12" r="2.2" fill="#fff" opacity=".55"/></pattern>
 <pattern id="dotsBg" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="#fffafd"/><circle cx="12" cy="12" r="6" fill="#dff3ff"/><circle cx="37" cy="37" r="6" fill="#ffe3ef"/></pattern>
 <pattern id="gingP" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#ffd9e8"/><rect width="20" height="40" fill="#ff9cc4" opacity=".55"/><rect width="40" height="20" fill="#ff9cc4" opacity=".55"/></pattern>
 <pattern id="gingB" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#d9f1ff"/><rect width="20" height="40" fill="#86cdf7" opacity=".55"/><rect width="40" height="20" fill="#86cdf7" opacity=".55"/></pattern>
</defs>
<g id="stage"></g>
</svg>
<script>
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const stage=document.getElementById('stage'), defs=document.querySelector('defs');
const F1="Mochiy Pop One";
const clamp=x=>Math.max(0,Math.min(1,x));
const back=(x,c=2.2)=>1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);
const eOut=x=>1-Math.pow(1-x,3), eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const TAU=Math.PI*2;

function heart(fill,line,sc){const g=el('g',{});
 el('use',{href:'#heartP',fill:'#fff',stroke:'#fff','stroke-width':12,'stroke-linejoin':'round',transform:`scale(${sc})`},g);
 el('use',{href:'#heartP',fill,stroke:line,'stroke-width':3,transform:`scale(${sc})`},g);
 el('use',{href:'#heartP',fill:'url(#dotsS)',transform:`scale(${sc})`},g);
 el('ellipse',{cx:-9*sc,cy:-14*sc,rx:4.5*sc,ry:2.6*sc,fill:'#fff',transform:`rotate(-35 ${-9*sc} ${-14*sc})`},g);return g;}
function spark(fill,sc){const g=el('g',{});
 el('use',{href:'#sparkP',fill:'#fff',stroke:'#fff','stroke-width':9,'stroke-linejoin':'round',transform:`scale(${sc})`},g);
 el('use',{href:'#sparkP',fill,transform:`scale(${sc})`},g);return g;}
function bow(main,line,sc){const g=el('g',{});const b=el('g',{transform:`scale(${sc})`},g);
 const loopL='M0 0 C-30 -50 -95 -48 -92 -5 C-90 35 -35 30 0 0Z', loopR='M0 0 C30 -50 95 -48 92 -5 C90 35 35 30 0 0Z';
 const tails='M-8 6 L-40 78 L-22 70 L-14 90 L6 10Z M8 6 L40 78 L22 70 L14 90 L-6 10Z';
 [tails,loopL,loopR].forEach(d=>el('path',{d,fill:'#fff',stroke:'#fff','stroke-width':16,'stroke-linejoin':'round'},b));
 [tails,loopL,loopR].forEach(d=>{el('path',{d,fill:main,stroke:line,'stroke-width':4,'stroke-linejoin':'round'},b);el('path',{d,fill:'url(#dotsS)'},b);});
 el('path',{d:'M-60 -10 C-50 -22 -30 -20 -18 -8 M60 -10 C50 -22 30 -20 18 -8',fill:'none',stroke:line,'stroke-width':3,'stroke-linecap':'round',opacity:.7},b);
 el('rect',{x:-17,y:-17,width:34,height:34,rx:12,fill:main,stroke:line,'stroke-width':4},b);
 el('ellipse',{cx:-5,cy:-7,rx:6,ry:3.5,fill:'#fff'},b);return g;}

// ========== もこもこ吹き出し ==========
const B={x:960,y:520,rx:640,ry:300};
const bubble=el('g',{},stage);
const bumps=[];{const N=22;for(let i=0;i<N;i++){const a=i/N*TAU;bumps.push([B.rx*Math.cos(a),B.ry*Math.sin(a),i%2?78:92]);}}
const tailD='M-330 200 Q-420 330 -520 390 Q-330 380 -190 250Z';
function cloud(g,o,fill,dx=0,dy=0){const c=el('g',{transform:`translate(${dx} ${dy})`},g);
 el('ellipse',{cx:0,cy:0,rx:B.rx+o,ry:B.ry+o,fill},c);
 bumps.forEach(([x,y,r])=>el('circle',{cx:x,cy:y,r:r+o,fill},c));
 el('path',{d:tailD,fill,stroke:fill,'stroke-width':o*2,'stroke-linejoin':'round'},c);return c;}
(()=>{const g=bubble;
 cloud(g,16,'#4c9ad3',12,16);
 cloud(g,16,'#5fb0e6');
 cloud(g,9,'#fff');
 // レースの目
 bumps.forEach(([x,y,r])=>{const L=Math.hypot(x,y);el('circle',{cx:x+x/L*(r-6),cy:y+y/L*(r-6)*(B.rx/B.ry)*0.5,r:6,fill:'#ffc1da'},g);});
 cloud(g,0,'#f48fb8');
 cloud(g,-6,'url(#dotsBg)');
 el('ellipse',{cx:0,cy:0,rx:B.rx-10,ry:B.ry-30,fill:'none',stroke:'#ffb3d1','stroke-width':6,'stroke-dasharray':'20 14','stroke-linecap':'round'},g);
 el('ellipse',{cx:-380,cy:-250,rx:70,ry:22,fill:'#fff',transform:'rotate(-25 -380 -250)'},g);
 el('circle',{cx:-300,cy:-290,r:11,fill:'#fff'},g);
})();
const bowB=bow('#ffb3d1','#ef78a8',1.05);stage.appendChild(bowB);

// ========== チャック ==========
const Z={l:560,r:1360,y:770};
const zip=el('g',{},stage);
const zipTeeth=[];
(()=>{const g=zip;
 el('rect',{x:Z.l-26,y:Z.y-42,width:Z.r-Z.l+52,height:84,rx:42,fill:'#fff'},g);
 el('rect',{x:Z.l-16,y:Z.y-32,width:Z.r-Z.l+32,height:64,rx:32,fill:'#a9defb',stroke:'#4fa6e0','stroke-width':5},g);
 el('rect',{x:Z.l-16,y:Z.y-32,width:Z.r-Z.l+32,height:64,rx:32,fill:'url(#dotsS)'},g);
 el('line',{x1:Z.l,y1:Z.y-24,x2:Z.r,y2:Z.y-24,stroke:'#fff','stroke-width':3,'stroke-dasharray':'9 7'},g);
 el('line',{x1:Z.l,y1:Z.y+24,x2:Z.r,y2:Z.y+24,stroke:'#fff','stroke-width':3,'stroke-dasharray':'9 7'},g);
 for(let x=Z.l+8,k=0;x<=Z.r-8;x+=19,k++){
  const up=k%2===0;
  const r=el('rect',{x:x-8,y:Z.y-(up?16:0),width:16,height:16,rx:4,fill:'#ff9cc4',stroke:'#ef78a8','stroke-width':2.5},g);
  zipTeeth.push({r,x,up});}
})();
const pull=el('g',{},stage);
(()=>{const g=pull;
 el('rect',{x:-26,y:-26,width:52,height:52,rx:14,fill:'#fff'},g);
 el('rect',{x:-20,y:-20,width:40,height:40,rx:11,fill:'#ffb3d1',stroke:'#ef78a8','stroke-width':4},g);
 const tab=el('g',{transform:'translate(0 62)'},g);
 el('line',{x1:0,y1:-56,x2:0,y2:-20,stroke:'#fff','stroke-width':20,'stroke-linecap':'round'},tab);
 el('line',{x1:0,y1:-56,x2:0,y2:-20,stroke:'#ef78a8','stroke-width':8,'stroke-linecap':'round'},tab);
 tab.appendChild(heart('#ffb3d1','#ef78a8',1.9));
 g.tab=tab;})();

// ========== 言えない ==========
const chars=[];
function puffy(ch,size,c){
 const g=el('g',{}),base={'font-family':F1,'font-size':size,'text-anchor':'middle','stroke-linejoin':'round'};
 const T=a=>{const e=el('text',{...base,...a},g);e.textContent=ch;return e;};
 T({fill:c.dark,stroke:c.dark,'stroke-width':58,transform:'translate(9 14)'});
 T({fill:c.line,stroke:c.line,'stroke-width':58});
 T({fill:'#fff',stroke:'#fff','stroke-width':42});
 T({fill:c.line,stroke:c.line,'stroke-width':12});
 T({fill:c.fill});
 const id='ic'+chars.length;const cp=el('clipPath',{id},defs);const ct=el('text',base,cp);ct.textContent=ch;
 const sh=el('g',{'clip-path':`url(#${id})`},g);
 el('ellipse',{cx:-size*0.14,cy:-size*0.66,rx:size*0.42,ry:size*0.11,fill:'#fff',opacity:.7,transform:`rotate(-18 ${-size*0.14} ${-size*0.66})`},sh);
 return g;}
const PK={dark:'#d95b91',line:'#f27aaa',fill:'url(#gingP)'}, BL={dark:'#4c9ad3',line:'#5fb0e6',fill:'url(#gingB)'};
const sweat=el('g',{},stage),blush=el('g',{},stage);
const floaters=[];
function build(){
 [['言',500,615,-5,PK,330],['え',815,600,4,BL,300],['な',1112,612,-4,PK,300],['い',1415,598,5,BL,300]].forEach(([ch,x,y,r,c,s],i)=>{
  const g=puffy(ch,s,c);stage.appendChild(g);chars.push({g,x,y,r,t0:0.5+i*0.16,ph:i*1.2});});
 stage.appendChild(zip);stage.appendChild(pull);stage.appendChild(sweat);stage.appendChild(blush);
 // 汗
 const sd='M0 -34 C14 -12 22 2 22 14 C22 28 12 36 0 36 C-12 36 -22 28 -22 14 C-22 2 -14 -12 0 -34Z';
 el('path',{d:sd,fill:'#fff',stroke:'#fff','stroke-width':12,'stroke-linejoin':'round'},sweat);
 el('path',{d:sd,fill:'#b9e6ff',stroke:'#4fa6e0','stroke-width':4,'stroke-linejoin':'round'},sweat);
 el('ellipse',{cx:-7,cy:12,rx:5,ry:9,fill:'#fff'},sweat);
 // 照れ線
 [0,1,2].forEach(k=>el('line',{x1:k*24,y1:0,x2:k*24-15,y2:36,stroke:'#fff','stroke-width':16,'stroke-linecap':'round'},blush));
 [0,1,2].forEach(k=>el('line',{x1:k*24,y1:0,x2:k*24-15,y2:36,stroke:'#f27aaa','stroke-width':7,'stroke-linecap':'round'},blush));
 [[150,200,'#ffb3d1','#ef78a8',1.3],[1780,190,'#a9defb','#4fa6e0',1.3],[1800,700,'#ffb3d1','#ef78a8',1.0],[130,640,'#a9defb','#4fa6e0',1.0],[1500,990,'#a9defb','#4fa6e0',0.9],[820,1000,'#ffb3d1','#ef78a8',0.85],[1180,95,'#ffb3d1','#ef78a8',0.8]]
  .forEach(([x,y,f,l,s],i)=>{const g=heart(f,l,s);stage.appendChild(g);floaters.push({g,x,y,s:1,t0:1.2+i*0.1,ph:i*1.1,rot:i%2?14:-14,kind:'h'});});
 [[420,110,'#bfe8ff',1.2],[1560,90,'#ffd1e4',1.2],[1700,450,'#fff',0.9],[220,420,'#ffd1e4',0.9],[90,900,'#bfe8ff',0.8],[1850,900,'#ffd1e4',0.8],[1150,990,'#fff',0.8]]
  .forEach(([x,y,f,s],i)=>{const g=spark(f,s);stage.appendChild(g);floaters.push({g,x,y,s,t0:1.1+i*0.1,ph:i*0.9,kind:'s'});});
}
const ZS=1.75, ZE=2.75;   // チャックを閉める時間
window.render=function(t){
 // 吹き出し：しっぽからぽわん
 const bp=clamp(t/0.5),bs=bp<=0?0.0001:back(bp,2);
 const breath=1+0.012*Math.sin(TAU*t*0.5);
 const bT=`translate(${B.x-520} ${B.y+390}) scale(${bs*breath}) translate(520 -390)`;
 bubble.setAttribute('transform',bT);
 const bw=clamp((t-0.9)/0.4);
 bowB.setAttribute('transform',`translate(${B.x+470} ${B.y-300}) rotate(${18+Math.sin(TAU*t*0.6)*6}) scale(${bw<=0?0.0001:back(bw,3)})`);
 // チャック
 const zp=clamp((t-1.35)/0.35);
 const zs=zp<=0?0.0001:back(zp,2);
 zip.setAttribute('transform',`translate(960 ${Z.y}) scale(${zs} ${Math.min(1,zs)}) translate(-960 ${-Z.y})`);
 const prog=eIO(clamp((t-ZS)/(ZE-ZS)));
 const px=Z.l-10+(Z.r-Z.l+20)*prog;
 zipTeeth.forEach(o=>{const closed=o.x<px;o.r.setAttribute('transform',closed?'':`translate(0 ${o.up?-11:11})`);});
 const pv=clamp((t-1.5)/0.3);
 const swing=Math.sin(TAU*t*1.1)*8+(t>ZS&&t<ZE?-18:0)*Math.sin(Math.PI*clamp((t-ZS)/(ZE-ZS)))+(t>ZE?18*Math.sin((t-ZE)*14)*Math.exp(-(t-ZE)*4):0);
 pull.setAttribute('transform',`translate(${px} ${Z.y}) scale(${(pv<=0?0.0001:back(pv,3))*1.3})`);
 pull.tab.setAttribute('transform',`rotate(${swing}) translate(0 62)`);
 // 言えない：ぽんぽん→チャックでびくっ→もじもじ
 chars.forEach((o,i)=>{const p=clamp((t-o.t0)/0.42);
  if(p<=0){o.g.setAttribute('transform','translate(-9999 0)');return;}
  const s=back(p,2.6),idle=clamp((t-o.t0-0.42)/0.4);
  // チャックが通過した瞬間にびくっ
  const passT=ZS+(ZE-ZS)*clamp((o.x-Z.l)/(Z.r-Z.l));
  const f=clamp((t-passT)/0.45), flinch=f>0&&f<1?Math.sin(Math.PI*f)*(1-f*0.3):0;
  // ときどきぷるぷる
  const cyc=(t+o.ph*0.1)%2.2, shiv=t>ZE+0.5&&cyc<0.35?Math.sin(cyc*90)*3*(1-cyc/0.35):0;
  const dy=Math.sin(TAU*t*0.45+o.ph)*7*idle+flinch*-26;
  o.g.setAttribute('transform',`translate(${o.x+shiv} ${o.y+dy}) rotate(${o.r+(1-eOut(p))*-30+shiv*0.8+flinch*(i%2?6:-6)}) scale(${s*(1-0.08*flinch)} ${s*(1+0.1*flinch)})`);});
 // 汗と照れ線
 const sp=clamp((t-ZE-0.1)/0.35);
 sweat.setAttribute('transform',`translate(${1590} ${300+Math.max(0,(t-ZE-0.45))*0+Math.sin(TAU*t*0.6)*6}) rotate(18) scale(${sp<=0?0.0001:back(sp,3)})`);
 const lp=clamp((t-ZE-0.3)/0.35);
 blush.setAttribute('transform',`translate(${215} ${300+Math.sin(TAU*t*1.1)*3}) rotate(-8) scale(${lp<=0?0.0001:back(lp,3)*1.2})`);
 floaters.forEach(o=>{const p=clamp((t-o.t0)/0.4);const b=p<=0?0.0001:back(p,2.6);
  if(o.kind==='h')o.g.setAttribute('transform',`translate(${o.x} ${o.y+Math.sin(TAU*t*0.5+o.ph)*12}) rotate(${o.rot+Math.sin(TAU*t*0.4+o.ph)*10}) scale(${b*(1+0.06*Math.sin(TAU*t*1.2+o.ph))})`);
  else o.g.setAttribute('transform',`translate(${o.x} ${o.y}) rotate(${t*35+o.ph*20}) scale(${b*o.s*(0.6+0.4*Math.abs(Math.sin(TAU*t*0.6+o.ph)))})`);});
};
if(location.hash.includes('transparent'))document.body.style.background='transparent';
window.ready=document.fonts.load(`330px "${F1}"`,'言えない').then(()=>document.fonts.ready).then(()=>{
 build();const m=location.hash.match(/t=([\d.]+)/);render(m?parseFloat(m[1]):6);});
</script></body></html>
