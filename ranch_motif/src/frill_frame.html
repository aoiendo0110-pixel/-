<!doctype html><html><head><meta charset="utf-8"><title>フリルレースフレーム</title>
<style>html,body{margin:0;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/40px 40px}canvas{display:block;width:100vw;height:auto}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="motifs.js"></script>
<script>
// フリル＋レースの 16:9 フレーム (中央は透明 / 6秒ループ)
//   #yellow で黄色ベース、#green で黄緑ベース
const W = 1920, H = 1080, DUR = 6;
window.SPEC = { w: W, h: H, fps: 30, dur: DUR, alpha: true };
const ctx = document.getElementById('c').getContext('2d');
const { TAU, C } = M;
const mode = location.hash.slice(1);
const TH = {
  pink:   { base: '#ffc4da', line: 'rgba(255,255,255,0.55)', frill: C.yel, frillD: C.yelD, frillL: C.yelL, frill2: C.pink, frill2D: C.pinkD, frill2L: C.pinkLL, ribbon: C.grn, ribbonD: C.grnD },
  yellow: { base: '#ffeb94', line: 'rgba(255,255,255,0.6)', frill: C.pink, frillD: C.pinkD, frillL: C.pinkLL, frill2: C.grn, frill2D: C.grnD, frill2L: C.grnL, ribbon: C.pink, ribbonD: C.pinkD },
  green:  { base: '#d4f09a', line: 'rgba(255,255,255,0.6)', frill: C.pink, frillD: C.pinkD, frillL: C.pinkLL, frill2: C.yel, frill2D: C.yelD, frill2L: C.yelL, ribbon: C.pink, ribbonD: C.pinkD },
}[mode] || null;
const T = TH || { base: '#ffc4da', line: 'rgba(255,255,255,0.55)', frill: C.yel, frillD: C.yelD, frillL: C.yelL, frill2: C.pink, frill2D: C.pinkD, frill2L: C.pinkLL, ribbon: C.grn, ribbonD: C.grnD };

const B = 92; // 帯の太さ (窓はこの内側)
const sides = [ // [始点x, 始点y, 角度, 長さ]
  [B, B, 0, W - 2 * B], [W - B, B, Math.PI / 2, H - 2 * B], [W - B, H - B, Math.PI, W - 2 * B], [B, H - B, -Math.PI / 2, H - 2 * B],
];
const lace = { h: makeL(W), v: makeL(H) };
function makeL(len) { return M.makeLace(len, 32, { scallop: 30 }); }

// 帯の上のハート水玉の位置
const dots = [];
for (let x = 30; x < W; x += 92) for (const y of [30, H - 30]) dots.push([x + (y > H / 2 ? 46 : 0), y]);
for (let y = 122; y < H - 90; y += 92) for (const x of [30, W - 30]) dots.push([x, y + (x > W / 2 ? 46 : 0)]);

const SHADE = { yellow: 'rgba(240,190,60,0.4)', green: 'rgba(130,190,70,0.38)' }[mode] || 'rgba(240,110,165,0.38)';

function corner(cx, cy, rot, t, ph) {
  const tt = TAU * t / DUR;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.translate(38, 38); ctx.scale(1.08, 1.08);
  M.doily(ctx, 120, 120, 150, tt / 6 + ph);
  // 葉っぱ
  for (const [a, l] of [[-0.15, 95], [0.55, 82], [1.15, 95], [1.75, 75]]) M.leaf(ctx, 0, 0, l, a + Math.sin(tt + ph + a) * 0.05 + Math.PI / 2 + 0.2, {});
  M.clover(ctx, 165, 30, 86, 0.3 + Math.sin(tt + ph) * 0.08, { stem: false });
  M.clover(ctx, 30, 165, 66, -0.4 + Math.sin(tt + ph + 1) * 0.08, { stem: false, leaves: 3 });
  M.rose(ctx, 118, 125, 118, Math.sin(tt * 2 + ph) * 0.08);
  M.rose(ctx, 215, 110, 74, 0.5 + Math.sin(tt * 2 + ph + 1) * 0.1, { col: C.yel, dark: C.yelD, light: C.yelL });
  M.daisy(ctx, 100, 222, 70, Math.sin(tt * 2 + ph + 2) * 0.12);
  M.blossom(ctx, 190, 195, 50, Math.sin(tt * 2 + ph + 3) * 0.12, { petal: C.pink });
  M.bow(ctx, 58, 58, 118 * (1 + Math.sin(tt * 2 + ph) * 0.03), -Math.PI / 4 + Math.sin(tt + ph) * 0.05, C.pink, C.pinkD);
  M.pearlSwag(ctx, 270, 10, 10, 270, 60, 8);
  // 浮かぶハート
  const hp = ((t / DUR) * 2 + ph / TAU) % 1;
  ctx.globalAlpha = Math.sin(hp * Math.PI);
  M.jewelHeart(ctx, 250 + hp * 60, 250 + hp * 60, 40 + hp * 10, 0.2, C.pink);
  ctx.globalAlpha = 1;
  ctx.restore();
}

window.renderFrame = (t) => {
  const p = t / DUR, tt = TAU * p;
  ctx.clearRect(0, 0, W, H);
  // 帯: パールのキルティング
  M.quilt(ctx, 0, 0, W, H, 64, T.base, SHADE);
  // 窓を抜く
  ctx.clearRect(B, B, W - 2 * B, H - 2 * B);
  // 窓の内側へ: フリル → チュール → フリル → レース
  sides.forEach(([x, y, a, len], si) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    M.frill(ctx, len, 82, { col: T.frill, dark: T.frillD, light: T.frillL, pleat: 44, phase: tt * 2 + si, amp: 0.1 });
    M.tulle(ctx, len, 66, { phase: tt * 2 + si + 1, alpha: 0.7 });
    M.frill(ctx, len, 48, { col: T.frill2, dark: T.frill2D, light: T.frill2L, pleat: 36, phase: -tt * 2 + si * 2, amp: 0.12 });
    const L = (si % 2 ? lace.v : lace.h);
    ctx.drawImage(L, 0, 0, len, L.height, 0, -4, len, L.height);
    ctx.restore();
  });
  // ふちのリボンライン + ステッチ
  ctx.save();
  ctx.lineWidth = 14; ctx.strokeStyle = T.ribbon; ctx.strokeRect(B - 2, B - 2, W - 2 * B + 4, H - 2 * B + 4);
  ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.setLineDash([10, 8]); ctx.lineDashOffset = -p * 36 * 6;
  ctx.strokeRect(B - 2, B - 2, W - 2 * B + 4, H - 2 * B + 4);
  ctx.restore();
  // 上辺から垂れるパールの飾り鎖 + 小さいリボン
  const sw = [380, 600, 820, 1100, 1320, 1540];
  for (let i = 0; i < sw.length - 1; i++) {
    if (i === 2) continue; // まんなかは大きいリボン
    M.pearlSwag(ctx, sw[i], B + 70, sw[i + 1], B + 70, 46 + Math.sin(tt * 2 + i) * 6, 7);
  }
  for (const [i, x] of sw.entries()) M.bow(ctx, x, B + 66, 46, Math.sin(tt * 2 + i) * 0.08, i % 2 ? C.yel : C.pink, i % 2 ? C.yelD : C.pinkD);
  // 上: ティアラ + 大きいリボン / 下: ドイリーに宝石ハート / 左右: 宝石ハート
  M.pearlSwag(ctx, 820, B + 70, 1100, B + 70, 80 + Math.sin(tt * 2) * 6, 8);
  M.bow(ctx, W / 2, B + 22, 200 * (1 + 0.03 * Math.sin(tt * 2)), Math.sin(tt) * 0.04, C.pink, C.pinkD);
  M.crown(ctx, W / 2, B - 44, 96, Math.sin(tt) * 0.05);
  M.doily(ctx, W / 2, H - B, 70, tt / 6);
  M.jewelHeart(ctx, W / 2, H - B + 4, 78 * (1 + 0.08 * Math.sin(tt * 2)), 0, C.pink);
  for (const [x, r] of [[B, -Math.PI / 2], [W - B, Math.PI / 2]]) {
    ctx.save(); ctx.translate(x, H / 2); ctx.rotate(r);
    M.doily(ctx, 0, 0, 52, tt / 6);
    M.jewelHeart(ctx, 0, 4, 58 * (1 + 0.08 * Math.sin(tt * 2 + 1)), 0, x < W / 2 ? C.yel : C.grn, {});
    ctx.restore();
  }
  // 四隅の花束
  corner(0, 0, 0, t, 0);
  corner(W, 0, Math.PI / 2, t, 1.6);
  corner(W, H, Math.PI, t, 3.2);
  corner(0, H, -Math.PI / 2, t, 4.8);
  // 窓の下からのぼるシャボン玉
  for (let i = 0; i < 10; i++) {
    const u = (i / 10 + p) % 1, left = i % 2 === 0;
    const x = (left ? 220 : W - 220) + Math.sin(TAU * (u * 2 + i * 0.3)) * 40 + (left ? 1 : -1) * (i % 5) * 30;
    const y = H - 170 - u * 520;
    ctx.globalAlpha = Math.sin(u * Math.PI);
    M.bubble(ctx, x, y, 16 + (i % 3) * 9, u);
  }
  ctx.globalAlpha = 1;
  // 帯のラメ
  M.glitter(ctx, p, 50, 0, 0, W, B - 10, 3, 14);
  M.glitter(ctx, p, 50, 0, H - B + 10, W, B - 10, 4, 14);
  M.glitter(ctx, p, 20, 0, B, B - 10, H - 2 * B, 5, 12);
  M.glitter(ctx, p, 20, W - B + 10, B, B - 10, H - 2 * B, 6, 12);
};
window.renderFrame(0);
</script></body></html>
