<!doctype html><html><head><meta charset="utf-8"><title>3Dフリルハート</title>
<style>html,body{margin:0;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/40px 40px}canvas{display:block;width:min(100vw,100vh);height:auto}</style></head><body>
<script type="module">
// 3Dモデル: フリルに包まれたぷっくりハート + 周りを回るクローバー・お花・パール (6秒ループ / 透過)
import * as THREE from '../../three.module.min.js';
const S = 1080, DUR = 6, TAU = Math.PI * 2;
window.SPEC = { w: S, h: S, fps: 30, dur: DUR, alpha: true };

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(S, S);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x000000, 0);
renderer.domElement.id = 'c';
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0.6, 11); camera.lookAt(0, 0, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0xffd0e0, 1.7));
const key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(3, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0xfff0a0, 1.3); rim.position.set(-4, 1, -3); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffc0d8, 0.8); fill.position.set(-3, -2, 4); scene.add(fill);

const mat = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.38, clearcoat: 0.9, clearcoatRoughness: 0.3, sheen: 0.5, sheenColor: new THREE.Color(0xffffff), ...o });
const PINK = mat(0xff7fb0), PINK_L = mat(0xffc2da), YEL = mat(0xffe27a, { side: THREE.DoubleSide }), GRN = mat(0x9fdc4f), GRN_D = mat(0x6fb83a),
  WHITE = mat(0xfffaf5, { side: THREE.DoubleSide }), PEARL = mat(0xfff4f7, { roughness: 0.15, clearcoat: 1, sheen: 1, sheenColor: new THREE.Color(0xffc8dc) });
const LINE = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide });
// ゆめかわ用: 虹色にきらめくハート・金・シャボン玉
const HOLO = mat(0xff9cc6, { iridescence: 1, iridescenceIOR: 2.0, iridescenceThicknessRange: [300, 800], roughness: 0.25, clearcoat: 1 });
const GOLD = mat(0xffd36b, { metalness: 0.55, roughness: 0.25, clearcoat: 1 });
const BUB = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.42, roughness: 0.05, iridescence: 1, iridescenceIOR: 1.8, iridescenceThicknessRange: [300, 900], clearcoat: 1, depthWrite: false });
const LAV = mat(0xeadcff, { iridescence: 0.6 });

function heartShape(k = 1) {
  const h = new THREE.Shape();
  h.moveTo(0, -1 * k);
  h.bezierCurveTo(-0.15 * k, -0.78 * k, -1.08 * k, -0.42 * k, -1.08 * k, 0.28 * k);
  h.bezierCurveTo(-1.08 * k, 0.86 * k, -0.48 * k, 1.06 * k, 0, 0.6 * k);
  h.bezierCurveTo(0.48 * k, 1.06 * k, 1.08 * k, 0.86 * k, 1.08 * k, 0.28 * k);
  h.bezierCurveTo(1.08 * k, -0.42 * k, 0.15 * k, -0.78 * k, 0, -1 * k);
  return h;
}
function centered(geo) { geo.computeBoundingBox(); const c = new THREE.Vector3(); geo.boundingBox.getCenter(c); geo.translate(-c.x, -c.y, -c.z); return geo; }

// ---- まんなかのぷっくりハート ----
const root = new THREE.Group(); scene.add(root);
const hero = new THREE.Group(); root.add(hero);
const heartGeo = centered(new THREE.ExtrudeGeometry(heartShape(1), { depth: 0.18, bevelEnabled: true, bevelThickness: 0.32, bevelSize: 0.2, bevelSegments: 14, curveSegments: 64 }));
hero.add(new THREE.Mesh(heartGeo, HOLO));
const hl = new THREE.Mesh(heartGeo, LINE); hl.scale.set(1.04, 1.04, 1.1); hero.add(hl);
// つやの白い点 (表と裏)
for (const z of [1, -1]) {
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.13, 20, 14), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  d.scale.set(1.6, 0.8, 0.3); d.position.set(-0.55 * z, 0.45, 0.43 * z); d.rotation.z = 0.7 * z; hero.add(d);
  const d2 = d.clone(); d2.scale.set(0.5, 0.5, 0.3); d2.position.set(-0.3 * z, 0.62, 0.42 * z); hero.add(d2);
}

// ---- ハートのふちのフリル (ハートの外形に沿って波打つ帯) ----
const outline = heartShape(1).getSpacedPoints(480).slice(0, -1);
{ let cx = 0, cy = 0; outline.forEach((p) => { cx += p.x; cy += p.y; }); /* 外形の中心は heartGeo と同じく bbox 中心に合わせる */ }
const bb = new THREE.Box2().setFromPoints(outline); const bc = new THREE.Vector2(); bb.getCenter(bc);
outline.forEach((p) => p.sub(bc));
function ruffle(off, width, amp, waves, material, lift = 0) {
  const M = outline.length, K = 8, pos = [], idx = [];
  for (let i = 0; i <= M; i++) {
    const a = outline[(i - 1 + M) % M], b = outline[(i + 1) % M], p = outline[i % M];
    const tx = b.x - a.x, ty = b.y - a.y, l = Math.hypot(tx, ty);
    const nx = ty / l, ny = -tx / l; // 時計回りなら外向き
    const s = i / M;
    for (let j = 0; j <= K; j++) {
      const v = j / K;
      const r = off + v * width * (1 + 0.12 * Math.cos(waves * TAU * s));
      pos.push(p.x + nx * r * dir, p.y + ny * r * dir, amp * Math.pow(v, 1.3) * Math.sin(waves * TAU * s) + lift * v);
    }
  }
  for (let i = 0; i < M; i++) for (let j = 0; j < K; j++) {
    const a = i * (K + 1) + j, b = a + K + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, material);
}
// 向き判定: 外形の符号付き面積
let area = 0; for (let i = 0; i < outline.length; i++) { const p = outline[i], q = outline[(i + 1) % outline.length]; area += p.x * q.y - q.x * p.y; }
const dir = area > 0 ? 1 : -1;
hero.add(ruffle(0.12, 0.62, 0.16, 26, YEL));
hero.add(ruffle(0.1, 0.3, 0.045, 30, WHITE, 0.0));
// ふちのパール
const pearlGeo = new THREE.SphereGeometry(0.075, 18, 14);
for (let i = 0; i < 40; i++) {
  const k = Math.floor((i / 40) * outline.length), L = outline.length;
  const p = outline[k], a = outline[(k - 1 + L) % L], b = outline[(k + 1) % L];
  const tx = b.x - a.x, ty = b.y - a.y, l = Math.hypot(tx, ty), r = 0.24 * dir;
  for (const z of [0.16, -0.16]) { const m = new THREE.Mesh(pearlGeo, PEARL); m.position.set(p.x + (ty / l) * r, p.y - (tx / l) * r, z); hero.add(m); }
}

// ---- 小物 ----
const leafGeo = (() => {
  const g = centered(new THREE.ExtrudeGeometry(heartShape(0.36), { depth: 0.03, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.03, bevelSegments: 6, curveSegments: 32 }));
  g.rotateZ(Math.PI); g.scale(0.82, 1, 1); g.computeBoundingBox(); g.translate(0, -g.boundingBox.min.y + 0.03, 0); return g; // 先端を原点に
})();
function clover(n = 4, scale = 1) {
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) {
    const arm = new THREE.Group(); arm.rotation.z = (i / n) * TAU + (n === 4 ? Math.PI / 4 : 0);
    const tilt = new THREE.Group(); tilt.rotation.x = -0.25; arm.add(tilt);
    const l = new THREE.Mesh(leafGeo, GRN); tilt.add(l);
    const o = new THREE.Mesh(leafGeo, LINE); o.scale.set(1.1, 1.06, 1.4); tilt.add(o);
    g.add(arm);
  }
  const c = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), PINK); c.position.z = 0.06; g.add(c);
  g.scale.setScalar(scale); return g;
}
function daisy(petalMat = WHITE, centerMat = YEL, scale = 1, n = 12) {
  const g = new THREE.Group();
  const pg = new THREE.SphereGeometry(0.1, 16, 10);
  for (let i = 0; i < n; i++) {
    const p = new THREE.Mesh(pg, petalMat); const a = (i / n) * TAU;
    p.scale.set(0.9, 2.5, 0.35); p.position.set(Math.cos(a + Math.PI / 2) * 0.3, Math.sin(a + Math.PI / 2) * 0.3, 0); p.rotation.z = a; g.add(p);
  }
  const c = new THREE.Mesh(new THREE.SphereGeometry(0.14, 20, 14), centerMat); c.scale.set(1, 1, 0.55); c.position.z = 0.04; g.add(c);
  g.scale.setScalar(scale); return g;
}
function miniHeart(m, scale = 1) {
  const g = new THREE.Group();
  const geo = centered(new THREE.ExtrudeGeometry(heartShape(0.3), { depth: 0.06, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.07, bevelSegments: 8, curveSegments: 32 }));
  g.add(new THREE.Mesh(geo, m));
  const o = new THREE.Mesh(geo, LINE); o.scale.set(1.08, 1.08, 1.2); g.add(o);
  g.scale.setScalar(scale); return g;
}

// ハートの上に飾るコサージュ (表・裏)
for (const z of [1, -1]) {
  const cor = new THREE.Group(); cor.position.set(0.62 * z, 0.62, 0.42 * z); cor.rotation.y = z > 0 ? 0 : Math.PI; hero.add(cor);
  const c1 = clover(4, 0.62); c1.position.set(0.22, 0.12, -0.02); c1.rotation.z = 0.4; cor.add(c1);
  const d1 = daisy(WHITE, YEL, 0.75); d1.position.set(-0.1, -0.05, 0.08); cor.add(d1);
  const d2 = daisy(YEL, PINK, 0.48); d2.position.set(0.18, -0.35, 0.1); cor.add(d2);
}

// ティアラ (左の山にちょこんと)
function tiara(scale = 1) {
  const g = new THREE.Group();
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.46, 0.16, 48, 1, true), GOLD); band.material.side = THREE.DoubleSide; g.add(band);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU, big = i % 2 === 0;
    const sp = new THREE.Mesh(new THREE.ConeGeometry(0.075, big ? 0.36 : 0.22, 12), GOLD);
    sp.position.set(Math.cos(a) * 0.42, 0.08 + (big ? 0.18 : 0.11), Math.sin(a) * 0.42); g.add(sp);
    const pr = new THREE.Mesh(new THREE.SphereGeometry(big ? 0.07 : 0.05, 16, 12), PEARL); pr.position.set(Math.cos(a) * 0.42, 0.08 + (big ? 0.37 : 0.23), Math.sin(a) * 0.42); g.add(pr);
    const gem = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), big ? PINK : GRN); gem.position.set(Math.cos(a) * 0.47, 0, Math.sin(a) * 0.47); g.add(gem);
  }
  g.scale.setScalar(scale); return g;
}
const tr = tiara(1.05); tr.position.set(0, 0.98, 0); tr.rotation.x = 0.15; hero.add(tr);
// リボン (下のとんがりに)
function ribbonBow(m, scale = 1) {
  const g = new THREE.Group();
  for (const sd of [-1, 1]) {
    const loop = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.1, 16, 40), m); loop.scale.set(1.1, 0.75, 0.6); loop.position.x = sd * 0.3; loop.rotation.z = sd * 0.25; g.add(loop);
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.5, 0.06), m); tail.position.set(sd * 0.16, -0.3, 0); tail.rotation.z = sd * 0.35; g.add(tail);
  }
  const knot = new THREE.Mesh(new THREE.SphereGeometry(0.14, 20, 14), m); knot.scale.set(1, 1.1, 0.8); g.add(knot);
  g.scale.setScalar(scale); return g;
}
for (const z of [1, -1]) { const rb = ribbonBow(PINK, 0.85); rb.position.set(0, -0.78, 0.5 * z); rb.rotation.y = z > 0 ? 0 : Math.PI; hero.add(rb); }
function star3d(m, scale = 1) {
  const sh = new THREE.Shape();
  for (let i = 0; i < 10; i++) { const a = Math.PI / 2 + (i / 10) * TAU, r = i % 2 ? 0.17 : 0.36; i ? sh.lineTo(Math.cos(a) * r, Math.sin(a) * r) : sh.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  const geo = centered(new THREE.ExtrudeGeometry(sh, { depth: 0.06, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.06, bevelSegments: 6 }));
  const g = new THREE.Group(); g.add(new THREE.Mesh(geo, m));
  const o = new THREE.Mesh(geo, LINE); o.scale.set(1.1, 1.1, 1.3); g.add(o);
  g.scale.setScalar(scale); return g;
}
function bubble3d(scale = 1) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 24), BUB); m.scale.setScalar(scale); return m; }
// パールのネックレスの輪 (斜め)
const necklace = new THREE.Group(); necklace.rotation.set(-0.5, 0, 0.35); root.add(necklace);
for (let i = 0; i < 44; i++) { const a = (i / 44) * TAU; const m = new THREE.Mesh(new THREE.SphereGeometry(i % 4 ? 0.06 : 0.085, 16, 12), PEARL); m.position.set(Math.cos(a) * 1.85, 0, Math.sin(a) * 1.85); necklace.add(m); }
// 周りを回るリング
const ring = new THREE.Group(); ring.rotation.x = 0.32; ring.rotation.z = -0.12; root.add(ring);
const orbit = new THREE.Group(); ring.add(orbit);
const items = [];
const kinds = [() => clover(4, 0.75), () => star3d(YEL, 0.9), () => daisy(WHITE, YEL, 0.7), () => bubble3d(1), () => miniHeart(LAV, 1), () => ribbonBow(PINK, 0.75),
  () => clover(3, 0.7), () => star3d(GRN, 0.8), () => daisy(PINK_L, YEL, 0.65), () => bubble3d(0.8), () => miniHeart(YEL, 1), () => ribbonBow(YEL, 0.75)];
const RAD = 2.55;
kinds.forEach((mk, i) => {
  const a = (i / kinds.length) * TAU;
  const o = mk(); o.position.set(Math.cos(a) * RAD, 0, Math.sin(a) * RAD); orbit.add(o); items.push({ o, a, ph: i * 1.3 });
  // あいだにパール
  const a2 = a + TAU / kinds.length / 2;
  const pr = new THREE.Mesh(new THREE.SphereGeometry(0.11, 20, 14), PEARL); pr.position.set(Math.cos(a2) * RAD, 0, Math.sin(a2) * RAD); orbit.add(pr);
});

// キラキラ (板ポリ)
function sparkTex(color) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
  const star = () => { g.beginPath(); g.moveTo(64, 6); g.quadraticCurveTo(70, 58, 122, 64); g.quadraticCurveTo(70, 70, 64, 122); g.quadraticCurveTo(58, 70, 6, 64); g.quadraticCurveTo(58, 58, 64, 6); g.closePath(); };
  g.lineJoin = 'round'; star(); g.lineWidth = 12; g.strokeStyle = '#fff'; g.stroke(); star(); g.fillStyle = color; g.fill();
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const sparks = [[-2.6, 2.3, 1, '#ffe46b', 0.6, 0], [2.7, 1.9, 1, '#ffffff', 0.5, 1.7], [2.4, -2.4, 1, '#c9f07e', 0.55, 3.1], [-2.5, -2.0, 1, '#ff9cc4', 0.5, 4.4], [0.2, 2.9, 1, '#ffffff', 0.4, 2.2], [-1.2, -2.8, 1, '#e9dcff', 0.45, 5.0], [1.5, 2.7, 1, '#ffd0e6', 0.4, 0.8], [-2.9, 0.3, 1, '#ffffff', 0.35, 3.6], [2.95, -0.4, 1, '#fff3a8', 0.42, 1.1]]
  .map(([x, y, z, col, s, ph]) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({ map: sparkTex(col), transparent: true, depthWrite: false })); m.position.set(x, y, z); scene.add(m); return { m, ph }; });

window.renderFrame = (t) => {
  const u = (t % DUR) / DUR;
  hero.rotation.y = u * TAU;                         // くるっと1回転
  hero.rotation.z = 0.08 * Math.sin(u * TAU * 2);
  root.position.y = 0.12 * Math.sin(u * TAU * 2);    // ふわふわ
  const pop = 1 + 0.035 * Math.sin(u * TAU * 4);     // どきどき
  hero.scale.set(pop, pop, pop);
  orbit.rotation.y = -u * TAU;                       // リングは逆回転
  necklace.rotation.y = u * TAU / 2;                  // 44粒なので半回転でもつながる
  items.forEach(({ o, ph }) => { o.rotation.y = u * TAU * 2 + ph; o.rotation.z = 0.25 * Math.sin(u * TAU * 2 + ph); o.position.y = 0.12 * Math.sin(u * TAU * 3 + ph); });
  sparks.forEach(({ m, ph }) => { const k = 0.3 + 0.7 * Math.pow(Math.abs(Math.sin(u * TAU * 2 + ph)), 2); m.scale.setScalar(k); m.rotation.z = u * TAU * 0.5; });
  renderer.render(scene, camera);
};
window.renderFrame(0.4);
</script></body></html>
