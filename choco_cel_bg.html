<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Choco Satin Salon</title>
<style>html,body{margin:0;padding:0;background:#fdf4ea}svg{display:block}</style>
</head>
<body>
<div id="stage"></div>
<svg id="measure" width="0" height="0" style="position:absolute"><path id="mp"/></svg>
<script>
// Flat, thick-outline pastel style (no gradients, no gloss)
const Q=new URLSearchParams(location.search);
const W=+(Q.get('w')||1920), H=+(Q.get('h')||1080);

const LINE='#a3604d';
const P={
  cream:'#fff6f3', ivory:'#fffaf6', beige:'#e9c28e', biscuit:'#e8b98a',
  pink1:'#fbd9e2', pink2:'#f8c6d4', pink3:'#ff9fbc', rose:'#e2506a',
  berry:'#e2506a', choco:'#85503f', chocoD:'#5c3125', chocoL:'#b07a64', white:'#fffdfb'
};

// ---------- utils ----------
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(2024), rr=(a,b)=>a+(b-a)*R();
const f=n=>(+n).toFixed(1);
// tone shift: k<0 darker (warm), k>0 lighter
function shade(hex,k){
  if(!hex.startsWith('#'))return hex;
  let [r,g,b]=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
  if(k<0){const t=-k;r=r*(1-t)+90*t*0.35;g=g*(1-t)+30*t*0.35;b=b*(1-t)+40*t*0.35;}
  else{r=r+(255-r)*k;g=g+(255-g)*k;b=b+(255-b)*k;}
  return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
}
function tp(d,cx,cy,s,rot=0){
  const c=Math.cos(rot*Math.PI/180),sn=Math.sin(rot*Math.PI/180);
  const toks=d.match(/[MLCQZ]|-?\d*\.?\d+/g);let out='',buf=[];
  for(const t of toks){if(/[MLCQZ]/.test(t)){out+=t+' ';continue}buf.push(+t);
    if(buf.length===2){const[x,y]=buf;buf=[];out+=f(cx+(x*c-y*sn)*s)+','+f(cy+(x*sn+y*c)*s)+' '}}
  return out;
}
function mx(d){let i=0;return d.replace(/-?\d*\.?\d+/g,n=>(i++%2===0)?String(-n):n)}
const mp=document.getElementById('mp');
function along(d,step){mp.setAttribute('d',d);const L=mp.getTotalLength(),n=Math.max(1,Math.round(L/step)),o=[];
  for(let i=0;i<n;i++){const p=mp.getPointAtLength(i*L/n);o.push({x:p.x,y:p.y})}return o}
const circ=(cx,cy,r)=>`M${f(cx-r)},${f(cy)} A${f(r)},${f(r)} 0 1 0 ${f(cx+r)},${f(cy)} A${f(r)},${f(r)} 0 1 0 ${f(cx-r)},${f(cy)} Z`;
const ell=(cx,cy,rx,ry)=>`M${f(cx-rx)},${f(cy)} A${f(rx)},${f(ry)} 0 1 0 ${f(cx+rx)},${f(cy)} A${f(rx)},${f(ry)} 0 1 0 ${f(cx-rx)},${f(cy)} Z`;
const rect=(x,y,w,h,r=0)=>`M${f(x+r)},${f(y)} L${f(x+w-r)},${f(y)} Q${f(x+w)},${f(y)} ${f(x+w)},${f(y+r)} L${f(x+w)},${f(y+h-r)} Q${f(x+w)},${f(y+h)} ${f(x+w-r)},${f(y+h)} L${f(x+r)},${f(y+h)} Q${f(x)},${f(y+h)} ${f(x)},${f(y+h-r)} L${f(x)},${f(y+r)} Q${f(x)},${f(y)} ${f(x+r)},${f(y)} Z`;
// O(): union outline — stroke pass under, fill pass on top
// O(): tone-on-tone thin outline + cel shading (shadow rim bottom-right)
function O(items,lw,sz){
  const sc=sz||lw*15, o=Math.max(1.4,sc*0.075);
  let a='',b='';
  for(const [d,fill] of items){
    const dk=fill.startsWith('#')?shade(fill,-0.3):LINE;
    a+=`<path d="${d}" fill="${dk}" stroke="${dk}" stroke-width="${f(lw*0.95)}" stroke-linejoin="round"/>`;
    if(!fill.startsWith('#')){b+=`<path d="${d}" fill="${fill}"/>`;continue}
    const id='k'+(uid++);
    b+=`<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})"><path d="${d}" fill="${shade(fill,-0.12)}"/><path d="${d}" fill="${fill}" transform="translate(${f(-o)},${f(-o*0.9)})"/></g>`;
  }
  return a+b;
}
const Ln=(d,lw,col=LINE,extra='')=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${f(col===LINE?lw*0.55:lw)}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
const lwOf=s=>Math.max(2.4,Math.min(5,s*0.065));
const HEART='M0,0.45 C-0.1,0.33 -0.5,0.1 -0.5,-0.18 C-0.5,-0.4 -0.3,-0.5 -0.18,-0.48 C-0.08,-0.46 -0.02,-0.38 0,-0.3 C0.02,-0.38 0.08,-0.46 0.18,-0.48 C0.3,-0.5 0.5,-0.4 0.5,-0.18 C0.5,0.1 0.1,0.33 0,0.45 Z';
let uid=0;
const HL=(d,w,op=.85)=>`<path d="${d}" fill="none" stroke="#fff" stroke-opacity="${op}" stroke-width="${f(w)}" stroke-linecap="round"/>`;
// satin sheen: dappled light & dark patches clipped to a ribbon
function satin(poly,pts,w,fill){
  const id='s'+(uid++);let g=`<clipPath id="${id}"><path d="${poly}"/></clipPath><g clip-path="url(#${id})">`;
  const Rr=rng(pts.length*7+Math.round(pts[0].x));
  for(let i=2;i<pts.length-2;i+=4){
    const a=pts[i-1],b=pts[i+1],ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI,p=pts[i];
    const side=(Rr()-.5)*w*0.5, L=w*(0.5+Rr()*0.9);
    const nx=-Math.sin(ang*Math.PI/180)*side, ny=Math.cos(ang*Math.PI/180)*side;
    if(Rr()<.55) g+=`<ellipse cx="${f(p.x+nx)}" cy="${f(p.y+ny)}" rx="${f(L)}" ry="${f(w*(0.12+Rr()*0.14))}" fill="${shade(fill,.45)}" fill-opacity=".9" transform="rotate(${f(ang+(Rr()-.5)*30)} ${f(p.x+nx)} ${f(p.y+ny)})"/>`;
    else g+=`<ellipse cx="${f(p.x+nx)}" cy="${f(p.y+ny)}" rx="${f(L*0.8)}" ry="${f(w*0.3)}" fill="${shade(fill,-0.12)}" transform="rotate(${f(ang+90*(Rr()<.3))} ${f(p.x+nx)} ${f(p.y+ny)})"/>`;
  }
  return g+'</g>';
}

// ---------- flat motifs ----------
function fHeart(cx,cy,s,rot,fill){return O([[tp(HEART,cx,cy,s,rot),fill]],lwOf(s),s)+HL(tp('M-0.32,-0.2 Q-0.32,-0.36 -0.17,-0.38',cx,cy,s,rot),Math.max(1.5,s*0.06))+`<circle cx="${f(cx+0.3*s)}" cy="${f(cy-0.26*s)}" r="${f(s*0.03)}" fill="#fff" fill-opacity=".8"/>`}
function fBow(cx,cy,s,rot,fill,knotFill){
  const lw=lwOf(s*0.9);
  const LOOP='M-0.1,-0.06 C-0.26,-0.44 -0.64,-0.66 -0.88,-0.52 C-1.1,-0.38 -1.1,0.04 -0.9,0.22 C-0.72,0.38 -0.36,0.26 -0.1,0.08 Z';
  const TAIL='M-0.12,0.06 C-0.24,0.28 -0.44,0.5 -0.68,0.72 L-0.48,0.75 L-0.42,0.92 C-0.22,0.72 -0.02,0.46 0.1,0.12 Z';
  const KNOT='M-0.17,-0.13 Q-0.18,-0.21 -0.1,-0.21 L0.1,-0.21 Q0.18,-0.21 0.17,-0.13 L0.14,0.14 Q0.13,0.21 0.07,0.21 L-0.07,0.21 Q-0.13,0.21 -0.14,0.14 Z';
  const T=d=>tp(d,cx,cy,s,rot);
  let g=O([[T(TAIL),fill],[T(mx(TAIL)),fill]],lw);
  g+=O([[T(LOOP),fill],[T(mx(LOOP)),fill]],lw);
  {const fc=fill.startsWith('#')?shade(fill,-0.22):LINE;g+=Ln(T('M-0.2,0.02 C-0.4,-0.1 -0.58,-0.12 -0.7,-0.02'),lw*0.5,fc)+Ln(T(mx('M-0.2,0.02 C-0.4,-0.1 -0.58,-0.12 -0.7,-0.02')),lw*0.5,fc);}
  if(fill.startsWith('#')){
    const id='bw'+(uid++);let dots='';
    for(let i=-5;i<=5;i++)for(let j=-3;j<=5;j++){const x=i*0.24+(j%2)*0.12,y=j*0.2-0.04;dots+=`<circle cx="${f(cx+x*s)}" cy="${f(cy+y*s)}" r="${f(s*0.045)}" fill="#fff" fill-opacity=".85"/>`}
    g+=`<clipPath id="${id}"><path d="${T(LOOP)} ${T(mx(LOOP))} ${T(TAIL)} ${T(mx(TAIL))}"/></clipPath><g clip-path="url(#${id})">${dots}</g>`;
    g+=HL(T('M-0.78,-0.36 Q-0.66,-0.5 -0.46,-0.46'),s*0.06)+HL(T(mx('M-0.78,-0.36 Q-0.66,-0.5 -0.46,-0.46')),s*0.06);
  }
  g+=O([[T(KNOT),knotFill||fill]],lw)+HL(T('M-0.07,-0.13 L0.06,-0.13'),s*0.04);
  return g;
}
const BERRY='M0,0.5 C-0.36,0.36 -0.5,0 -0.45,-0.22 C-0.4,-0.44 0.4,-0.44 0.45,-0.22 C0.5,0 0.36,0.36 0,0.5 Z';
function fBerry(cx,cy,s,rot,dip){
  const lw=lwOf(s), T=d=>tp(d,cx,cy,s,rot), id='b'+(uid++);
  let g=O([[T(BERRY),P.berry]],lw,s)+HL(T('M-0.3,-0.16 Q-0.32,0 -0.24,0.14'),s*0.05,.7);
  if(dip){
    const col=dip==='choco'?P.choco:dip==='pink'?'#f7a6bf':P.ivory;
    const wave='M-0.6,0.04 Q-0.42,0.16 -0.26,0.06 Q-0.12,0.18 0,0.06 Q0.14,0.18 0.26,0.06 Q0.42,0.16 0.6,0.04';
    g+=`<clipPath id="${id}"><path d="${T(BERRY)}"/></clipPath><g clip-path="url(#${id})"><path d="${T(wave+' L0.6,0.7 L-0.6,0.7 Z')}" fill="${col}"/>${Ln(T(wave),lw)}</g>`;
  }
  for(const [x,y] of [[-0.2,-0.18],[0.2,-0.18],[0,-0.06],[-0.24,0.0],[0.24,0.0]]){ if(dip&&y>0.0)continue;
    g+=Ln(T(`M${x},${y} L${x},${y+0.06}`),lw*0.8,'#ffe7a6')}
  const G='#5f9a6e';g+=Ln(T('M-0.3,-0.36 Q-0.14,-0.24 0,-0.34 Q0.14,-0.24 0.3,-0.36'),lw*1.3,G)+Ln(T('M0,-0.34 L0,-0.52'),lw*1.3,G)+Ln(T('M-0.16,-0.36 L-0.2,-0.5'),lw*1.3,G)+Ln(T('M0.16,-0.36 L0.2,-0.5'),lw*1.3,G);
  return g;
}
function fCandy(cx,cy,s,rot){
  const lw=lwOf(s*0.8),T=d=>tp(d,cx,cy,s,rot),id='c'+(uid++);
  const end='M0.28,-0.1 Q0.42,-0.28 0.56,-0.36 Q0.52,-0.12 0.62,0.06 Q0.46,0.06 0.3,0.12 Z';
  let g=O([[T(end),P.pink3],[T(mx(end).replace(/(-?\d*\.?\d+),(-?\d*\.?\d+)/g,(m,a,b)=>a+','+(-b)) ),P.pink3]],lw);
  g+=Ln(T('M0.32,0 Q0.44,-0.04 0.52,-0.14'),lw)+Ln(T('M-0.32,0 Q-0.44,0.04 -0.52,0.14'),lw);
  const body=circ(cx,cy,s*0.3);
  let st='';for(let k=-3;k<=3;k++){const x=k*0.1;st+=`<path d="${T(`M${x-0.05},-0.4 L${x+0.05},-0.4 L${x+0.05},0.4 L${x-0.05},0.4 Z`)}" fill="${k%2?P.pink3:P.pink1}"/>`;}
  g+=O([[body,P.pink1]],lw)+`<clipPath id="${id}"><path d="${body}"/></clipPath><g clip-path="url(#${id})">${st}`;
  for(let k=-3;k<=3;k++){const x=k*0.1+0.05;g+=Ln(T(`M${x},-0.4 L${x},0.4`),lw*0.8)}
  g+=`</g>`+Ln(body,lw);
  return g;
}
function fCupcake(cx,cy,s,frost){
  const lw=lwOf(s),T=d=>tp(d,cx,cy,s);
  let g=O([[T('M-0.36,0.02 L0.36,0.02 L0.28,0.44 Q0.27,0.48 0.22,0.48 L-0.22,0.48 Q-0.27,0.48 -0.28,0.44 Z'),P.beige]],lw);
  for(const x of [-0.16,0,0.16]) g+=Ln(T(`M${x*1.1},0.06 L${x*0.85},0.44`),lw);
  const bumps=[[-0.3,-0.02,0.15],[-0.12,-0.06,0.15],[0.12,-0.06,0.15],[0.3,-0.02,0.15],[-0.2,-0.18,0.15],[0.2,-0.18,0.15],[0,-0.24,0.16]];
  g+=O(bumps.map(([x,y,r])=>[circ(cx+x*s,cy+y*s,r*s),frost]),lw);
  g+=Ln(T('M0.02,-0.48 Q0.04,-0.62 0.14,-0.66'),lw);
  g+=O([[circ(cx+0.02*s,cy-0.42*s,0.09*s),P.berry]],lw);
  return g;
}
function fSlice(cx,cy,s,chocoSponge){
  const lw=lwOf(s),T=d=>tp(d,cx,cy,s);
  const sp=chocoSponge?P.chocoL:'#fbe9cf', side=chocoSponge?P.choco:P.beige;
  let g=O([[T('M0.3,0 L0.46,-0.2 L0.46,0.3 Q0.46,0.34 0.42,0.36 L0.3,0.44 Z'),side]],lw);
  g+=O([[T('M-0.5,0.02 L0.3,0.02 L0.3,0.44 L-0.46,0.44 Q-0.5,0.44 -0.5,0.4 Z'),sp]],lw);
  g+=`<path d="${T('M-0.5,0.04 L0.3,0.04 L0.3,0.2 Q0.2,0.28 0.12,0.2 Q0.02,0.12 -0.08,0.22 Q-0.2,0.3 -0.3,0.2 Q-0.4,0.12 -0.5,0.2 Z')}" fill="${P.pink2}"/>`;
  g+=Ln(T('M-0.5,0.2 Q-0.4,0.12 -0.3,0.2 Q-0.2,0.3 -0.08,0.22 Q0.02,0.12 0.12,0.2 Q0.2,0.28 0.3,0.2'),lw);
  g+=Ln(T('M-0.5,0.36 L0.3,0.36'),lw);
  g+=O([[T('M-0.5,0.02 L0.22,-0.26 L0.46,-0.2 L0.3,0.02 Z'),P.ivory]],lw);
  g+=O([[circ(cx+0.26*s,cy-0.3*s,0.08*s),P.white],[circ(cx+0.38*s,cy-0.27*s,0.08*s),P.white],[circ(cx+0.48*s,cy-0.22*s,0.07*s),P.white]],lw);
  g+=fBerry(cx-0.08*s,cy-0.22*s,s*0.34,0,null);
  return g;
}
function fBar(cx,cy,s,rot){
  const lw=lwOf(s*0.85),T=d=>tp(d,cx,cy,s,rot);
  let g=O([[T('M-0.26,-0.5 Q-0.26,-0.56 -0.2,-0.56 L0.2,-0.56 Q0.26,-0.56 0.26,-0.5 L0.26,0.1 L-0.26,0.1 Z'),P.choco]],lw);
  for(const [x,y] of [[-0.19,-0.49],[0.02,-0.49],[-0.19,-0.28],[0.02,-0.28]]) g+=O([[T(`M${x},${y} L${x+0.17},${y} L${x+0.17},${y+0.15} L${x},${y+0.15} Z`),P.chocoL]],lw*0.7);
  g+=O([[T('M-0.32,-0.14 L0.32,-0.24 L0.32,0.5 Q0.32,0.56 0.26,0.56 L-0.26,0.56 Q-0.32,0.56 -0.32,0.5 Z'),P.ivory]],lw);
  g+=O([[T('M-0.32,-0.14 L0.32,-0.24 L0.1,-0.06 Z'),P.beige],[T('M-0.32,0.44 L0.32,0.44 L0.32,0.5 Q0.32,0.56 0.26,0.56 L-0.26,0.56 Q-0.32,0.56 -0.32,0.5 Z'),P.beige]],lw*0.8);
  const a=rot*Math.PI/180, hx=cx-Math.sin(a)*0.2*s*-1*0, hy=0;
  const ox=0, oy=0.2*s; const hcx=cx+ox*Math.cos(a)-oy*Math.sin(a), hcy=cy+ox*Math.sin(a)+oy*Math.cos(a);
  g+=O([[tp(HEART,hcx,hcy,s*0.4,rot),P.pink2]],lw*0.9);
  return g;
}
function fCookie(cx,cy,s,fill){
  const lw=lwOf(s),r=s*0.42;let items=[[circ(cx,cy,r),fill]];
  for(let k=0;k<14;k++){const a=k/14*Math.PI*2;items.push([circ(cx+Math.cos(a)*r,cy+Math.sin(a)*r,r*0.16),fill])}
  let g=O(items,lw);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++) g+=`<rect x="${f(cx+i*r*0.42-r*0.08)}" y="${f(cy+j*r*0.42-r*0.08)}" width="${f(r*0.16)}" height="${f(r*0.16)}" rx="${f(r*0.04)}" fill="${LINE}" fill-opacity=".75"/>`;
  return g;
}
function fBonbon(cx,cy,s,fill){
  const lw=lwOf(s),r=s*0.3;let cup=[];
  for(let k=0;k<12;k++){const a=k/12*Math.PI*2;cup.push([circ(cx+Math.cos(a)*r*1.15,cy+r*0.15+Math.sin(a)*r*1.15,r*0.3),P.pink1])}
  cup.push([circ(cx,cy+r*0.15,r*1.15),P.pink1]);
  let g=O(cup,lw)+O([[circ(cx,cy,r),fill]],lw);
  g+=Ln(`M${f(cx-r*0.55)},${f(cy-r*0.1)} Q${f(cx-r*0.28)},${f(cy-r*0.45)} ${f(cx)},${f(cy-r*0.1)} Q${f(cx+r*0.28)},${f(cy+r*0.25)} ${f(cx+r*0.55)},${f(cy-r*0.1)}`,lw*0.9,P.pink1);
  return g;
}
function fFlower(cx,cy,r,fill){
  const lw=lwOf(r*2.2);let it=[];
  for(let k=0;k<5;k++){const a=(k/5*360-90)*Math.PI/180;it.push([circ(cx+Math.cos(a)*r*0.62,cy+Math.sin(a)*r*0.62,r*0.5),fill])}
  return O(it,lw)+O([[circ(cx,cy,r*0.3),P.beige]],lw);
}
function fDot(cx,cy,r,fill){return O([[circ(cx,cy,r),fill]],Math.max(2,r*0.35))}
// ribbon polygon along a polyline of points
function ribbonPoly(pts,w){
  const L=[],Rt=[];
  for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
    const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,nx=-dy/l*w/2,ny=dx/l*w/2;
    L.push([pts[i].x+nx,pts[i].y+ny]);Rt.push([pts[i].x-nx,pts[i].y-ny])}
  return 'M'+L.map(p=>f(p[0])+','+f(p[1])).join(' L')+' L'+Rt.reverse().map(p=>f(p[0])+','+f(p[1])).join(' L')+' Z';
}

// =====================================================================
const U=480, n=Math.round(W/U), CAKE_TOP=668, PTOP=192, PHW=168, LW=5;
let svg='';

// ---- ground: cream with flat dots ----
svg+=`<rect width="${W}" height="${H}" fill="${P.cream}"/>`;
for(let j=0,y=10;y<CAKE_TOP+40;y+=20,j++)for(let x=(j%2)*20;x<W+20;x+=40) svg+=`<circle cx="${x}" cy="${y}" r="${j%2?4.2:5.2}" fill="${j%2?P.choco:P.berry}"/>`;

// ---- arch panels ----
const arch=(cx,top,hw,bot)=>`M${f(cx-hw)},${bot} L${f(cx-hw)},${f(top+hw)} A${f(hw)},${f(hw)} 0 0 1 ${f(cx+hw)},${f(top+hw)} L${f(cx+hw)},${bot} Z`;
const motifs=[
  (x,y)=>fCandy(x,y,62,rr(-40,-20)),
  (x,y)=>fCupcake(x,y,58,P.pink2),
  (x,y)=>fBerry(x,y,44,rr(-12,12),['choco',null,'pink'][Math.floor(R()*3)]),
  (x,y)=>fSlice(x,y,62,R()<.5),
  (x,y)=>fHeart(x,y,30,rr(-15,15),P.pink3),
  (x,y)=>fBar(x,y,58,rr(-40,-25)),
  (x,y)=>fBow(x,y,24,rr(-10,10),P.rose),
  (x,y)=>fCookie(x,y,50,P.biscuit),
  (x,y)=>fCupcake(x,y,58,P.choco),
  (x,y)=>fBonbon(x,y,44,P.choco),
];
for(let i=0;i<n;i++){
  const cx=(i+0.5)*U, bot=CAKE_TOP+60;
  svg+=O([[arch(cx,PTOP-24,PHW+24,bot),P.beige]],LW);
  // lace scallops just inside the frame
  const pts=along(arch(cx,PTOP,PHW,bot),24);
  svg+=O(pts.map(p=>[circ(p.x,p.y,11),P.white]),3);
  const id='pa'+i, inner=arch(cx,PTOP+6,PHW-6,bot);
  let st='';for(let x=cx-PHW;x<cx+PHW;x+=36) st+=`<rect x="${x}" y="${PTOP}" width="18" height="${bot-PTOP}" fill="${P.pink2}"/>`;
  svg+=`<clipPath id="${id}"><path d="${inner}"/></clipPath><path d="${inner}" fill="${P.pink1}"/><g clip-path="url(#${id})">${st}`;
  let k=i*3;
  for(let row=0,y=PTOP+96;y<CAKE_TOP-60;y+=92,row++)
    for(let x=cx-PHW+52+(row%2)*45;x<cx+PHW-36;x+=90){
      const ay=PTOP+PHW; if(y<ay&&Math.hypot(x-cx,y-ay)>PHW-46)continue;
      svg+=motifs[k++%motifs.length](x,y);
    }
  svg+=`</g>`+Ln(inner,3);
  // crest
  svg+=fFlower(cx-50,PTOP-26,15,P.pink2)+fFlower(cx+50,PTOP-26,15,P.pink2);
  svg+=fHeart(cx,PTOP-18,74,0,P.pink3)+fHeart(cx,PTOP-15,40,0,P.choco);
}

// ---- top: lace + ribbon swags + bows with wavy tails ----
svg+=`<rect width="${W}" height="34" fill="#ffdbe5"/>`;
{let it=[];for(let x=0;x<W+30;x+=28)it.push([circ(x,34,14),P.white]);svg+=O(it,3);svg+=`<rect y="0" width="${W}" height="32" fill="#ffdbe5"/>`+Ln(`M0,33 L${W},33`,3);
 for(let x=0;x<W+30;x+=28)svg+=`<circle cx="${x}" cy="40" r="3" fill="${LINE}"/>`;}
for(let i=0;i<=n;i++){
  const gx=i*U;
  for(const m of [-1,1]){
    const pts=[];for(let y=100;y<=CAKE_TOP-24;y+=10)pts.push({x:gx+m*(10+18*Math.sin((y-100)/70+(m>0?0:Math.PI))),y});
    {const rp=ribbonPoly(pts,18);svg+=O([[rp,P.pink3]],LW*0.8,30)+satin(rp,pts,18,P.pink3);}
  }
  svg+=fHeart(gx,CAKE_TOP-44,30,0,P.rose);
}
for(let i=0;i<n;i++){
  const x1=i*U,x2=(i+1)*U,pts=[];
  for(let t=0;t<=1.0001;t+=0.02){pts.push({x:(1-t)*(1-t)*x1+2*(1-t)*t*(x1+x2)/2+t*t*x2,y:(1-t)*(1-t)*72+2*(1-t)*t*150+t*t*72})}
  {const rp=ribbonPoly(pts,26);svg+=O([[rp,P.pink3]],LW*0.8,36)+satin(rp,pts,26,P.pink3);}
  for(let t=0.08;t<0.95;t+=0.06){const x=(1-t)*(1-t)*x1+2*(1-t)*t*(x1+x2)/2+t*t*x2,y=(1-t)*(1-t)*72+2*(1-t)*t*150+t*t*72;svg+=`<circle cx="${f(x)}" cy="${f(y)}" r="2.6" fill="${P.white}"/>`}
}
for(let i=0;i<=n;i++){const gx=i*U;svg+=fFlower(gx-56,84,17,P.white)+fFlower(gx+56,84,17,P.white)+fBow(gx,66,70,0,i%2?P.rose:P.pink3)}

// ---- cake border ----
{
  const gt=CAKE_TOP+52, c1=gt+88, c2=c1+46, rb=H-128;
  // sponge
  svg+=`<rect x="0" y="${gt}" width="${W}" height="${rb-gt}" fill="#93573f"/>`;
  // pink cream wave layer
  let top=`M0,${c1}`,bot='';
  for(let x=0;x<=W;x+=60){top+=` Q${x+30},${c1-12} ${x+60},${c1}`}
  let wv=`M0,${c2}`;for(let x=0;x<=W;x+=60){wv+=` Q${x+30},${c2+12} ${x+60},${c2}`}
  svg+=`<path d="${top} L${W+60},${c2} L0,${c2} Z" fill="#ffd3df"/><path d="${wv} L${W+60},${c1} L0,${c1} Z" fill="#ffd3df"/>`;
  svg+=Ln(top,LW)+Ln(wv,LW);
  // berry dots in cream
  for(let x=30;x<W;x+=60) svg+=fHeart(x,(c1+c2)/2,20,0,P.berry);
  // chocolate glaze with drips
  const RS=rng(5);let d=`M0,${gt-6} L${W},${gt-6} L${W},${gt+34}`,x=W;
  while(x>0){const nx=Math.max(0,x-(30+RS()*40));d+=` L${f(nx)},${gt+34}`;x=nx;if(x<=0)break;
    const dw=12+RS()*5,len=14+RS()*30,c=x-dw;
    d+=` L${f(x)},${f(gt+34)} L${f(x)},${f(gt+34+len)} Q${f(x)},${f(gt+34+len+dw)} ${f(c)},${f(gt+34+len+dw)} Q${f(x-2*dw)},${f(gt+34+len+dw)} ${f(x-2*dw)},${f(gt+34+len)} L${f(x-2*dw)},${gt+34}`;x-=2*dw;}
  d+=` L0,${gt+34} Z`;
  svg+=O([[d,P.chocoD]],LW);
  for(let x=20;x<W;x+=46) svg+=Ln(`M${x},${gt+14} L${x+14},${gt+14}`,4,P.pink3);
  // cream bumps + strawberries
  let it=[];for(let x=-10;x<W+40;x+=42) it.push([circ(x,gt-8,22),P.white]);
  svg+=O(it,LW);
  for(let x=10,k=0;x<W+40;x+=64,k++) svg+=fBerry(x,gt-38,50,k%2?10:-10,['choco',null,'pink',null][k%4]);
  // ribbon band
  svg+=O([[rect(-10,rb,W+20,40),P.rose]],LW)+Ln(`M0,${rb+20} L${W}`+`,${rb+20}`,2.5,P.white,'stroke-dasharray="10 8"');
  // doily
  let dl=[];for(let x=0;x<W+36;x+=36) dl.push([circ(x,H-46,22),P.white]);
  dl.push([rect(-10,rb+30,W+20,H-46-rb-30),P.white]);
  svg+=`<rect x="0" y="${rb+40}" width="${W}" height="${H-rb-40}" fill="${P.pink2}"/>`;
  svg+=O(dl,3);
  {const rp=rect(-10,rb,W+20,40),pts=[];for(let x=-10;x<W+20;x+=14)pts.push({x,y:rb+20});svg+=O([[rp,P.rose]],LW,40)+satin(rp,pts,40,P.rose)+Ln(`M0,${rb+20} L${W},${rb+20}`,2.5,P.white,'stroke-dasharray="10 8"');}
  for(let x=0;x<W+36;x+=36){svg+=`<circle cx="${x}" cy="${H-40}" r="4" fill="${P.pink3}"/>`}
  for(let x=18;x<W+36;x+=36){svg+=`<circle cx="${x}" cy="${rb+64}" r="3" fill="${P.pink3}"/>`}
  // cameos & bows
  for(let i=0;i<n;i++){const cx=(i+0.5)*U,cy=rb+20;
    svg+=O([[ell(cx,cy,64,44),P.beige]],LW)+O([[ell(cx,cy,50,32),P.ivory]],3)+fHeart(cx,cy+2,40,0,P.choco);}
  for(let i=0;i<=n;i++){const gx=i*U;svg+=fFlower(gx-42,rb+20,16,P.pink2)+fFlower(gx+42,rb+20,16,P.pink2)+fBow(gx,rb+12,48,0,P.choco,P.chocoL)}
}

document.getElementById('stage').innerHTML=`<svg id="bg" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${svg}</svg>`;
document.title='ready';
