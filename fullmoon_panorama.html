<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Full Moon Panorama Loop</title>
<style>
  html, body { margin: 0; padding: 0; background: #fde4ee; overflow: hidden; }
  svg { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<!-- 満月×リボン×フリルのパノラマ背景 (3840x1080 = 32:9, 12秒) / ロリィタのボーダープリント風 / 継ぎ目なくループ / #t=秒 で静止表示 -->
<div id="root"></div>
<script>
const W = 3840, H = 1080, T = 12;
const TAU = Math.PI * 2;
const C = {
  pink: '#f7a8c4', pinkDeep: '#ee88ab', pinkLine: '#df7299', light: '#fcd3e1', pale: '#fff2f7',
  blue: '#bfe3f5', blueDeep: '#94cbe8', blueLine: '#7db8db',
  yellow: '#fff3b8', yellowDeep: '#ffe38a', yellowLine: '#eec66a', gold: '#f3d58e',
};
let seed = 3840;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const f = n => n.toFixed(2);

// ---------- 部品 ----------
const HEART = 'M0,-22 C -10,-42 -45,-37 -45,-12 C -45,8 -20,23 0,38 C 20,23 45,8 45,-12 C 45,-37 10,-42 0,-22 Z';
const heart = (fill, stroke, sw = 2.5) =>
  `<path d="${HEART}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>
   <path d="M-30,-18 C -30,-26 -24,-30 -18,-28" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>`;
function starPath(R, r, n = 5) {
  let d = '';
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / n, rad = i % 2 ? r : R;
    d += (i ? 'L' : 'M') + f(Math.cos(a) * rad) + ',' + f(Math.sin(a) * rad);
  }
  return d + 'Z';
}
const star = (fill, stroke, s = 1) =>
  `<path d="${starPath(30 * s, 14 * s)}" fill="${fill}" stroke="${stroke}" stroke-width="${6 * s}" stroke-linejoin="round" paint-order="stroke"/>
   <path d="${starPath(30 * s, 14 * s)}" fill="${fill}"/><circle cx="${-7 * s}" cy="${-8 * s}" r="${3.2 * s}" fill="#fff" opacity=".85"/>`;
const sparkle = (fill, s = 1) =>
  `<path d="M0,${-24 * s} C ${3 * s},${-5 * s} ${5 * s},${-3 * s} ${24 * s},0 C ${5 * s},${3 * s} ${3 * s},${5 * s} 0,${24 * s} C ${-3 * s},${5 * s} ${-5 * s},${3 * s} ${-24 * s},0 C ${-5 * s},${-3 * s} ${-3 * s},${-5 * s} 0,${-24 * s} Z" fill="${fill}"/>`;
function bow(fill = C.pink, line = C.pinkLine, dot = '#fff') {
  const loopL = 'M0,0 C -12,-22 -48,-26 -46,0 C -48,22 -12,20 0,0 Z';
  const tailL = 'M-4,4 C -10,16 -16,28 -22,38 L -12,34 L -8,44 C -4,30 -1,16 3,5 Z';
  let s = `<g stroke="${line}" stroke-width="2.5" stroke-linejoin="round">`;
  s += `<path d="${tailL}" fill="${fill}"/><path d="${tailL}" fill="${fill}" transform="scale(-1,1)"/>`;
  s += `<path d="${loopL}" fill="${fill}"/><path d="${loopL}" fill="${fill}" transform="scale(-1,1)"/>`;
  s += `<path d="M-8,-7 C -18,-11 -30,-8 -35,0 M8,-7 C 18,-11 30,-8 35,0" fill="none" stroke-width="2" opacity=".55"/>`;
  s += `<ellipse cx="0" cy="0" rx="8.5" ry="10" fill="${fill}"/></g>`;
  if (dot) for (const [x, y] of [[-30, -6], [-20, 6], [-36, 8], [-24, -14], [30, -6], [20, 6], [36, 8], [24, -14], [-13, 26], [13, 26]])
    s += `<circle cx="${x}" cy="${y}" r="2.3" fill="${dot}"/>`;
  return s + `<ellipse cx="-2.5" cy="-4" rx="2.5" ry="3.2" fill="#fff" opacity=".7"/>`;
}
// 小さな満月
function miniMoon(r, withBow = true) {
  return `<circle r="${r + 5}" fill="#fff"/><circle r="${r}" fill="url(#moonG)" stroke="${C.yellowLine}" stroke-width="2" stroke-opacity=".6"/>
    <circle cx="${-r * .35}" cy="${-r * .3}" r="${r * .18}" fill="#fde3a2" opacity=".55"/>
    <circle cx="${r * .35}" cy="${r * .25}" r="${r * .24}" fill="#fde3a2" opacity=".45"/>
    <ellipse cx="${-r * .45}" cy="${-r * .55}" rx="${r * .22}" ry="${r * .09}" fill="#fff" opacity=".7" transform="rotate(-40 ${-r * .45} ${-r * .55})"/>
    ${withBow ? `<g transform="translate(${r * .62},${-r * .66}) rotate(20) scale(${r / 90})">${bow()}</g>` : ''}`;
}
// スカラップの輪 (レース縁)
function scallopRing(rx, ry, n, bump, fill) {
  let d = '';
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    d += i ? `A ${bump} ${bump} 0 0 1 ${f(x)} ${f(y)} ` : `M ${f(x)} ${f(y)} `;
  }
  return `<path d="${d}Z" fill="${fill}"/>`;
}

// ---------- SVG ----------
let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
<defs>
  <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbc8db"/><stop offset="1" stop-color="#fde6ef"/></linearGradient>
  <pattern id="polka" width="64" height="64" patternUnits="userSpaceOnUse">
    <circle cx="16" cy="16" r="6" fill="#fff" opacity=".75"/><circle cx="48" cy="48" r="6" fill="#fff" opacity=".75"/>
  </pattern>
  <pattern id="stripe" width="44" height="10" patternUnits="userSpaceOnUse">
    <rect width="22" height="10" fill="#fff" opacity=".45"/>
  </pattern>
  <pattern id="lattice" width="110" height="110" patternUnits="userSpaceOnUse">
    <path d="M0,55 L55,0 L110,55 L55,110 Z" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
    <circle cx="55" cy="0" r="5" fill="#fff"/><circle cx="55" cy="110" r="5" fill="#fff"/><circle cx="0" cy="55" r="5" fill="#fff"/><circle cx="110" cy="55" r="5" fill="#fff"/>
  </pattern>
  <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
    <circle cx="9" cy="9" r="3" fill="#fff"/><circle cx="27" cy="27" r="3" fill="#fff"/>
  </pattern>
  <radialGradient id="moonG" cx=".4" cy=".36" r=".72"><stop offset="0" stop-color="#fffef4"/><stop offset=".65" stop-color="#fff5c8"/><stop offset="1" stop-color="#ffe7a0"/></radialGradient>
  <radialGradient id="glow"><stop offset=".45" stop-color="#fffbe6" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="cameoBg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="${C.light}"/><stop offset="1" stop-color="${C.light}"/>
  </linearGradient>
</defs>
<rect width="${W}" height="${H}" fill="url(#bgG)"/>
<rect width="${W}" height="${H}" fill="url(#polka)"/>
`;

// --- 縦のパネル (ストライプ / 水色 / イエロー を交互に、ゆっくり下へ流れる) ---
const PW = 640, NP = W / PW;
const panelCols = [null, "#d6eefa", null, "#fff3c4", null, "#d6eefa"];
svg += `<g id="panels">`;
for (let k = 0; k < NP; k++) {
  const x0 = k * PW + 170, w = PW - 340;
  const tint = panelCols[k];
  svg += `<rect x="${x0}" y="0" width="${w}" height="${H}" fill="${tint || '#fbd0df'}" opacity="${tint ? 1 : .9}"/>`;
  svg += `<rect x="${x0}" y="0" width="${w}" height="${H}" fill="url(#stripe)"/>`;
  svg += `<rect x="${x0}" y="0" width="${w}" height="${H}" fill="url(#lattice)" opacity=".5"/>`;
}
svg += `</g>`;

// --- レースの縦列 (お花の穴あき + リボン、下へ流れる) ---
const LT = 180; // 縦の繰り返し
function laceColumn() {
  let s = '';
  for (let y = -LT; y < H + LT; y += LT) {
    // 両側のスカラップ
    s += `<rect x="-58" y="${y}" width="116" height="${LT}" fill="#fff" opacity=".95"/>`;
    for (let j = 0; j < 4; j++) {
      const yy = y + j * LT / 4 + LT / 8;
      s += `<circle cx="-58" cy="${yy}" r="${LT / 8}" fill="#fff" opacity=".95"/><circle cx="58" cy="${yy}" r="${LT / 8}" fill="#fff" opacity=".95"/>`;
      s += `<circle cx="-62" cy="${yy}" r="4" fill="${C.light}"/><circle cx="62" cy="${yy}" r="4" fill="${C.light}"/>`;
    }
    // お花の穴
    const fy = y + LT / 2;
    for (let p = 0; p < 6; p++) {
      const a = p / 6 * TAU;
      s += `<ellipse cx="${f(Math.cos(a) * 15)}" cy="${f(fy + Math.sin(a) * 15)}" rx="9" ry="5" fill="${C.light}" transform="rotate(${f(a * 180 / Math.PI)} ${f(Math.cos(a) * 15)} ${f(fy + Math.sin(a) * 15)})"/>`;
    }
    s += `<circle cx="0" cy="${fy}" r="6" fill="${C.light}"/>`;
    s += `<circle cx="0" cy="${y}" r="3.5" fill="${C.light}"/>`;
  }
  return s;
}
const laceCol = laceColumn();
let colBows = '';
svg += `<g id="laces">`;
for (let k = 0; k <= NP; k++) {
  svg += `<g transform="translate(${k * PW},0)"><g class="lcol">${laceCol}</g></g>`;
}
svg += `</g>`;
// 縦列のリボン (列といっしょに流れる)
svg += `<g id="colBows">`;
for (let k = 0; k <= NP; k++)
  for (let y = -LT * 2; y < H + LT; y += LT * 2)
    svg += `<g class="cb" data-x="${k * PW + (k % 2 ? 0 : 0)}" data-y="${y + LT}" data-k="${k}"><g transform="scale(1.15)">${k % 2 ? bow(C.blue, C.blueLine) : bow()}</g></g>`;
svg += `</g>`;

// --- またたき ---
const twinkles = [];
svg += `<g>`;
for (let i = 0; i < 90; i++) {
  twinkles.push({ x: rnd() * W, y: 150 + rnd() * 480, s: .35 + rnd() * .4, n: 1 + Math.floor(rnd() * 3), ph: rnd() });
  svg += `<g class="tw">${sparkle([C.yellowDeep, '#fff', C.blueDeep][i % 3])}</g>`;
}
svg += `</g>`;

// --- 中央の大きな満月 ---
const MX = W / 2, MY = 430, MR = 250;
let lace = scallopRing(MR + 48, MR + 48, 32, 25, '#fff');
for (let i = 0; i < 32; i++) {
  const a = (i + .5) / 32 * TAU;
  lace += `<circle cx="${f(Math.cos(a) * (MR + 54))}" cy="${f(Math.sin(a) * (MR + 54))}" r="6" fill="${C.light}"/>`;
}
lace += `<circle r="${MR + 24}" fill="none" stroke="${C.blueDeep}" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round"/>`;
svg += `<g id="bigMoon" transform="translate(${MX},${MY})">
  <circle id="halo" r="${MR * 1.9}" fill="url(#glow)"/>
  <g id="lace">${lace}</g>
  <g transform="scale(1)">${miniMoon(MR, false)}</g>
  <path d="${HEART}" fill="#ffd9a0" opacity=".35" transform="translate(-60,40) scale(1.2)"/>
  <ellipse cx="-80" cy="60" rx="24" ry="13" fill="#ffc6d6" opacity=".45"/><ellipse cx="80" cy="60" rx="24" ry="13" fill="#ffc6d6" opacity=".45"/>
  <g transform="translate(150,-190) rotate(18)"><g id="bigBow"><g transform="scale(1.8)">${bow()}</g></g></g>
</g>`;
// 左右に小さめの満月
const sideMoons = [[760, 340, 120], [3080, 340, 120]];
sideMoons.forEach(([x, y, r], i) => {
  svg += `<g class="sm" data-x="${x}" data-y="${y}" data-k="${i}"><circle r="${r * 1.7}" fill="url(#glow)"/>${scallopRing(r + 26, r + 26, 22, 14, '#fff')}${miniMoon(r)}</g>`;
});

// --- 浮かぶハート・星・メッセージハート ---
const floaters = [];
const words = ['MOON', 'LOVE', '♡', 'LUNA', 'DREAM', 'KISS'];
svg += `<g id="floaters">`;
for (let i = 0; i < 34; i++) {
  const ci = i % 3;
  floaters.push({ x: 40 + i / 34 * (W - 80) + (rnd() - .5) * 80, s: .35 + rnd() * .35, ph: rnd(), cyc: 1 + (i % 2), amp: 20 + rnd() * 40, sw: 1 + Math.floor(rnd() * 3) });
  let body;
  if (i % 5 === 2) {
    // ハートのキャンディ (メッセージ入り)
    const fc = [C.pink, C.yellow, C.blue][ci], lc = [C.pinkLine, C.yellowLine, C.blueLine][ci];
    body = `<g transform="scale(1.5)"><path d="${HEART}" fill="${fc}" stroke="#fff" stroke-width="5"/><path d="${HEART}" fill="none" stroke="${lc}" stroke-width="1.5"/></g>
      <text x="0" y="0" font-family="'M PLUS Rounded 1c', 'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="20" fill="${lc}" text-anchor="middle" dominant-baseline="central">${words[i % words.length]}</text>`;
  } else body = i % 4 === 1 ? star([C.yellow, C.blue, C.pink][ci], [C.yellowLine, C.blueLine, C.pinkLine][ci], 1.2)
    : heart([C.pink, C.yellow, C.blue][ci], [C.pinkLine, C.yellowLine, C.blueLine][ci], 3);
  svg += `<g class="fl">${body}</g>`;
}
svg += `</g>`;

// --- 下のボーダープリント帯 (横に流れる) ---
const BT = 640, BY = 790; // 帯の繰り返し幅 / カメオの中心 y
function bandTile() {
  let s = '';
  // 帯の地 (クリーム) + 上の波レース
  let d = `M 0 ${H + 10} L 0 660 `;
  for (let x = 0; x < BT; x += 80) d += `Q ${x + 40} 630 ${x + 80} 660 `;
  d += `L ${BT} ${H + 10} Z`;
  s += `<path d="${d}" fill="#fff8fa"/>`;
  for (let x = 40; x < BT; x += 80) s += `<circle cx="${x}" cy="652" r="5" fill="${C.light}"/>`;
  s += `<path d="${d.replace(/^M 0 \d+ L /, 'M ').replace(/ L [\d.]+ \d+ Z$/, '')}" fill="none" stroke="${C.pink}" stroke-width="3"/>`;
  // パールのドレープ
  for (let side = -1; side <= 1; side += 2) {
    for (let j = 1; j < 12; j++) {
      const u = j / 12;
      const x0 = BT / 2 + side * 130, x1 = BT / 2 + side * 320;
      const x = x0 + (x1 - x0) * u, y = 700 + Math.sin(Math.PI * u) * 70;
      s += `<circle cx="${f(x)}" cy="${f(y)}" r="${j % 3 ? 6 : 8}" fill="#fff" stroke="${C.blueLine}" stroke-width="1.3"/>`;
    }
  }
  // 水色リボンのドレープ
  s += `<path d="M ${BT / 2 - 330} 690 Q ${BT / 2 - 225} 790 ${BT / 2 - 120} 690" fill="none" stroke="${C.blue}" stroke-width="14" stroke-linecap="round"/>`;
  s += `<path d="M ${BT / 2 + 120} 690 Q ${BT / 2 + 225} 790 ${BT / 2 + 330} 690" fill="none" stroke="${C.blue}" stroke-width="14" stroke-linecap="round"/>`;
  // カメオ (満月入りのフレーム)
  const cx = BT / 2;
  s += `<g transform="translate(${cx},${BY})">
    ${scallopRing(128, 148, 26, 16, C.gold)}
    ${scallopRing(120, 140, 26, 15, '#fff')}
    <ellipse rx="104" ry="124" fill="${C.light}" stroke="${C.yellowLine}" stroke-width="4"/>
    <ellipse rx="104" ry="124" fill="url(#stripe)"/>
    <ellipse rx="92" ry="112" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
    <g transform="translate(0,6)">${miniMoon(66, false)}</g>
    <g transform="translate(-52,-78) scale(.28)"><path d="${HEART}" fill="${C.pink}"/></g>
    <g transform="translate(58,70) scale(.6)">${star(C.yellow, C.yellowLine)}</g>
    <g transform="translate(0,-150)"><g transform="scale(1.4)">${bow()}</g></g>
  </g>`;
  // カメオの間: レースのハート + 星
  s += `<g transform="translate(0,${BY + 20})">
    <g transform="scale(2.2)"><path d="${HEART}" fill="#fff" stroke="${C.pink}" stroke-width="2" stroke-dasharray="1 4" stroke-linecap="round"/></g>
    <g transform="scale(1.5)"><path d="${HEART}" fill="${C.pink}" stroke="#fff" stroke-width="3"/></g>
    <g transform="translate(0,-4) scale(.5)">${bow(C.blue, C.blueLine)}</g>
  </g>`;
  s += `<g transform="translate(${BT / 2 - 200},${BY + 130}) scale(.55)">${star(C.blue, C.blueLine)}</g>`;
  s += `<g transform="translate(${BT / 2 + 200},${BY + 130}) scale(.55)">${star(C.yellow, C.yellowLine)}</g>`;
  s += `<g transform="translate(${BT / 2 - 230},${BY + 40})">${sparkle(C.yellowDeep, .55)}</g>`;
  s += `<g transform="translate(${BT / 2 + 230},${BY + 40})">${sparkle(C.blueDeep, .55)}</g>`;
  return s;
}
const tile = bandTile();
svg += `<g id="band">`;
for (let k = -1; k <= NP; k++) svg += `<g transform="translate(${k * BT},0)">${tile}</g>`;
svg += `</g>`;

// --- いちばん下: フリル2段 + ストライプの裾 (逆向きに流れる) ---
const HT = 80;
let hem = '';
{
  const y1 = 975, y2 = 1010;
  let d = `M 0 ${H + 10} L 0 ${y1} `;
  for (let x = 0; x < W + HT * 2; x += HT) d += `Q ${x + HT / 2} ${y1 + 40} ${x + HT} ${y1} `;
  d += `L ${W + HT * 2} ${H + 10} Z`;
  hem += `<path d="${d}" fill="${C.pink}" stroke="${C.pinkLine}" stroke-width="3"/><path d="${d}" fill="url(#dots)" opacity=".6"/>`;
  d = `M 0 ${H + 10} L 0 ${y2} `;
  for (let x = -HT / 2; x < W + HT * 2; x += HT / 2) d += `Q ${x + HT / 4} ${y2 + 22} ${x + HT / 2} ${y2} `;
  d += `L ${W + HT * 2} ${H + 10} Z`;
  hem += `<path d="${d}" fill="#fff"/>`;
  for (let x = 0; x < W + HT * 2; x += 40) hem += `<rect x="${x}" y="1046" width="20" height="40" fill="${C.pink}"/>`;
  hem += `<rect x="0" y="1040" width="${W + HT * 2}" height="6" fill="${C.pinkDeep}"/>`;
  for (let x = HT / 2; x < W + HT * 2; x += HT) hem += `<circle cx="${x}" cy="${y1 + 4}" r="5" fill="#fff"/>`;
}
svg += `<g id="hem">${hem}</g>`;

// --- 上のフリル + 水色リボンのドレープ ---
function scallopBand(yEdge, w, depth) {
  let d = `M -10 -10 L -10 ${yEdge} `;
  for (let x = -10; x < W + w; x += w) d += `Q ${x + w / 2} ${yEdge + depth * 2} ${x + w} ${yEdge} `;
  return d + `L ${W + w} -10 Z`;
}
svg += `<path d="${scallopBand(92, 160, 26)}" fill="${C.pinkDeep}"/>
<path d="${scallopBand(92, 160, 26)}" fill="none" stroke="#fff" stroke-width="3" opacity=".7" transform="translate(0,-8)" stroke-dasharray="2 8" stroke-linecap="round"/>
<path d="${scallopBand(58, 80, 18)}" fill="${C.pink}"/><path d="${scallopBand(58, 80, 18)}" fill="url(#dots)" opacity=".55"/>
<path d="${scallopBand(20, 40, 8)}" fill="#fff"/>`;
const SW = 640;
svg += `<g id="swags">`;
for (let k = 0; k < W / SW; k++) {
  svg += `<path class="swag" data-a="${k * SW}" data-b="${(k + 1) * SW}" fill="none" stroke="${C.blue}" stroke-width="16" stroke-linecap="round"/>`;
  svg += `<path class="swagL" data-a="${k * SW}" data-b="${(k + 1) * SW}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/>`;
}
for (let k = 0; k <= W / SW; k++) svg += `<g class="tb" data-x="${k * SW}" data-k="${k}"><g transform="scale(1.4)">${k % 2 ? bow(C.blue, C.blueLine) : bow()}</g></g>`;
svg += `</g>`;
svg += `</svg>`;
document.getElementById('root').innerHTML = svg;

// ---------- アニメーション ----------
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const lcols = $$('.lcol'), cbs = $$('.cb'), tws = $$('.tw'), sms = $$('.sm'), fls = $$('.fl');
const swags = $$('.swag'), swagLs = $$('.swagL'), tbs = $$('.tb');

function renderAt(t) {
  const p = ((t % T) + T) % T / T;
  // レースの縦列は下へ (12秒で 2 くり返し分)
  const ly = (p * LT * 2) % LT;
  lcols.forEach(el => el.setAttribute('transform', `translate(0,${f(ly)})`));
  const by = (p * LT * 2) % (LT * 2);
  cbs.forEach(el => {
    const k = +el.dataset.k;
    const y = +el.dataset.y + by;
    el.setAttribute('transform', `translate(${el.dataset.x},${f(y)}) rotate(${f(6 * Math.sin(TAU * (2 * p + k * .3 + y / 900)))})`);
  });
  tws.forEach((el, i) => {
    const d = twinkles[i], v = .5 + .5 * Math.sin(TAU * (d.n * p + d.ph));
    el.setAttribute('transform', `translate(${f(d.x)},${f(d.y)}) scale(${f(d.s * (.5 + .6 * v))}) rotate(${f(45 * v)})`);
    el.setAttribute('opacity', f(.3 + .7 * v));
  });
  $('#bigMoon').setAttribute('transform', `translate(${MX},${f(MY + 10 * Math.sin(TAU * 2 * p))})`);
  $('#lace').setAttribute('transform', `rotate(${f(p * 360 / 32 * 2)})`);
  $('#halo').setAttribute('r', f(MR * (1.85 + .1 * Math.sin(TAU * 3 * p))));
  $('#bigBow').setAttribute('transform', `rotate(${f(6 * Math.sin(TAU * 3 * p))})`);
  sms.forEach(el => {
    const k = +el.dataset.k;
    el.setAttribute('transform', `translate(${el.dataset.x},${f(+el.dataset.y + 12 * Math.sin(TAU * (2 * p + k * .5)))}) rotate(${f(4 * Math.sin(TAU * (p + k * .5)))})`);
  });
  // 帯は左へ、裾は右へ
  $('#band').setAttribute('transform', `translate(${f(-p * BT)},0)`);
  $('#hem').setAttribute('transform', `translate(${f((p * HT * 6) % HT - HT)},0)`);

  fls.forEach((el, n) => {
    const d = floaters[n], q = (d.cyc * p + d.ph) % 1;
    const y = 700 - q * 760;
    const x = d.x + d.amp * Math.sin(TAU * (d.sw * p + d.ph));
    el.setAttribute('transform', `translate(${f(x)},${f(y)}) rotate(${f(16 * Math.sin(TAU * (2 * p + d.ph)))}) scale(${f(d.s)})`);
    el.setAttribute('opacity', f(Math.min(1, q * 5, (1 - q) * 6) * .9));
  });
  swags.forEach((el, i) => {
    const a = +el.dataset.a, b = +el.dataset.b, m = (a + b) / 2;
    const sag = 70 + 10 * Math.sin(TAU * (2 * p + i * .3));
    const d = `M ${a} 110 Q ${m} ${f(110 + sag)} ${b} 110`;
    el.setAttribute('d', d); swagLs[i].setAttribute('d', d);
  });
  tbs.forEach(el => {
    const k = +el.dataset.k;
    el.setAttribute('transform', `translate(${el.dataset.x},110) rotate(${f(7 * Math.sin(TAU * (2 * p + k * .25)))})`);
  });
}
window.renderAt = renderAt;
const m = location.hash.match(/t=([\d.]+)/);
if (m) renderAt(+m[1]);
else {
  const t0 = performance.now();
  const loop = now => { renderAt((now - t0) / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
