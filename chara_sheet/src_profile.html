<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>しょこら 性格</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Hachi+Maru+Pop&family=Great+Vibes&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<!--
  性格「半分ずつ味のちがうハートチョコ」デザイン（しょこら公式カラー）
  左＝Sweet（ピンク）、右＝Bitter（チョコ）。文章は .sweet / .bitter を編集。
  python3 build_frame.py profile → profile_frame.html → node export_frames.js profile
  （前の吹き出し版: src_profile_bubble.html）
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:"Zen Maru Gothic",sans-serif;padding:40px}
.frame{position:relative;width:1240px;height:1160px}
#art{position:absolute;left:0;top:0;width:1240px;height:1160px;overflow:visible}
.u{position:absolute;overflow:visible;pointer-events:none}

.ttl{position:absolute;left:50%;top:40px;transform:translateX(-50%) rotate(-2deg);z-index:5;white-space:nowrap;text-align:center}
.ttl .s{font-family:"Great Vibes";font-size:56px;line-height:1;color:#a82454;-webkit-text-stroke:9px #fff;paint-order:stroke fill;position:relative;z-index:2;margin-bottom:-10px;
  filter:drop-shadow(2px 3px 0 rgba(108,72,72,.25))}
.ttl h1{position:relative;display:inline-block;font-family:"Mochiy Pop One";font-weight:400;font-size:44px;letter-spacing:.2em;color:#fff;padding:10px 84px 14px;text-shadow:0 3px 0 #6e1236;
  background:radial-gradient(rgba(255,255,255,.4) 2.4px,transparent 3px) 0 0/15px 15px,linear-gradient(180deg,#c44a74,#a82454 55%,#7d1a3e);
  clip-path:polygon(0 0,100% 0,calc(100% - 32px) 50%,100% 100%,0 100%,32px 50%)}
.ttl h1::after{content:"";position:absolute;inset:6px 34px;border-top:2.5px dashed rgba(255,255,255,.85);border-bottom:2.5px dashed rgba(255,255,255,.85)}

.side{position:absolute;z-index:4;width:420px;text-align:center}
.side .lab{font-family:"Great Vibes";font-size:64px;line-height:1}
.side .tag{display:inline-block;font-family:"Mochiy Pop One";font-size:17px;letter-spacing:.24em;padding:3px 16px;border-radius:999px;margin:2px 0 16px}
.side p{font-size:27px;font-weight:900;line-height:1.75;letter-spacing:.01em}
.side em{font-style:normal}
.sweet{left:150px;top:350px}
.sweet .lab{color:#a82454}
.sweet .tag{color:#fff;background:#a82454}
.sweet p{color:#4a3234}
.sweet em{color:#a82454;background:linear-gradient(transparent 60%,#fcc0e4 60%,#fcc0e4 92%,transparent 92%)}
.bitter{left:670px;top:350px}
.bitter .lab{color:#fcc0e4}
.bitter .tag{color:#6c4848;background:#fcc0e4}
.bitter p{color:#fff}
.bitter em{color:#fcc0e4;border-bottom:3px dotted #fcc0e4}
:root.blank .side p{visibility:hidden}
</style>
</head>
<body>
{{DEFS}}
<div class="frame">
  <svg id="art" viewBox="0 0 1240 1160" aria-hidden="true"></svg>
  <div class="ttl"><div class="s">sweet &amp; bitter</div><h1>性格</h1></div>
  <div class="side sweet">
    <div class="lab">Sweet</div><span class="tag">あまい</span>
    <p><em>甘い香り</em>をまとった、<br><em>19歳のショコラティエ</em>の<br>お姉さん。<br>おっとりやさしい笑顔で、<br>みんなに愛される<br><em>あまあまガール</em>。</p>
  </div>
  <div class="side bitter">
    <div class="lab">Bitter</div><span class="tag">ほろにが</span>
    <p>でも、お菓子作りには<br>妥協しない<em>こだわり派</em>。<br>恋をすると、好きな人を<br><em>ひとりじめ</em>したく<br>なっちゃう、ちょっぴり<br>重たい一面も…♡</p>
  </div>
  <div id="deco"></div>
</div>

<script>
{{HELPERS}}
if (location.hash === '#blank') document.documentElement.classList.add('blank');
(() => {
  const outer = heartPath(620, 150, 1180, 1000);    // レースの外形
  const body = heartPath(620, 186, 1100, 930);      // チョコ本体
  const inner = heartPath(620, 214, 1040, 876);     // パールの線
  // 割れ目（上から下へギザギザ）
  let zz = [], y = 210, k = 0;
  while (y < 1110) { zz.push([620 + (k % 2 ? 26 : -26), y]); y += 60; k++; }
  zz.push([620, 1120]);
  const zig = 'M' + zz.map(p => p.join(' ')).join('L');
  const leftClip = `M-10 -10H${zz[0][0]}` + zz.map(p => `L${p[0]} ${p[1]}`).join('') + 'L620 1200H-10Z';
  const rightClip = `M1250 -10H${zz[0][0]}` + zz.map(p => `L${p[0]} ${p[1]}`).join('') + 'L620 1200H1250Z';
  const lp = along(outer, 34);
  // 右側上部のチョコ垂れ
  let drip = 'M600 180H1240V300', x = 1240, i = 0;
  while (x > 640) { const w = 46 + (i * 23) % 30, l = 40 + (i * 37) % 70; x -= w;
    drip += `C${x + w - 6} 300 ${x + w / 2 + 10} 304 ${x + w / 2 + 9} ${300 + l}C${x + w / 2 + 8} ${312 + l} ${x + w / 2 - 8} ${312 + l} ${x + w / 2 - 9} ${300 + l}C${x + w / 2 - 10} 304 ${x + 6} 300 ${x} 300`; i++; }
  drip += 'L600 300Z';
  document.getElementById('art').innerHTML = `
    <defs>
      <clipPath id="L"><path d="${leftClip}"/></clipPath><clipPath id="R"><path d="${rightClip}"/></clipPath>
      <clipPath id="B"><path d="${body}"/></clipPath>
      <pattern id="gin" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#fff6fb"/><rect width="20" height="40" fill="#fcc0e4" opacity=".4"/><rect width="40" height="20" fill="#fcc0e4" opacity=".4"/></pattern>
      <pattern id="hd" width="70" height="70" patternUnits="userSpaceOnUse"><path transform="translate(20 20) scale(.14)" d="${HEART}" fill="#fff" opacity=".8"/></pattern>
      <pattern id="qc" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="56" height="56" fill="#6c4848"/><rect x="3" y="3" width="50" height="50" rx="12" fill="#7c5656"/><ellipse cx="18" cy="18" rx="11" ry="7" fill="#fff" opacity=".08"/>
        <circle r="3.2" fill="#fcc0e4" opacity=".8"/></pattern>
      <linearGradient id="dripG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e2a2c"/><stop offset="1" stop-color="#553a3c"/></linearGradient>
      <radialGradient id="wax" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#d0507e"/><stop offset=".55" stop-color="#a82454"/><stop offset="1" stop-color="#6e1236"/></radialGradient>
    </defs>
    <!-- 影とレース -->
    <g transform="translate(12 18)" fill="#6c4848" opacity=".25">${lp.map(p => `<circle cx="${p.x}" cy="${p.y}" r="22"/>`).join('')}<path d="${outer}"/></g>
    <g fill="#fff">${lp.map(p => `<circle cx="${p.x}" cy="${p.y}" r="22"/>`).join('')}<path d="${outer}"/></g>
    <g fill="#fcc0e4">${lp.map(p => `<path transform="translate(${p.x - 7} ${p.y - 8}) scale(.15)" d="${HEART}"/>`).join('')}</g>
    <g fill="#f9b2dc">${along(heartPath(620, 168, 1140, 966), 20).map(p => `<circle cx="${p.x}" cy="${p.y}" r="3"/>`).join('')}</g>
    <!-- 左: Sweet -->
    <g clip-path="url(#B)"><g clip-path="url(#L)">
      <rect width="1240" height="1160" fill="url(#gin)"/><rect width="1240" height="1160" fill="url(#hd)"/>
    </g></g>
    <!-- 右: Bitter -->
    <g clip-path="url(#B)"><g clip-path="url(#R)" transform="translate(10 0)">
      <rect width="1240" height="1160" fill="url(#qc)"/>
      <path d="${drip}" fill="url(#dripG)"/>
      <path d="M660 240H1200" stroke="#fff" stroke-opacity=".18" stroke-width="10" stroke-linecap="round"/>
    </g></g>
    <!-- 割れ目 -->
    <path d="${zig}" fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="round" transform="translate(5 0)"/>
    <!-- パール -->
    <g clip-path="url(#L)">${pearls(inner, 7)}</g>
    <g clip-path="url(#R)" transform="translate(10 0)">${pearls(inner, 7)}</g>
    <!-- 先端のシーリングワックス -->
    <g transform="translate(620 1080)">
      ${Array.from({ length: 14 }, (_, i) => { const a = i / 14 * Math.PI * 2; return `<circle cx="${Math.cos(a) * 52}" cy="${Math.sin(a) * 50}" r="${12 + (i % 3) * 3}" fill="url(#wax)"/>`; }).join('')}
      <circle r="52" fill="url(#wax)"/><circle r="40" fill="none" stroke="#6e1236" stroke-width="3" opacity=".6"/>
      <path transform="translate(-22 -21) scale(.44)" d="${HEART}" fill="#c44a74" stroke="#6e1236" stroke-width="5"/>
      <ellipse cx="-18" cy="-26" rx="13" ry="6" fill="#fff" opacity=".35" transform="rotate(-30 -18 -26)"/>
    </g>`;
})();
const VB = { bowP:'0 0 120 94', bowS:'0 0 120 94', rose:'0 0 100 100', chocoheart:'0 0 100 92', berryS:'0 0 80 92', heart:'0 0 100 92', spark:'0 0 100 100', truffle:'0 0 100 100', cream:'0 0 100 100' };
const D = [
  ['bowP', 40, 120, 210, -20, ''], ['bowS', 990, 120, 200, 18, ''],
  ['rose', 70, 760, 100, 0, '#f78fb2'], ['rose', 140, 830, 74, 0, '#fbc2d4'], ['berryS', 30, 700, 64, -18, ''],
  ['chocoheart', 1060, 760, 120, 14, ''], ['truffle', 1010, 860, 74, 0, ''],
  ['heart', 300, 60, 46, -14, '#a82454'], ['heart', 900, 70, 40, 14, '#f59fd2'],
  ['spark', 230, 150, 44, 0, ''], ['spark', 1110, 420, 38, 0, ''], ['spark', 30, 520, 36, 0, ''], ['spark', 1180, 560, 40, 0, ''], ['spark', 470, 1080, 36, 0, ''], ['spark', 760, 1090, 34, 0, ''],
];
for (const [k, x, y, s, r, col] of D) {
  const [, , vw, vh] = VB[k].split(' ').map(Number);
  document.getElementById('deco').insertAdjacentHTML('beforeend', `<svg class="u" viewBox="${VB[k]}" style="left:${x}px;top:${y}px;width:${s}px;height:${s * vh / vw}px;z-index:6;transform:rotate(${r}deg);color:${col};filter:drop-shadow(3px 5px 0 rgba(108,72,72,.28))${k === 'spark' ? ' drop-shadow(0 0 6px #f59fd2)' : ''}"><use href="#${k}"/></svg>`);
}
</script>
</body>
</html>
