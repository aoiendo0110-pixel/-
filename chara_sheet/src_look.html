<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>しょこら 外見の特徴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Hachi+Maru+Pop&family=Great+Vibes&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<!--
  外見の特徴「ロゼット（リボンバッジ）」デザイン（しょこら公式カラー）
  1特徴＝1ロゼット、2段をサテンリボンのガーランドでつなぐ。中身は ITEMS を編集。
  （前の版: src_look_package.html / src_look_palette.html）
  python3 build_frame.py look → look_frame.html → node export_frames.js look
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:"Zen Maru Gothic",sans-serif;padding:40px;color:#4a3234}
.frame{position:relative;width:1200px;height:1080px}
.u{position:absolute;overflow:visible;pointer-events:none}
#art{position:absolute;left:0;top:0;width:1200px;height:1080px;overflow:visible}

/* 見出しバナー */
.ttl{position:absolute;left:0;right:0;top:34px;z-index:5;text-align:center}
.ttl .s{font-family:"Great Vibes";font-size:54px;line-height:1;color:#a82454;-webkit-text-stroke:8px #fff;paint-order:stroke fill;
  filter:drop-shadow(2px 3px 0 rgba(108,72,72,.25));margin-bottom:-8px;position:relative;z-index:2}
.ttl h1{display:inline-block;position:relative;font-family:"Mochiy Pop One";font-weight:400;font-size:48px;letter-spacing:.16em;color:#fff;
  padding:12px 90px 16px;text-shadow:0 3px 0 #6e1236;
  background:radial-gradient(rgba(255,255,255,.4) 2.4px,transparent 3px) 0 0/15px 15px,linear-gradient(180deg,#c44a74,#a82454 55%,#7d1a3e);
  clip-path:polygon(0 0,100% 0,calc(100% - 34px) 50%,100% 100%,0 100%,34px 50%)}
.ttl h1::after{content:"";position:absolute;inset:7px 36px;border-top:2.5px dashed rgba(255,255,255,.85);border-bottom:2.5px dashed rgba(255,255,255,.85)}

/* ロゼットの中身 */
.in{position:absolute;z-index:4;width:200px;height:200px;margin:-100px 0 0 -100px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.in .k{font-family:"Great Vibes";font-size:34px;line-height:.9;color:#e98cc0}
.in b{display:block;font-size:27px;font-weight:900;line-height:1.3;color:#a82454;white-space:nowrap}
.in small{display:block;font-size:18px;font-weight:900;line-height:1.3;color:#6c4848;margin-top:3px;white-space:nowrap}
:root.blank .in b,:root.blank .in small{visibility:hidden}
:root.blank .ttl h1{color:transparent;text-shadow:none}
</style>
</head>
<body>
{{DEFS}}
<div class="frame">
  <svg id="art" viewBox="0 0 1200 1080" aria-hidden="true"></svg>
  <div class="ttl"><div class="s">my looks</div><h1>外見の特徴</h1></div>
  <div id="ins"></div>
  <div id="deco"></div>
</div>

<script>
{{HELPERS}}
if (location.hash === '#blank') document.documentElement.classList.add('blank');

/* [英字, 見出し(<br>可), 補足] */
const ITEMS = [
  ['Hair', '赤髪<br>ぱっつん前髪', 'ドリルツインテール'],
  ['Eyes', 'おっとり<br>紫目', ''],
  ['Size', '160cm<br>48kg', ''],
  ['Bust', '大きめバスト', 'Eカップ'],
  ['Style', '少し<br>お姉さん体型', ''],
  ['Cheek', '白い<br>もちもちほっぺ', ''],
];
// 配色 [プリーツ濃, プリーツ淡, しっぽ]
const COLS = [['#a82454', '#c44a74', '#7d1a3e'], ['#f59fd2', '#fcc0e4', '#a82454'], ['#6c4848', '#8a6262', '#4a3234']];
const POS = [[220, 380], [600, 370], [980, 380], [220, 750], [600, 740], [980, 750]];

function rosette(cx, cy, [c1, c2, ct]) {
  const R1 = 104, R2 = 150, N = 40;
  let pleat = '', bumps = '';
  for (let i = 0; i < N; i++) {
    const a0 = i / N * Math.PI * 2, a1 = (i + 1) / N * Math.PI * 2;
    const p = (r, a) => `${cx + Math.cos(a) * r} ${cy + Math.sin(a) * r}`;
    pleat += `<path d="M${p(R1, a0)}L${p(R2, a0)}A${R2} ${R2} 0 0 1 ${p(R2, a1)}L${p(R1, a1)}Z" fill="${i % 2 ? c1 : c2}"/>`;
    bumps += `<circle cx="${cx + Math.cos((a0 + a1) / 2) * R2}" cy="${cy + Math.sin((a0 + a1) / 2) * R2}" r="13"/>`;
  }
  const circ = r => `M${cx - r} ${cy}A${r} ${r} 0 1 0 ${cx + r} ${cy}A${r} ${r} 0 1 0 ${cx - r} ${cy}Z`;
  const lace = along(circ(110), 24);
  const tail = (s) => `<g transform="translate(${cx} ${cy}) scale(${s} 1)">
      <path d="M-14 90L-78 300L-52 282L-34 316L22 100Z" fill="${ct}" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-10 120L-58 280" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-dasharray="6 5"/></g>`;
  return `
    <g transform="translate(8 14)" opacity=".22" fill="#6c4848"><circle cx="${cx}" cy="${cy}" r="${R2 + 12}"/></g>
    ${tail(1)}${tail(-1)}
    <g fill="#fff">${bumps}</g>
    <circle cx="${cx}" cy="${cy}" r="${R2 + 6}" fill="#fff"/>
    <g fill="${c2}">${bumps.replaceAll('r="13"', 'r="9"')}</g>
    ${pleat}
    ${Array.from({ length: N }, (_, i) => { const a = i / N * Math.PI * 2; return `<path d="M${cx + Math.cos(a) * R1} ${cy + Math.sin(a) * R1}L${cx + Math.cos(a) * R2} ${cy + Math.sin(a) * R2}" stroke="#000" stroke-opacity=".12" stroke-width="1.5"/>`; }).join('')}
    <circle cx="${cx}" cy="${cy}" r="${R1 + 20}" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 5"/>
    <g fill="#fff">${lace.map(p => `<circle cx="${p.x}" cy="${p.y}" r="12"/>`).join('')}<circle cx="${cx}" cy="${cy}" r="110"/></g>
    <g fill="#fcc0e4">${lace.map(p => `<path transform="translate(${p.x - 5} ${p.y - 6}) scale(.1)" d="${HEART}"/>`).join('')}</g>
    <circle cx="${cx}" cy="${cy}" r="98" fill="#fff8fc"/>
    <circle cx="${cx}" cy="${cy}" r="98" fill="url(#hdots)"/>
    <circle cx="${cx}" cy="${cy}" r="90" fill="none" stroke="#e98cc0" stroke-width="2.5" stroke-dasharray="7 6"/>
    ${pearls(circ(101), 4.5)}`;
}

(() => {
  // ガーランド（各段をつなぐサテンリボン）
  const row = (y) => `M-20 ${y + 40}C200 ${y - 60} 400 ${y + 60} 600 ${y - 10}S1000 ${y - 60} 1220 ${y + 40}`;
  const satin = (d) => `<path d="${d}" fill="none" stroke="#6c4848" stroke-opacity=".2" stroke-width="30" transform="translate(4 10)"/>
    <path d="${d}" fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="url(#satinH)" stroke-width="24"/>
    <path d="${d}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 5" transform="translate(0 -7)"/>`;
  let g = `<defs><pattern id="hdots" width="44" height="44" patternUnits="userSpaceOnUse"><path transform="translate(14 14) scale(.14)" d="${HEART}" fill="#fcc0e4" opacity=".6"/></pattern></defs>`;
  g += satin(row(310)) + satin(row(680));
  // 下段 → 上段の順に描くと上段のしっぽが下段の後ろに回る
  [3, 4, 5, 0, 1, 2].forEach(i => { g += rosette(POS[i][0], POS[i][1], COLS[i % 3]); });
  // 上段のしっぽは下段より後ろに置きたいので、上段→下段の順に描き直す
  g = g.split('<!--split-->')[0];
  document.getElementById('art').innerHTML = `<defs><pattern id="hdots" width="44" height="44" patternUnits="userSpaceOnUse"><path transform="translate(14 14) scale(.14)" d="${HEART}" fill="#fcc0e4" opacity=".6"/></pattern></defs>
    ${satin(row(360))}${[0, 1, 2].map(i => rosette(POS[i][0], POS[i][1], COLS[i % 3])).join('')}
    ${satin(row(730))}${[3, 4, 5].map(i => rosette(POS[i][0], POS[i][1], COLS[i % 3])).join('')}`;
  document.getElementById('ins').innerHTML = ITEMS.map(([k, t, s], i) =>
    `<div class="in" style="left:${POS[i][0]}px;top:${POS[i][1]}px"><span class="k">${k}</span><b>${t}</b>${s ? `<small>${s}</small>` : ''}</div>`).join('');
})();

const VB = { bowP:'0 0 120 94', bowS:'0 0 120 94', spark:'0 0 100 100', heart:'0 0 100 92', chocoheart:'0 0 100 92', berryS:'0 0 80 92' };
const D = [
  ['bowP', 110, 50, 150, -16, ''], ['bowS', 940, 50, 150, 16, ''],
  ['chocoheart', 400, 500, 70, -14, ''], ['berryS', 780, 490, 50, 16, ''],
  ['heart', 410, 870, 50, 14, '#a82454'], ['heart', 770, 880, 40, -12, '#f59fd2'],
  ['spark', 60, 200, 40, 0, ''], ['spark', 1110, 210, 44, 0, ''], ['spark', 40, 560, 34, 0, ''], ['spark', 1130, 580, 36, 0, ''], ['spark', 600, 990, 40, 0, ''],
];
for (const [k, x, y, s, r, col] of D) {
  const [, , vw, vh] = VB[k].split(' ').map(Number);
  document.getElementById('deco').insertAdjacentHTML('beforeend', `<svg class="u" viewBox="${VB[k]}" style="left:${x}px;top:${y}px;width:${s}px;height:${s * vh / vw}px;z-index:6;transform:rotate(${r}deg);color:${col};filter:drop-shadow(3px 5px 0 rgba(108,72,72,.28))${k === 'spark' ? ' drop-shadow(0 0 6px #f59fd2)' : ''}"><use href="#${k}"/></svg>`);
}
</script>
</body>
</html>
