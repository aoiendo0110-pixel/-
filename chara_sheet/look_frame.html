<!--
  外見の特徴「チョコの詰め合わせボックス」デザイン（しょこら公式カラー）
  3×3 の仕切りに 1 マス 1 特徴。中身は FEATURES を編集。
  python3 build_frame.py look → look_frame.html → node export_frames.js look
  → out/look_frame.png（文字入り）/ out/look_frame_blank.png（空）… 背景透過・2倍
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:"Zen Maru Gothic",sans-serif;padding:40px}
.frame{position:relative;width:1180px;height:960px}
.u{position:absolute;overflow:visible;pointer-events:none}
.box{position:absolute;left:30px;top:130px;width:1120px;height:800px}
.box svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* 見出しの札 */
.head{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:5;text-align:center;width:640px;height:150px}
.head svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.head .s{position:relative;font-family:"Great Vibes";font-size:46px;line-height:1;color:#a82454;margin-top:16px}
.head .j{position:relative;font-family:"Mochiy Pop One";font-size:46px;letter-spacing:.14em;color:#6c4848;line-height:1.2}
.head .j .h{color:#a82454}

/* マス */
.grid{position:absolute;left:96px;top:226px;width:988px;height:668px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:28px;z-index:3}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 14px 12px}
.cell .num{position:absolute;left:-14px;top:-18px;width:64px;height:60px;display:grid;place-items:center;font-family:"Mochiy Pop One";font-size:24px;color:#fff;padding-bottom:6px;isolation:isolate}
.cell .num svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible}
.cell .part{font-family:"Mochiy Pop One";font-size:19px;letter-spacing:.16em;color:#fff;background:#a82454;padding:3px 18px 4px;border-radius:999px;margin-bottom:8px;
  box-shadow:0 0 0 3px #fff}
.cell b{display:block;font-size:24px;font-weight:900;line-height:1.3;color:#4a3234}
.cell b em{font-style:normal;color:#a82454}
.cell small{display:block;margin-top:5px;font-size:17.5px;font-weight:700;line-height:1.35;color:#6c4848}
:root.blank .cell > :not(.num){visibility:hidden}
</style>
</head>

const uri = svg => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
const HEART = 'M50 88C18 66 2 48 2 28A24 24 0 0 1 50 16A24 24 0 0 1 98 28C98 48 82 66 50 88Z';
const probe = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
probe.style.cssText = 'position:absolute;width:0;height:0'; document.body.appendChild(probe);
function along(d, step) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d); probe.appendChild(p);
  const L = p.getTotalLength(), n = Math.max(3, Math.round(L / step)), out = [];
  for (let i = 0; i < n; i++) {
    const a = p.getPointAtLength(L * i / n), b = p.getPointAtLength(L * (i + .5) / n);
    out.push({ x: +a.x.toFixed(1), y: +a.y.toFixed(1), ang: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI });
  }
  p.remove(); return out;
}
const pearls = (d, r) => along(d, r * 2.05).map(p => `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="url(#pearl)" stroke="#d9c3c8" stroke-width=".8"/>`).join('');
const heartPath = (cx, top, w, h) => { // ハート（中央x, 上端y, 幅, 高さ）
  const x0 = cx - w / 2, r = w / 4;
  return `M${cx} ${top + h}C${x0 + w * .19} ${top + h * .77} ${x0} ${top + h * .55} ${x0} ${top + h * .3}A${r} ${r} 0 0 1 ${cx} ${top + h * .14}A${r} ${r} 0 0 1 ${x0 + w} ${top + h * .3}C${x0 + w} ${top + h * .55} ${x0 + w * .81} ${top + h * .77} ${cx} ${top + h}Z`;
};

/* ---- 柄タイル ---- */
function laceTile() {
  return `<svg ${NS} width="60" height="40" viewBox="0 0 66 44"><mask id="m"><rect width="66" height="44" fill="#fff"/>
    <g fill="#000"><circle cx="11" cy="7" r="2.6"/><circle cx="33" cy="7" r="2.6"/><circle cx="55" cy="7" r="2.6"/><circle cx="33" cy="25" r="3.2"/>
    ${[0,1,2,3,4,5].map(i=>{const a=i/6*Math.PI*2,x=33+Math.cos(a)*7.5,y=25+Math.sin(a)*7.5;return `<ellipse cx="${x}" cy="${y}" rx="2.6" ry="1.6" transform="rotate(${a*180/Math.PI} ${x} ${y})"/>`}).join('')}
    <path transform="translate(-2.5 16) scale(.11)" d="${HEART}"/><path transform="translate(63.5 16) scale(.11)" d="${HEART}"/></g></mask>
    <g fill="#fff" fill-opacity=".96" mask="url(#m)"><rect width="66" height="14"/><circle cx="33" cy="24" r="16"/><circle cx="0" cy="18" r="11"/><circle cx="66" cy="18" r="11"/>
    ${[...Array(9)].map((_,i)=>{const a=(20+i*17.5)*Math.PI/180;return `<circle cx="${33+Math.cos(a)*17}" cy="${24+Math.sin(a)*17}" r="2.4"/>`}).join('')}</g></svg>`;
}
css.setProperty('--laceH', uri(laceTile()));
function laceFrame(fill, eye, stitch) {
  let s = '', e = '';
  for (let k = 0; k < 3; k++) { const t = 20 + 40 * k;
    for (const [x, y] of [[t, 19], [t, 101], [19, t], [101, t]]) { s += `<circle cx="${x}" cy="${y}" r="19"/>`; e += `<path transform="translate(${x - 5.5} ${y - 7}) scale(.11)" d="${HEART}"/>`; } }
  return `<svg ${NS} width="120" height="120" viewBox="0 0 120 120"><g fill="${fill}">${s}<rect x="19" y="19" width="82" height="82"/></g><g fill="${eye}">${e}</g>
    <rect x="35" y="35" width="50" height="50" fill="none" stroke="${stitch}" stroke-width="2.4" stroke-dasharray="5 4"/></svg>`;
}
css.setProperty('--laceW', uri(laceFrame('#ffffff', '#f9b2dc', '#f9b2dc')));
css.setProperty('--laceC', uri(laceFrame('#fff4f8', '#f59fd2', '#a82454')));
(() => { let s = '', p = '';
  for (let k = 0; k < 6; k++) { const t = 10 + 20 * k;
    for (const [x, y] of [[t, 12], [t, 108], [12, t], [108, t]]) s += `<circle cx="${x}" cy="${y}" r="12"/>`;
    p += `M${t - 4} 2V34M${t + 4} 4V34M${t - 4} 86V118M${t + 4} 86V116M2 ${t - 4}H34M4 ${t + 4}H34M86 ${t - 4}H118M86 ${t + 4}H116`; }
  css.setProperty('--frill', uri(`<svg ${NS} width="120" height="120" viewBox="0 0 120 120"><g fill="#fcc0e4">${s}<rect x="12" y="12" width="96" height="96"/></g>
    <path d="${p}" stroke="#a82454" stroke-width="2" stroke-opacity=".45"/></svg>`)); })();
css.setProperty('--print', uri(`<svg ${NS} width="120" height="150" viewBox="0 0 120 150">
  <g fill="#fff">${along('M60 66m-34 0a34 34 0 1 0 68 0a34 34 0 1 0 -68 0', 9).map(p => `<circle cx="${p.x}" cy="${p.y}" r="6"/>`).join('')}<circle cx="60" cy="66" r="34"/></g>
  <path transform="translate(36 44) scale(.48)" d="${HEART}" fill="#f8aed9"/>
  <g fill="#fff">${[[44,60],[56,56],[68,60],[50,72],[62,72],[56,84]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.2"/>`).join('')}</g>
  <g transform="translate(42 118) scale(.3)" fill="none" stroke="#a82454" stroke-width="8" stroke-linecap="round"><path d="M60 34C44 4 7 0 5 23C3 46 34 52 60 34ZM60 34C76 4 113 0 115 23C117 46 86 52 60 34ZM55 36L31 84M65 36L89 84"/></g>
  <g fill="#fff"><circle cx="8" cy="130" r="3"/><circle cx="112" cy="130" r="3"/><circle cx="8" cy="10" r="3"/><circle cx="112" cy="10" r="3"/></g></svg>`));
css.setProperty('--dotband', uri(`<svg ${NS} width="90" height="90" viewBox="0 0 90 90"><rect width="90" height="90" fill="#4a3234"/>
  ${[0,1,2].flatMap(i=>[0,1,2].map(j=>`<circle cx="${15+30*i}" cy="${15+30*j}" r="4.5" fill="#fcc0e4"/>`)).join('')}</svg>`));


if (location.hash === '#blank') document.documentElement.classList.add('blank');
const rr = (x, y, w, h, r) => `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;

/* [部位, 特徴（<em>で強調）, 補足] */

/* 箱: 影 → 金のふち → チョコの壁（水玉） → ピンクの敷き紙 → 仕切り → 紙カップ */
(() => {
  const outer = rr(0, 0, 1120, 800, 48), wall = rr(10, 10, 1100, 780, 40), liner = rr(44, 74, 1032, 692, 26);
  let cups = '';
  const cw = (988 - 56) / 3, ch = (668 - 56) / 3;
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    const x = 66 + c * (cw + 28), y = 96 + r * (ch + 28);
    const cup = rr(x, y, cw, ch, 22);

    cups += `<path d="${cup}" fill="#4a3234" opacity=".35" transform="translate(4 7)"/>
      <g fill="#fff" stroke="#fcc0e4" stroke-width="1.6">${pl}</g>

      <path d="${rr(x + 8, y + 8, cw - 16, ch - 16, 16)}" fill="url(#cupdot)"/>
      <path d="${rr(x + 16, y + 16, cw - 32, ch - 32, 12)}" fill="none" stroke="#f9b2dc" stroke-width="2.4" stroke-dasharray="6 5"/>`;
  }
  document.getElementById('box').innerHTML = `
    <defs>
      <pattern id="cdot" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="3.4" fill="#fcc0e4" opacity=".55"/></pattern>
      <pattern id="cupdot" width="40" height="40" patternUnits="userSpaceOnUse"><path transform="translate(14 14) scale(.12)" d="${HEART}" fill="#fcc0e4" opacity=".55"/></pattern>
      <pattern id="lgin" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#fcc0e4"/><rect width="15" height="30" fill="#fff" opacity=".35"/><rect width="30" height="15" fill="#fff" opacity=".35"/></pattern>
    </defs>
    <path d="${outer}" fill="#6c4848" opacity=".3" transform="translate(12 18)"/>
    <path d="${outer}" fill="#f0e4a8" stroke="#fff" stroke-width="8"/>
    <path d="${wall}" fill="url(#chocoG)"/><path d="${wall}" fill="url(#cdot)"/>
    ${pearls(rr(26, 26, 1068, 748, 32), 6)}
    <path d="${liner}" fill="url(#lgin)" stroke="#fff" stroke-width="5"/>
    ${cups}`;
})();

})();
/* 飾り（鈴・マカロン無し） */

  heart:'0 0 100 92', truffle:'0 0 100 100', cherry:'0 0 100 100', cream:'0 0 100 100' };

  ['heart', 300, 60, 44, -14, '#a82454'], ['heart', 850, 50, 40, 14, '#a82454'],
  ['spark', 250, 20, 40, 0, ''], ['spark', 900, 110, 34, 0, ''], ['spark', 1130, 520, 36, 0, ''], ['spark', 14, 600, 32, 0, ''],
];
const deco = document.getElementById('deco');
for (const [k, x, y, s, r, col] of D) {

}
