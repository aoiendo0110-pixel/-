  外見の特徴「メイクパレット」デザイン（しょこら公式カラー）
  ふたの鏡に見出し、6色のアイシャドウ＝6つの特徴。中身は SHADES を編集。
  （前のパッケージ風は src_look_package.html）
  python3 build_frame.py look → look_frame.html → node export_frames.js look
  → out/look_frame.png（文字入り）/ out/look_frame_blank.png（空）… 背景透過・2倍
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:"Zen Maru Gothic",sans-serif;padding:40px;color:#4a3234}
.frame{position:relative;width:1240px;height:1300px}
.u{position:absolute;overflow:visible;pointer-events:none}
#case{position:absolute;left:0;top:0;width:1240px;height:1300px;overflow:visible}

/* 鏡の文字 */
.mirror{position:absolute;left:170px;top:92px;width:900px;height:300px;z-index:3;text-align:center;padding-top:34px}
.mirror .s{font-family:"Great Vibes";font-size:58px;line-height:1;color:#a83c60;opacity:.9}
.mirror h1{font-family:"Mochiy Pop One";font-weight:400;font-size:84px;line-height:1.15;color:#a82454;letter-spacing:.06em;
  -webkit-text-stroke:10px #fff;paint-order:stroke fill;filter:drop-shadow(3px 5px 0 rgba(168,36,84,.25))}
.mirror .lip{font-family:"Hachi Maru Pop";font-size:26px;color:#a82454;margin-top:4px}

/* 色のラベル */
.shade{position:absolute;z-index:3;width:330px;text-align:center}
.shade .no{display:inline-block;font-family:"Mochiy Pop One";font-size:15px;letter-spacing:.2em;color:#fff;background:#6c4848;padding:3px 14px;border-radius:999px;margin-bottom:6px}
.shade b{display:block;font-size:30px;font-weight:900;line-height:1.25;color:#a82454;white-space:nowrap}
.shade small{display:block;font-size:20px;font-weight:900;line-height:1.35;color:#4a3234;margin-top:3px;white-space:nowrap}
:root.blank .shade b,:root.blank .shade small{visibility:hidden}
:root.blank .mirror h1,:root.blank .mirror .lip{visibility:hidden}
</style>

function along(d, step) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d); probe.appendChild(p);
  const L = p.getTotalLength(), n = Math.max(3, Math.round(L / step)), out = [];
  for (let i = 0; i < n; i++) {
    const a = p.getPointAtLength(L * i / n), b = p.getPointAtLength(L * (i + .5) / n);
    out.push({ x: +a.x.toFixed(1), y: +a.y.toFixed(1), ang: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI });
  }
  p.remove(); return out;
}
const pearls = (d, r) => along(d, r * 2.05).map(p => `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="url(#pearl)" stroke="#d9c3c8" stroke-width=".8"/>`).join('');
const heartPath = (cx, top, w, h) => { // ハート（中央x, 上端y, 幅, 高さ）
  const x0 = cx - w / 2, r = w / 4;
  return `M${cx} ${top + h}C${x0 + w * .19} ${top + h * .77} ${x0} ${top + h * .55} ${x0} ${top + h * .3}A${r} ${r} 0 0 1 ${cx} ${top + h * .14}A${r} ${r} 0 0 1 ${x0 + w} ${top + h * .3}C${x0 + w} ${top + h * .55} ${x0 + w * .81} ${top + h * .77} ${cx} ${top + h}Z`;
};
