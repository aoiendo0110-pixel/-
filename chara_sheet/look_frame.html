  外見の特徴「バレンタインのラブレター」デザイン（しょこら公式カラー）
  開いた封筒から出た便箋に特徴を書く。中身は .list を編集。
  python3 build_frame.py look → look_frame.html → node export_frames.js look
  （前の版: src_look_sticker / rosette / palette / package .html）
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:"Zen Maru Gothic",sans-serif;padding:40px;color:#4a3234}
.frame{position:relative;width:1200px;height:1020px}
.layer{position:absolute;left:0;top:0;width:1200px;height:1020px;overflow:visible}
.u{position:absolute;overflow:visible;pointer-events:none}

/* 便箋の中身（便箋と一緒に傾ける） */
.letter{position:absolute;left:190px;top:96px;width:820px;height:620px;z-index:3;transform:rotate(2.5deg);transform-origin:50% 100%;text-align:center}
.letter .dear{font-family:"Great Vibes";font-size:60px;line-height:1;color:#c44a74;margin-top:42px}
.letter h1{font-family:"Mochiy Pop One";font-weight:400;font-size:52px;letter-spacing:.14em;color:#a82454;line-height:1.2;margin-top:2px}
.letter h1 .h{color:#f59fd2}
.list{list-style:none;margin:18px auto 0;width:700px;text-align:left}
.list li{font-size:29px;font-weight:900;line-height:62px;height:62px;white-space:nowrap;color:#4a3234;padding-left:6px}
.list li::before{content:"♡";font-family:"Hachi Maru Pop";color:#a82454;margin-right:12px}
.list li em{font-style:normal;color:#a82454}
:root.blank .list li{color:transparent}
:root.blank .list li em{color:transparent}
</style>
</head>

const probe = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
probe.style.cssText = 'position:absolute;width:0;height:0'; document.body.appendChild(probe);
function along(d, step) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d); probe.appendChild(p);
  const L = p.getTotalLength(), n = Math.max(3, Math.round(L / step)), out = [];
  for (let i = 0; i < n; i++) {
    const a = p.getPointAtLength(L * i / n), b = p.getPointAtLength(L * (i + .5) / n);
    out.push({ x: +a.x.toFixed(1), y: +a.y.toFixed(1), ang: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI });
  }
  p.remove(); return out;
}
const pearls = (d, r) => along(d, r * 2.05).map(p => `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="url(#pearl)" stroke="#d9c3c8" stroke-width=".8"/>`).join('');
const heartPath = (cx, top, w, h) => { // ハート（中央x, 上端y, 幅, 高さ）
  const x0 = cx - w / 2, r = w / 4;
  return `M${cx} ${top + h}C${x0 + w * .19} ${top + h * .77} ${x0} ${top + h * .55} ${x0} ${top + h * .3}A${r} ${r} 0 0 1 ${cx} ${top + h * .14}A${r} ${r} 0 0 1 ${x0 + w} ${top + h * .3}C${x0 + w} ${top + h * .55} ${x0 + w * .81} ${top + h * .77} ${cx} ${top + h}Z`;
};

}

    <rect x="35" y="35" width="50" height="50" fill="none" stroke="${stitch}" stroke-width="2.4" stroke-dasharray="5 4"/></svg>`;
}
