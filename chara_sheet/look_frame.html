<title>しょこら 外見の特徴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Hachi+Maru+Pop&family=Great+Vibes&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<!--
  外見の特徴「お菓子のパッケージ（品質表示ラベル）」デザイン（しょこら公式カラー）
  中身は .label の表を編集。
  python3 build_frame.py look → look_frame.html → node export_frames.js look
  → out/look_frame.png（文字入り）/ out/look_frame_blank.png（空）… 背景透過・2倍
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:"Zen Maru Gothic",sans-serif;padding:40px;color:#4a3234}
.frame{position:relative;width:1140px;height:900px}
.u{position:absolute;overflow:visible;pointer-events:none}

/* 箱 */
.box{position:absolute;left:20px;top:20px;width:1100px;height:860px;border-radius:26px;overflow:hidden;
  background:repeating-linear-gradient(90deg,#fcc0e4 0 34px,#fdd3ec 34px 40px,#fcc0e4 40px 74px,#fff 74px 78px);
  box-shadow:0 0 0 6px #fff,14px 18px 0 6px rgba(108,72,72,.28)}
.box::after{content:"";position:absolute;inset:0;border-radius:26px;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.35) 0 18%,transparent 18% 60%,rgba(255,255,255,.18) 60% 64%,transparent 64%)}
/* 上の帯（ブランド） */
.band{position:absolute;left:0;right:0;top:0;height:150px;background:linear-gradient(180deg,#7c5656,#6c4848 60%,#553a3c);display:flex;align-items:center;justify-content:center;gap:24px}
.band::after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;
  background:radial-gradient(circle at 18px 0,#6c4848 17px,transparent 17.5px) 0 0/36px 18px repeat-x}
.brand{text-align:center;color:#f0e4a8}
.brand .s{font-family:"Great Vibes";font-size:72px;line-height:.95}
.brand .e{font-family:"Mochiy Pop One";font-size:16px;letter-spacing:.5em;color:#fcc0e4;margin-top:4px}
.band .logo{width:84px;height:84px}

/* 品質表示ラベル */
.label{position:absolute;left:84px;top:206px;width:820px;background:#fff;border:4px solid #4a3234;border-radius:6px;z-index:2;
  box-shadow:6px 8px 0 rgba(108,72,72,.18)}
.label .cap{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;border-bottom:4px solid #4a3234;background:#fff}
.label .cap b{font-family:"Mochiy Pop One";font-weight:400;font-size:34px;letter-spacing:.12em;color:#a82454}
.label .cap span{font-size:18px;font-weight:900;letter-spacing:.2em;color:#6c4848}
.label table{width:100%;border-collapse:collapse}
.label th,.label td{border-bottom:2.5px solid #4a3234;padding:14px 20px;vertical-align:top;text-align:left}
.label tr:last-child th,.label tr:last-child td{border-bottom:none}
.label th{width:170px;background:#fdd3ec;border-right:2.5px solid #4a3234;font-size:22px;font-weight:900;letter-spacing:.12em;white-space:nowrap}
.label td{font-size:27px;font-weight:900;line-height:1.5}
.label td em{font-style:normal;color:#a82454}
.label td .k{font-size:31px}
.label td.big{font-family:"Mochiy Pop One";font-weight:400;font-size:34px;letter-spacing:.04em}
.note{position:absolute;left:84px;top:720px;z-index:2;font-size:22px;font-weight:900;color:#4a3234;background:#fff;padding:6px 18px;border:2.5px solid #4a3234;border-radius:999px}
.note b{color:#a82454}
:root.blank .label td,:root.blank .note{color:transparent}
:root.blank .label td em{color:transparent}

/* 右下：バーコード */
.code{position:absolute;right:46px;bottom:34px;z-index:2;background:#fff;padding:12px 16px 8px;border-radius:8px;border:2.5px solid #4a3234;text-align:center}
.code svg{display:block;width:170px;height:80px}
.code span{font-family:"Zen Maru Gothic";font-weight:900;font-size:16px;letter-spacing:.24em}
</style>
</head>

    <symbol id="bb1" viewBox="0 0 40 38"><use href="#hp" transform="scale(.4)" fill="url(#chocoG)" stroke="#fff" stroke-width="6"/></symbol>
    <symbol id="bb2" viewBox="0 0 40 38"><circle cx="20" cy="20" r="16" fill="url(#truffleG)" stroke="#fff" stroke-width="2.5"/><path d="M8 18l6-4 5 5 5-5 5 5 5-4" fill="none" stroke="#fcc0e4" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="bb3" viewBox="0 0 40 38"><rect x="4" y="4" width="32" height="30" rx="7" fill="#a82454" stroke="#fff" stroke-width="2.5"/><path d="M8 12h24" stroke="#fff" stroke-width="2" stroke-dasharray="3 3"/></symbol>
    <symbol id="bb4" viewBox="0 0 40 38"><circle cx="20" cy="20" r="16" fill="#a82454" stroke="#fff" stroke-width="2.5"/><path d="M8 13q12 -9 24 0" fill="none" stroke="#fcc0e4" stroke-width="3" stroke-linecap="round"/></symbol>
  </defs>
</svg>
<div class="frame">
  <div class="box">
    <div class="band">
      <svg class="logo" viewBox="0 0 100 100" id="logoL"></svg>
      <div class="brand"><div class="s">Chocolat de Shokora</div><div class="e">SWEET CHOCOLATIER</div></div>
      <svg class="logo" viewBox="0 0 100 100" id="logoR"></svg>
    </div>
    <div class="label">
      <div class="cap"><b>外見の特徴</b><span>品質表示</span></div>
      <table>
        <tr><th>名　称</th><td class="big">しょこら</td></tr>
        <tr><th>原材料名</th><td><span class="k"><em>赤髪</em>ぱっつん前髪</span>、<span class="k"><em>ドリルツインテール</em></span>、<br>おっとり<em>紫目</em>、白い<em>もちもちほっぺ</em></td></tr>
        <tr><th>内容量</th><td class="big"><em>160</em>cm / <em>48</em>kg</td></tr>
        <tr><th>特記事項</th><td>大きめバスト（<em>Eカップ</em>）<br>全体的に少し<em>お姉さん体型</em></td></tr>
      </table>
    </div>
    <div class="note">※<b>甘さ</b>にご注意ください♡</div>
    <div class="code"><svg id="bar" viewBox="0 0 170 80" preserveAspectRatio="none"></svg><span>4 960214 1900</span></div>
  </div>
  <div id="deco"></div>
</div>

<script>
const css = document.documentElement.style;
const NS = 'xmlns="http://www.w3.org/2000/svg"';
const uri = svg => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
const HEART = 'M50 88C18 66 2 48 2 28A24 24 0 0 1 50 16A24 24 0 0 1 98 28C98 48 82 66 50 88Z';
const probe = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
probe.style.cssText = 'position:absolute;width:0;height:0'; document.body.appendChild(probe);
function along(d, step) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d); probe.appendChild(p);
  const L = p.getTotalLength(), n = Math.max(3, Math.round(L / step)), out = [];
  for (let i = 0; i < n; i++) {
    const a = p.getPointAtLength(L * i / n), b = p.getPointAtLength(L * (i + .5) / n);
    out.push({ x: +a.x.toFixed(1), y: +a.y.toFixed(1), ang: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI });
  }
  p.remove(); return out;
}
const pearls = (d, r) => along(d, r * 2.05).map(p => `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="url(#pearl)" stroke="#d9c3c8" stroke-width=".8"/>`).join('');
const heartPath = (cx, top, w, h) => { // ハート（中央x, 上端y, 幅, 高さ）
  const x0 = cx - w / 2, r = w / 4;
  return `M${cx} ${top + h}C${x0 + w * .19} ${top + h * .77} ${x0} ${top + h * .55} ${x0} ${top + h * .3}A${r} ${r} 0 0 1 ${cx} ${top + h * .14}A${r} ${r} 0 0 1 ${x0 + w} ${top + h * .3}C${x0 + w} ${top + h * .55} ${x0 + w * .81} ${top + h * .77} ${cx} ${top + h}Z`;
};

/* ---- 柄タイル ---- */
function laceTile() {
  return `<svg ${NS} width="60" height="40" viewBox="0 0 66 44"><mask id="m"><rect width="66" height="44" fill="#fff"/>
    <g fill="#000"><circle cx="11" cy="7" r="2.6"/><circle cx="33" cy="7" r="2.6"/><circle cx="55" cy="7" r="2.6"/><circle cx="33" cy="25" r="3.2"/>
    ${[0,1,2,3,4,5].map(i=>{const a=i/6*Math.PI*2,x=33+Math.cos(a)*7.5,y=25+Math.sin(a)*7.5;return `<ellipse cx="${x}" cy="${y}" rx="2.6" ry="1.6" transform="rotate(${a*180/Math.PI} ${x} ${y})"/>`}).join('')}
    <path transform="translate(-2.5 16) scale(.11)" d="${HEART}"/><path transform="translate(63.5 16) scale(.11)" d="${HEART}"/></g></mask>
    <g fill="#fff" fill-opacity=".96" mask="url(#m)"><rect width="66" height="14"/><circle cx="33" cy="24" r="16"/><circle cx="0" cy="18" r="11"/><circle cx="66" cy="18" r="11"/>
    ${[...Array(9)].map((_,i)=>{const a=(20+i*17.5)*Math.PI/180;return `<circle cx="${33+Math.cos(a)*17}" cy="${24+Math.sin(a)*17}" r="2.4"/>`}).join('')}</g></svg>`;
}
css.setProperty('--laceH', uri(laceTile()));
function laceFrame(fill, eye, stitch) {
  let s = '', e = '';
  for (let k = 0; k < 3; k++) { const t = 20 + 40 * k;
    for (const [x, y] of [[t, 19], [t, 101], [19, t], [101, t]]) { s += `<circle cx="${x}" cy="${y}" r="19"/>`; e += `<path transform="translate(${x - 5.5} ${y - 7}) scale(.11)" d="${HEART}"/>`; } }
  return `<svg ${NS} width="120" height="120" viewBox="0 0 120 120"><g fill="${fill}">${s}<rect x="19" y="19" width="82" height="82"/></g><g fill="${eye}">${e}</g>
    <rect x="35" y="35" width="50" height="50" fill="none" stroke="${stitch}" stroke-width="2.4" stroke-dasharray="5 4"/></svg>`;
}
css.setProperty('--laceW', uri(laceFrame('#ffffff', '#f9b2dc', '#f9b2dc')));
css.setProperty('--laceC', uri(laceFrame('#fff4f8', '#f59fd2', '#a82454')));
(() => { let s = '', p = '';
  for (let k = 0; k < 6; k++) { const t = 10 + 20 * k;
    for (const [x, y] of [[t, 12], [t, 108], [12, t], [108, t]]) s += `<circle cx="${x}" cy="${y}" r="12"/>`;
    p += `M${t - 4} 2V34M${t + 4} 4V34M${t - 4} 86V118M${t + 4} 86V116M2 ${t - 4}H34M4 ${t + 4}H34M86 ${t - 4}H118M86 ${t + 4}H116`; }
  css.setProperty('--frill', uri(`<svg ${NS} width="120" height="120" viewBox="0 0 120 120"><g fill="#fcc0e4">${s}<rect x="12" y="12" width="96" height="96"/></g>
    <path d="${p}" stroke="#a82454" stroke-width="2" stroke-opacity=".45"/></svg>`)); })();
css.setProperty('--print', uri(`<svg ${NS} width="120" height="150" viewBox="0 0 120 150">
  <g fill="#fff">${along('M60 66m-34 0a34 34 0 1 0 68 0a34 34 0 1 0 -68 0', 9).map(p => `<circle cx="${p.x}" cy="${p.y}" r="6"/>`).join('')}<circle cx="60" cy="66" r="34"/></g>
  <path transform="translate(36 44) scale(.48)" d="${HEART}" fill="#f8aed9"/>
  <g fill="#fff">${[[44,60],[56,56],[68,60],[50,72],[62,72],[56,84]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.2"/>`).join('')}</g>
  <g transform="translate(42 118) scale(.3)" fill="none" stroke="#a82454" stroke-width="8" stroke-linecap="round"><path d="M60 34C44 4 7 0 5 23C3 46 34 52 60 34ZM60 34C76 4 113 0 115 23C117 46 86 52 60 34ZM55 36L31 84M65 36L89 84"/></g>
  <g fill="#fff"><circle cx="8" cy="130" r="3"/><circle cx="112" cy="130" r="3"/><circle cx="8" cy="10" r="3"/><circle cx="112" cy="10" r="3"/></g></svg>`));
css.setProperty('--dotband', uri(`<svg ${NS} width="90" height="90" viewBox="0 0 90 90"><rect width="90" height="90" fill="#4a3234"/>
  ${[0,1,2].flatMap(i=>[0,1,2].map(j=>`<circle cx="${15+30*i}" cy="${15+30*j}" r="4.5" fill="#fcc0e4"/>`)).join('')}</svg>`));


if (location.hash === '#blank') document.documentElement.classList.add('blank');
/* ブランドのハートロゴ */
const logo = `<circle cx="50" cy="50" r="44" fill="none" stroke="#f0e4a8" stroke-width="4"/><circle cx="50" cy="50" r="36" fill="none" stroke="#f0e4a8" stroke-width="1.6" stroke-dasharray="3 3"/>
  <path transform="translate(28 30) scale(.44)" d="${HEART}" fill="#fcc0e4"/>`;
document.getElementById('logoL').innerHTML = logo; document.getElementById('logoR').innerHTML = logo;
/* バーコード（ハートつき） */
(() => {
  let x = 4, g = '', i = 0;
  while (x < 166) { const w = [2, 4, 2, 6, 2, 3][(i * 7) % 6]; g += `<rect x="${x}" y="0" width="${w}" height="${i % 9 === 0 ? 80 : 70}" fill="#4a3234"/>`; x += w + [2, 3, 2, 4][(i * 5) % 4]; i++; }
  document.getElementById('bar').innerHTML = g + `<path transform="translate(73 20) scale(.24)" d="${HEART}" fill="#a82454" stroke="#fff" stroke-width="12"/>`;
})();
/* 金のシール（スカラップ） */
const seal = (() => {
  let s = ''; for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; s += `<circle cx="${100 + Math.cos(a) * 84}" cy="${100 + Math.sin(a) * 84}" r="16"/>`; }
  return `<svg class="u" viewBox="0 0 200 200" style="left:900px;top:150px;width:210px;height:210px;z-index:5;transform:rotate(14deg);filter:drop-shadow(4px 6px 0 rgba(108,72,72,.3))">
    <defs><radialGradient id="sg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fffbe8"/><stop offset=".5" stop-color="#f0e4a8"/><stop offset="1" stop-color="#c9ae64"/></radialGradient>
    <path id="arc" d="M50 102A50 50 0 0 1 150 102"/><path id="arc2" d="M52 98A48 48 0 0 0 148 98"/></defs>
    <g fill="url(#sg)" stroke="#fff" stroke-width="3">${s}<circle cx="100" cy="100" r="84"/></g>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#a82454" stroke-width="3"/><circle cx="100" cy="100" r="62" fill="none" stroke="#a82454" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text font-family="Mochiy Pop One" font-size="13" fill="#a82454" letter-spacing="1.5"><textPath href="#arc" startOffset="50%" text-anchor="middle">SWEET &amp; BITTER</textPath></text>
    <text font-family="Mochiy Pop One" font-size="12" fill="#a82454" letter-spacing="2" dy="12"><textPath href="#arc2" startOffset="50%" text-anchor="middle">SINCE 0214</textPath></text>
    <path transform="translate(84 86) scale(.32)" d="${HEART}" fill="#a82454"/></svg>`;
})();
document.getElementById('deco').insertAdjacentHTML('beforeend', seal);
/* 飾り（少なめ：パッケージらしく） */
const VB = { chocoheart:'0 0 100 92', berryS:'0 0 80 92', spark:'0 0 100 100', truffle:'0 0 100 100' };
const D = [['chocoheart', 1000, 520, 130, 14, ''], ['berryS', 1058, 460, 64, 20, ''], ['truffle', 940, 640, 70, 0, ''],
  ['spark', 980, 400, 40, 0, ''], ['spark', 30, 840, 34, 0, '']];
for (const [k, x, y, s, r, col] of D) {
  const [, , vw, vh] = VB[k].split(' ').map(Number);
  document.getElementById('deco').insertAdjacentHTML('beforeend', `<svg class="u" viewBox="${VB[k]}" style="left:${x}px;top:${y}px;width:${s}px;height:${s * vh / vw}px;z-index:6;transform:rotate(${r}deg);color:${col};filter:drop-shadow(3px 5px 0 rgba(108,72,72,.28))${k === 'spark' ? ' drop-shadow(0 0 6px #f59fd2)' : ''}"><use href="#${k}"/></svg>`);
}
</script>
</body>
</html>
