<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>しょこら イメージソング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Hachi+Maru+Pop&family=Great+Vibes&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<!--
  イメージソング「コンサートチケット」デザイン（しょこら公式カラー）
  後ろにチョコのレコード、1曲＝1枚のチケットを2枚重ねる。
  python3 build_song.py → song_frame.html → node export_frames.js song
  → out/song_frame.png（曲名入り）/ out/song_frame_blank.png（空）… 背景透過・2倍
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:"Zen Maru Gothic",sans-serif;padding:40px}
.frame{position:relative;width:1120px;height:700px}
.u{position:absolute;overflow:visible;pointer-events:none}

/* レコード */
.record{position:absolute;left:560px;top:0;width:540px;height:540px;z-index:1}

/* 見出し */
.head{position:absolute;left:24px;top:6px;z-index:5;transform:rotate(-6deg)}
.head .s{font-family:"Great Vibes";font-size:110px;line-height:1;color:#a82454;-webkit-text-stroke:14px #fff;paint-order:stroke fill;
  filter:drop-shadow(4px 6px 0 rgba(108,72,72,.3))}
.head .j{display:inline-block;margin:-6px 0 0 120px;font-family:"Mochiy Pop One";font-size:26px;letter-spacing:.2em;color:#fff;padding:6px 22px;border-radius:999px;
  background:radial-gradient(rgba(252,192,228,.6) 2.2px,transparent 2.8px) 0 0/13px 13px,#6c4848;box-shadow:0 0 0 4px #fff,4px 6px 0 4px rgba(108,72,72,.25)}

/* チケット */
.ticket{position:absolute;z-index:4;width:900px;height:220px}
.ticket svg.bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ticket .stub{position:absolute;left:0;top:0;width:180px;height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.ticket .stub .side{font-family:"Mochiy Pop One";font-size:22px;letter-spacing:.18em}
.ticket .stub .ab{font-family:"Mochiy Pop One";font-size:76px;line-height:1;margin:2px 0 4px;color:#fcc0e4;-webkit-text-stroke:6px #fff;paint-order:stroke fill}
.ticket .stub .no{font-family:"Zen Maru Gothic";font-weight:900;font-size:14px;letter-spacing:.2em;opacity:.9}
.ticket .main{position:absolute;left:226px;right:70px;top:0;height:220px;display:flex;flex-direction:column;justify-content:center}
.ticket .tag{font-family:"Mochiy Pop One";font-size:15px;letter-spacing:.22em;color:#a82454}
.ticket b{display:block;font-size:66px;font-weight:900;line-height:1.1;color:#a82454;white-space:nowrap;margin:2px 0 6px;
  -webkit-text-stroke:8px #fff;paint-order:stroke fill;filter:drop-shadow(3px 4px 0 #fcc0e4)}
.ticket small{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:900;color:#6c4848}
.ticket small::before{content:"";width:34px;height:3px;background:#e98cc0;border-radius:2px}
:root.blank .ticket .main > *{visibility:hidden}
</style>
</head>
<body>
{{DEFS}}
<div class="frame">
  <svg class="record" id="record" viewBox="0 0 540 540" aria-hidden="true"></svg>

  <div class="head"><div class="s">Image Song</div><div class="j">イメージソング</div></div>

  <div class="ticket" style="left:40px;top:196px;transform:rotate(-4deg)">
    <svg class="bg" viewBox="0 0 900 220" aria-hidden="true"><use href="#ticket"/></svg>
    <div class="stub"><span class="side">SIDE</span><span class="ab">A</span><span class="no">No.0214</span></div>
    <div class="main"><span class="tag">♡ TRACK 01 ♡</span><b>毒チョコ</b><small>ザアザア</small></div>
  </div>
  <div class="ticket" style="left:170px;top:440px;transform:rotate(3deg)">
    <svg class="bg" viewBox="0 0 900 220" aria-hidden="true"><use href="#ticket"/></svg>
    <div class="stub"><span class="side">SIDE</span><span class="ab">B</span><span class="no">No.0214</span></div>
    <div class="main"><span class="tag">♡ TRACK 02 ♡</span><b>妄想日記2</b><small>シド</small></div>
  </div>
  <div id="deco"></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="tgin" width="30" height="30" patternUnits="userSpaceOnUse">
    <rect width="30" height="30" fill="#fff8fc"/><rect width="15" height="30" fill="#fcc0e4" opacity=".28"/><rect width="30" height="15" fill="#fcc0e4" opacity=".28"/></pattern>
  <pattern id="wdot" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#a82454"/><circle cx="8" cy="8" r="2.6" fill="#fff" opacity=".35"/></pattern>
  <!-- チケット（左に半券、境目に丸い切り欠き、右端は波） -->
  <symbol id="ticket" viewBox="0 0 900 220">
    <path id="tk" d="M20 0H170A20 20 0 0 0 210 0H880A20 20 0 0 1 900 20V40A12 12 0 0 0 900 64V84A12 12 0 0 0 900 108V128A12 12 0 0 0 900 152V172A12 12 0 0 0 900 196V200A20 20 0 0 1 880 220H210A20 20 0 0 0 170 220H20A20 20 0 0 1 0 200V20A20 20 0 0 1 20 0Z"/>
    <use href="#tk" fill="#6c4848" opacity=".28" transform="translate(10 14)"/>
    <use href="#tk" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
    <use href="#tk" fill="url(#tgin)"/>
    <path d="M20 0H170A20 20 0 0 0 190 20V200A20 20 0 0 0 170 220H20A20 20 0 0 1 0 200V20A20 20 0 0 1 20 0Z" fill="url(#wdot)"/>
    <path d="M190 22V198" stroke="#fff" stroke-width="5" stroke-dasharray="2 11" stroke-linecap="round"/>
    <rect x="214" y="14" width="666" height="192" rx="12" fill="none" stroke="#e98cc0" stroke-width="3" stroke-dasharray="9 7"/>
    <path d="M214 34H880M214 186H880" stroke="#fcc0e4" stroke-width="6"/>
    <path transform="translate(806 30) scale(.5)" d="M50 88C18 66 2 48 2 28A24 24 0 0 1 50 16A24 24 0 0 1 98 28C98 48 82 66 50 88Z" fill="#fcc0e4" opacity=".9"/>
    <g transform="translate(820 140) scale(.9)" fill="#a82454" opacity=".85"><path d="M22 50V10L50 4V42" fill="none" stroke="#a82454" stroke-width="5" stroke-linecap="round"/><ellipse cx="14" cy="52" rx="11" ry="8" transform="rotate(-20 14 52)"/><ellipse cx="42" cy="44" rx="11" ry="8" transform="rotate(-20 42 44)"/><path d="M22 18L50 12" stroke="#a82454" stroke-width="5"/></g>
  </symbol>
  <symbol id="note" viewBox="0 0 54 64">
    <path d="M22 50V10L50 4V42" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="14" cy="52" rx="11" ry="8" fill="currentColor" transform="rotate(-20 14 52)"/><ellipse cx="42" cy="44" rx="11" ry="8" fill="currentColor" transform="rotate(-20 42 44)"/>
    <path d="M22 18L50 12" stroke="currentColor" stroke-width="5"/>
  </symbol>
  <symbol id="note2" viewBox="0 0 54 64">
    <path d="M28 52V6C34 14 46 16 48 28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="19" cy="53" rx="12" ry="9" fill="currentColor" transform="rotate(-20 19 53)"/>
  </symbol>
</defs></svg>

<script>
{{HELPERS}}
if (location.hash === '#blank') document.documentElement.classList.add('blank');
/* チョコのレコード（溝・ツヤ・ハートのラベル・まわりにパール） */
(() => {
  let grooves = '';
  for (let r = 120; r < 250; r += 9) grooves += `<circle cx="270" cy="270" r="${r}" fill="none" stroke="#6c4848" stroke-width="2" opacity="${.5 + (r % 2) * .2}"/>`;
  document.getElementById('record').innerHTML = `
    <circle cx="280" cy="284" r="262" fill="#6c4848" opacity=".3"/>
    <circle cx="270" cy="270" r="262" fill="#fff"/>
    <circle cx="270" cy="270" r="254" fill="#3e2a2c"/>
    ${grooves}
    <path d="M90 150A210 210 0 0 1 200 66" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="16" stroke-linecap="round"/>
    <path d="M440 400A210 210 0 0 1 360 460" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="12" stroke-linecap="round"/>
    <circle cx="270" cy="270" r="104" fill="#fcc0e4" stroke="#fff" stroke-width="6"/>
    <circle cx="270" cy="270" r="92" fill="none" stroke="#e98cc0" stroke-width="3" stroke-dasharray="7 6"/>
    <path transform="translate(222 226) scale(.96)" d="${HEART}" fill="#a82454"/>
    <circle cx="270" cy="270" r="8" fill="#fff"/>
    ${pearls('M270 8A262 262 0 1 1 269.9 8Z', 7)}`;
})();
const VB = { bowS:'0 0 120 94', bowP:'0 0 120 94', chocoheart:'0 0 100 92', berryS:'0 0 80 92', rose:'0 0 100 100', spark:'0 0 100 100',
  heart:'0 0 100 92', truffle:'0 0 100 100', note:'0 0 54 64', note2:'0 0 54 64', cherry:'0 0 100 100' };
const D = [
  ['bowP', 860, 150, 150, 18, ''],          // 1枚目チケットの右端
  ['bowS', 110, 410, 130, -20, ''],         // 2枚目チケットの左端
  ['chocoheart', 980, 520, 120, 16, ''], ['berryS', 1050, 470, 56, 22, ''],
  ['cherry', 24, 620, 80, -10, ''], ['rose', 900, 30, 70, 0, '#f78fb2'],
  ['note', 596, 70, 56, 14, '#a82454'], ['note2', 520, 120, 46, -10, '#6c4848'], ['note', 1060, 330, 48, 8, '#e98cc0'],
  ['heart', 420, 130, 46, -16, '#e8789d'], ['heart', 70, 168, 34, 12, '#6c4848'],
  ['spark', 380, 40, 44, 0, ''], ['spark', 1040, 220, 36, 0, ''], ['spark', 120, 650, 34, 0, ''], ['spark', 760, 660, 40, 0, ''],
];
const deco = document.getElementById('deco');
for (const [k, x, y, s, r, col] of D) {
  const [, , vw, vh] = VB[k].split(' ').map(Number);
  deco.insertAdjacentHTML('beforeend', `<svg class="u" viewBox="${VB[k]}" style="left:${x}px;top:${y}px;width:${s}px;height:${s * vh / vw}px;z-index:6;transform:rotate(${r}deg);color:${col};filter:drop-shadow(3px 5px 0 rgba(108,72,72,.28))${k === 'spark' ? ' drop-shadow(0 0 6px #f59fd2)' : ''}"><use href="#${k}"/></svg>`);
}
</script>
</body>
</html>
