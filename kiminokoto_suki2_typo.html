<!doctype html><html><head><meta charset="utf-8">
<title>君のことが好きなの タイポ2</title>
<style>@font-face{font-family:"Mochiy Pop One";src:url(fonts/MochiyPopOne.ttf)}@font-face{font-family:"Hachi Maru Pop";src:url(fonts/HachiMaruPop.ttf)}
html,body{margin:0;background:#00ff00;overflow:hidden}svg{display:block}</style></head><body>
<!-- #transparent で背景なし / #t=秒 でその瞬間を表示 -->
<svg id="art" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
 <path id="heartP" d="M0 14 C-28 -6 -15 -32 0 -15 C15 -32 28 -6 0 14Z"/>
 <path id="sparkP" d="M0 -22 Q3 -3 22 0 Q3 3 0 22 Q-3 3 -22 0 Q-3 -3 0 -22Z"/>
 <pattern id="dotsS" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.2" fill="#fff" opacity=".55"/><circle cx="12" cy="12" r="2.2" fill="#fff" opacity=".55"/></pattern>
 <pattern id="dotsW" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3.4" fill="#fff" opacity=".6"/><circle cx="18" cy="18" r="3.4" fill="#fff" opacity=".6"/></pattern>
 <pattern id="gingB" width="48" height="48" patternUnits="userSpaceOnUse"><rect width="48" height="48" fill="#e6f6ff"/><rect width="24" height="48" fill="#9fd8f8" opacity=".55"/><rect width="48" height="24" fill="#9fd8f8" opacity=".55"/></pattern>
 <linearGradient id="gPink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd6e7"/><stop offset=".55" stop-color="#ffa6cb"/><stop offset="1" stop-color="#ff8dbd"/></linearGradient>
 <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2f6ff"/><stop offset=".55" stop-color="#a9e0ff"/><stop offset="1" stop-color="#86cff9"/></linearGradient>
 <linearGradient id="satinP" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9cc4"/><stop offset=".45" stop-color="#ffd3e5"/><stop offset="1" stop-color="#ff9cc4"/></linearGradient>
 <linearGradient id="satinPH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd3e5"/><stop offset="1" stop-color="#ff9cc4"/></linearGradient>
</defs>
<g id="stage"></g>
</svg>
<script>
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const stage=document.getElementById('stage'), defs=document.querySelector('defs');
const F1="Mochiy Pop One", F2="Hachi Maru Pop";
const clamp=x=>Math.max(0,Math.min(1,x));
const back=(x,c=2.2)=>1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);
const eOut=x=>1-Math.pow(1-x,3), eIn=x=>x*x*x, eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const TAU=Math.PI*2;
let uid=0;
function heart(fill,line,sc){const g=el('g',{});
 el('use',{href:'#heartP',fill:'#fff',stroke:'#fff','stroke-width':12,'stroke-linejoin':'round',transform:`scale(${sc})`},g);
 el('use',{href:'#heartP',fill,stroke:line,'stroke-width':3,transform:`scale(${sc})`},g);
 el('use',{href:'#heartP',fill:'url(#dotsS)',transform:`scale(${sc})`},g);
 el('ellipse',{cx:-9*sc,cy:-14*sc,rx:4.5*sc,ry:2.6*sc,fill:'#fff',transform:`rotate(-35 ${-9*sc} ${-14*sc})`},g);return g;}
function spark(fill,sc){const g=el('g',{});
 el('use',{href:'#sparkP',fill:'#fff',stroke:'#fff','stroke-width':9,'stroke-linejoin':'round',transform:`scale(${sc})`},g);
 el('use',{href:'#sparkP',fill,transform:`scale(${sc})`},g);return g;}
function bow(main,line,sc){const g=el('g',{});const b=el('g',{transform:`scale(${sc})`},g);
 const loopL='M0 0 C-30 -50 -95 -48 -92 -5 C-90 35 -35 30 0 0Z', loopR='M0 0 C30 -50 95 -48 92 -5 C90 35 35 30 0 0Z';
 const tails='M-8 6 C-30 40 -10 60 -44 92 L-24 92 L-20 112 C0 70 -12 50 6 10Z M8 6 C30 40 10 60 44 92 L24 92 L20 112 C0 70 12 50 -6 10Z';
 [tails,loopL,loopR].forEach(d=>el('path',{d,fill:'#fff',stroke:'#fff','stroke-width':16,'stroke-linejoin':'round'},b));
 [tails,loopL,loopR].forEach(d=>{el('path',{d,fill:main,stroke:line,'stroke-width':4,'stroke-linejoin':'round'},b);el('path',{d,fill:'url(#dotsS)'},b);});
 el('path',{d:'M-60 -10 C-50 -22 -30 -20 -18 -8 M60 -10 C50 -22 30 -20 18 -8',fill:'none',stroke:line,'stroke-width':3,'stroke-linecap':'round',opacity:.7},b);
 el('rect',{x:-17,y:-17,width:34,height:34,rx:12,fill:main,stroke:line,'stroke-width':4},b);
 el('ellipse',{cx:-5,cy:-7,rx:6,ry:3.5,fill:'#fff'},b);return g;}

function puffy(ch,font,size,c,o,sh,fat){
 const g=el('g',{}),base={'font-family':font,'font-size':size,'text-anchor':'middle','stroke-linejoin':'round'};
 const T=a=>{const e=el('text',{...base,...a},g);e.textContent=ch;return e;};
 T({fill:c.dark,stroke:c.dark,'stroke-width':o[0]*2,transform:`translate(${sh[0]} ${sh[1]})`});
 T({fill:c.line,stroke:c.line,'stroke-width':o[0]*2});
 T({fill:'#fff',stroke:'#fff','stroke-width':o[1]*2});
 T({fill:c.inner||c.line,stroke:c.inner||c.line,'stroke-width':o[2]*2});
 T({fill:c.fill,...(fat?{stroke:c.solid,'stroke-width':fat*2}:{})});
 T({fill:'url(#dotsW)'});
 const id='tc'+(uid++);const cp=el('clipPath',{id},defs);const ct=el('text',base,cp);ct.textContent=ch;
 const sh2=el('g',{'clip-path':`url(#${id})`},g);
 el('ellipse',{cx:-size*0.14,cy:-size*0.66,rx:size*0.42,ry:size*0.1,fill:'#fff',opacity:.7,transform:`rotate(-18 ${-size*0.14} ${-size*0.66})`},sh2);
 return g;}
const PK={dark:'#d95b91',line:'#f27aaa',fill:'url(#gPink)',solid:'#ffb0d0'},BL={dark:'#4c9ad3',line:'#5fb0e6',fill:'url(#gBlue)',solid:'#b2e3ff'};

// ===== アーチのリボン帯（君のことが）=====
const ARC={cx:960,cy:1500,r:1320,a0:-118,a1:-62};
const P=(r,a)=>[ARC.cx+r*Math.cos(a*Math.PI/180),ARC.cy+r*Math.sin(a*Math.PI/180)];
const arcD=(r,a0=ARC.a0,a1=ARC.a1)=>{const [x0,y0]=P(r,a0),[x1,y1]=P(r,a1);return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;};
const banner=el('g',{},stage);
(()=>{const g=banner;
 // しっぽ（両端のV字リボン）
 [[ARC.a0,-1],[ARC.a1,1]].forEach(([a,s])=>{const tg=el('g',{},g);const [x,y]=P(ARC.r,a);
  tg.setAttribute('transform',`translate(${x} ${y}) rotate(${a+90})`);
  const d=`M${s*-20} -70 L${s*150} -62 L${s*105} 8 L${s*150} 78 L${s*-20} 70Z`;
  el('path',{d,fill:'#d95b91',transform:'translate(6 10)'},tg);
  el('path',{d,fill:'#fff',stroke:'#fff','stroke-width':18,'stroke-linejoin':'round'},tg);
  el('path',{d,fill:'#ffb3d1',stroke:'#f27aaa','stroke-width':5,'stroke-linejoin':'round'},tg);
  el('path',{d,fill:'url(#dotsS)'},tg);});
 el('path',{d:arcD(ARC.r),fill:'none',stroke:'#4c9ad3','stroke-width':170,transform:'translate(8 12)'},g);
 // レースのスカラップ（上下）
 [ARC.r+82,ARC.r-82].forEach(r=>{const n=46;for(let i=0;i<=n;i++){const [x,y]=P(r,ARC.a0+(ARC.a1-ARC.a0)*i/n);el('circle',{cx:x,cy:y,r:20,fill:'#5fb0e6'},g);}});
 [ARC.r+82,ARC.r-82].forEach(r=>{const n=46;for(let i=0;i<=n;i++){const [x,y]=P(r,ARC.a0+(ARC.a1-ARC.a0)*i/n);el('circle',{cx:x,cy:y,r:16.5,fill:'#fff'},g);
  const [x2,y2]=P(r+(r>ARC.r?7:-7),ARC.a0+(ARC.a1-ARC.a0)*i/n);el('circle',{cx:x2,cy:y2,r:3.8,fill:'#bfe5fb'},g);}});
 el('path',{d:arcD(ARC.r),fill:'none',stroke:'#fff','stroke-width':172},g);
 el('path',{d:arcD(ARC.r),fill:'none',stroke:'#5fb0e6','stroke-width':156},g);
 el('path',{d:arcD(ARC.r),fill:'none',stroke:'url(#gingB)','stroke-width':146},g);
 [ARC.r+58,ARC.r-58].forEach(r=>el('path',{d:arcD(r),fill:'none',stroke:'#fff','stroke-width':5,'stroke-dasharray':'16 11','stroke-linecap':'round'},g));
})();
const line1=[];
[...'君のことが'].forEach((ch,i)=>{const c=i===0?PK:BL;const s=i===0?175:160;
 const g=puffy(ch,F1,s,c,[22,16,6],[7,10]);stage.appendChild(g);
 const a=ARC.a0+(ARC.a1-ARC.a0)*(0.12+i*0.19);const [x,y]=P(ARC.r,a);
 line1.push({g,x,y,rot:a+90,s,t0:0.5+i*0.11,ph:i*0.9});});

// ===== 好きなの（箱から飛び出す）=====
const line2=[];
[...'好きなの'].forEach((ch,i)=>{const big=i<2;const c=i===2?BL:PK;const s=big?280:245;
 const g=puffy(ch,big?F1:F2,s,c,[27,20,7],[9,13],big?0:4);stage.appendChild(g);
 line2.push({g,x:960+(i-1.5)*285,y:640+(i%2?-12:8),r:i%2?6:-6,t0:2.25+i*0.08,ph:i*0.9+2});});

// ===== プレゼントボックス =====
const BX={x:960,top:790,bot:1050,w:520};
const box=el('g',{},stage);
(()=>{const g=box,L=-BX.w/2,R=BX.w/2,T=0,B=BX.bot-BX.top;
 el('rect',{x:L,y:T,width:BX.w,height:B,rx:16,fill:'#4c9ad3',transform:'translate(10 12)'},g);
 el('rect',{x:L,y:T,width:BX.w,height:B,rx:16,fill:'#fff',stroke:'#fff','stroke-width':22},g);
 el('rect',{x:L,y:T,width:BX.w,height:B,rx:16,fill:'url(#gingB)',stroke:'#5fb0e6','stroke-width':5},g);
 el('rect',{x:-44,y:T,width:88,height:B,fill:'#fff'},g);
 el('rect',{x:-36,y:T,width:72,height:B,fill:'url(#satinP)',stroke:'#f27aaa','stroke-width':4},g);
 el('rect',{x:-36,y:T,width:72,height:B,fill:'url(#dotsS)'},g);
 // 箱の口のフリル
 for(let x=L+10;x<=R-10;x+=26){el('circle',{cx:x,cy:T,r:17,fill:'#f27aaa'},g);}
 for(let x=L+10;x<=R-10;x+=26){el('circle',{cx:x,cy:T,r:13.5,fill:'#fff'},g);el('circle',{cx:x,cy:T+6,r:3.2,fill:'#ffc1da'},g);}
 const tag=heart('#ffb3d1','#ef78a8',1.6);tag.setAttribute('transform',`translate(${R-75} ${B-70}) rotate(12)`);g.appendChild(tag);
})();
const lid=el('g',{},stage);
(()=>{const g=lid,W=BX.w+60,H=86;
 el('rect',{x:-W/2,y:-H,width:W,height:H,rx:16,fill:'#4c9ad3',transform:'translate(10 12)'},g);
 el('rect',{x:-W/2,y:-H,width:W,height:H,rx:16,fill:'#fff',stroke:'#fff','stroke-width':22},g);
 el('rect',{x:-W/2,y:-H,width:W,height:H,rx:16,fill:'url(#gingB)',stroke:'#5fb0e6','stroke-width':5},g);
 el('rect',{x:-44,y:-H,width:88,height:H,fill:'#fff'},g);
 el('rect',{x:-36,y:-H,width:72,height:H,fill:'url(#satinP)',stroke:'#f27aaa','stroke-width':4},g);
 const b=bow('#ffb3d1','#ef78a8',1.35);b.setAttribute('transform',`translate(0 ${-H-6})`);g.appendChild(b);
})();

// はじけるハート＆キラキラ
const burst=[];
for(let i=0;i<16;i++){const k=i%3;const g=k===2?spark(i%2?'#bfe8ff':'#ffd1e4',0.9+(i%4)*0.15):heart(k?'#a9defb':'#ffb3d1',k?'#4fa6e0':'#ef78a8',0.8+(i%4)*0.18);stage.appendChild(g);
 const a=(-172+i*(164/15))*Math.PI/180;burst.push({g,a,d:520+(i%4)*90,ph:i*0.6,spin:k===2});}
const floaters=[];
[[140,560,'#ffb3d1','#ef78a8',1.2],[1790,560,'#a9defb','#4fa6e0',1.2],[260,950,'#a9defb','#4fa6e0',1.0],[1660,960,'#ffb3d1','#ef78a8',1.0]]
 .forEach(([x,y,f,l,s],i)=>{const g=heart(f,l,s);stage.appendChild(g);floaters.push({g,x,y,s:1,t0:1.0+i*0.12,ph:i*1.1,rot:i%2?14:-14,kind:'h'});});
[[960,60,'#fff',1.1],[150,250,'#bfe8ff',1.0],[1770,250,'#ffd1e4',1.0],[480,1000,'#ffd1e4',0.8],[1440,1010,'#bfe8ff',0.8]]
 .forEach(([x,y,f,s],i)=>{const g=spark(f,s);stage.appendChild(g);floaters.push({g,x,y,s,t0:0.9+i*0.1,ph:i*0.9,kind:'s'});});

const OPEN=2.1;
window.render=function(t){
 // リボン帯：まんなかから広がる
 const bp=clamp(t/0.55),bs=bp<=0?0.0001:back(bp,1.6);
 const sway=Math.sin(TAU*t*0.35)*1.5;
 banner.setAttribute('transform',`translate(960 260) rotate(${sway}) scale(${bs} ${Math.min(1,0.5+bs*0.5)}) translate(-960 -260)`);
 line1.forEach(o=>{const p=clamp((t-o.t0)/0.4);
  if(p<=0){o.g.setAttribute('transform','translate(-9999 0)');return;}
  const s=back(p,2.6),idle=clamp((t-o.t0-0.4)/0.4);
  const ux=o.x-960, uy=o.y-260, rr=sway*Math.PI/180;
  const x=960+ux*Math.cos(rr)-uy*Math.sin(rr), y=260+ux*Math.sin(rr)+uy*Math.cos(rr);
  o.g.setAttribute('transform',`translate(${x} ${y}) rotate(${o.rot+sway+(1-eOut(p))*-30+Math.sin(TAU*t*0.4+o.ph)*3*idle}) translate(0 ${o.s*0.36+Math.sin(TAU*t*0.45+o.ph)*4*idle}) scale(${s})`);});
 // 箱：ぽんっ→わくわく揺れる→パカッ
 const xp=clamp((t-0.35)/0.45),xs=xp<=0?0.0001:back(xp,2.2);
 const wig=t>1.3&&t<OPEN?Math.sin((t-1.3)*38)*5*clamp((t-1.3)/0.3):0;
 const pop=t>OPEN?Math.sin(Math.PI*clamp((t-OPEN)/0.3))*0.08:0;
 const bob=t>OPEN+0.4?Math.sin(TAU*t*0.5)*4:0;
 box.setAttribute('transform',`translate(${BX.x} ${BX.bot+bob}) rotate(${wig}) scale(${xs*(1+pop)} ${xs*(1-pop)}) translate(0 ${-(BX.bot-BX.top)})`);
 // フタ：とんでいってナナメに着地
 const lp=clamp((t-OPEN)/0.7), le=eOut(lp);
 let lx=BX.x, ly=BX.top+bob, lr=wig;
 if(lp>0){lx=BX.x+(1570-BX.x)*le; ly=BX.top-Math.sin(Math.PI*lp)*360+(960-BX.top)*le; lr=wig+(1-Math.pow(1-lp,2))*385;}
 const lidSettle=t>OPEN+0.7?Math.sin(TAU*t*0.5+1)*3:0;
 lid.setAttribute('transform',`translate(${lx} ${ly+lidSettle}) rotate(${lr}) scale(${xs*(lp>0?0.82+0.18*(1-le):1)})`);
 // 好きなの：びよ〜んと飛び出す→ドキドキ
 line2.forEach((o,i)=>{const p=clamp((t-o.t0)/0.55);
  if(p<=0){o.g.setAttribute('transform','translate(-9999 0)');return;}
  const e=back(p,3.2), idle=clamp((t-o.t0-0.55)/0.4);
  const y=BX.top+80+(o.y-(BX.top+80))*e, x=BX.x+(o.x-BX.x)*eOut(p);
  const hb=t>3.2?((t-3.2)%1.2):9, beat=i<2?idle*(Math.max(0,Math.sin(Math.PI*clamp(hb/0.16)))*0.07+Math.max(0,Math.sin(Math.PI*clamp((hb-0.2)/0.16)))*0.04):0;
  o.g.setAttribute('transform',`translate(${x} ${y+Math.sin(TAU*t*0.45+o.ph)*7*idle}) rotate(${o.r+(1-eOut(p))*(i<2?-40:40)+Math.sin(TAU*t*0.35+o.ph)*2.5*idle}) scale(${(0.25+0.75*Math.min(1.15,e))*(1+beat)})`);});
 burst.forEach(o=>{const p=clamp((t-OPEN-0.05)/0.8);
  if(p<=0){o.g.setAttribute('transform','scale(0)');return;}
  const d=o.d*eOut(p),idle=clamp((t-OPEN-0.85)/0.5);
  const x=960+Math.cos(o.a)*d*1.45, y=760+Math.sin(o.a)*d*0.95+Math.sin(TAU*t*0.6+o.ph)*9*idle;
  o.g.setAttribute('transform',`translate(${x} ${y}) rotate(${o.spin?t*40:(1-p)*200+Math.sin(TAU*t*0.5+o.ph)*12}) scale(${back(clamp(p*1.6),2)*(o.spin?0.6+0.4*Math.abs(Math.sin(TAU*t*0.6+o.ph)):1)})`);});
 floaters.forEach(o=>{const p=clamp((t-o.t0)/0.4);const b=p<=0?0.0001:back(p,2.6);
  if(o.kind==='h')o.g.setAttribute('transform',`translate(${o.x} ${o.y+Math.sin(TAU*t*0.5+o.ph)*12}) rotate(${o.rot+Math.sin(TAU*t*0.4+o.ph)*10}) scale(${b*(1+0.06*Math.sin(TAU*t*1.2+o.ph))})`);
  else o.g.setAttribute('transform',`translate(${o.x} ${o.y}) rotate(${t*35+o.ph*20}) scale(${b*o.s*(0.6+0.4*Math.abs(Math.sin(TAU*t*0.6+o.ph)))})`);});
};
if(location.hash.includes('transparent'))document.body.style.background='transparent';
window.ready=Promise.all([document.fonts.load(`280px "${F1}"`,'君のことが好き'),document.fonts.load(`245px "${F2}"`,'なの')]).then(()=>document.fonts.ready).then(()=>{
 const m=location.hash.match(/t=([\d.]+)/);render(m?parseFloat(m[1]):6);});
</script></body></html>
