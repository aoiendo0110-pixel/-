<!doctype html><html><head><meta charset="utf-8">
<title>3D四つ葉クローバー</title>
<style>html,body{margin:0;background:#8a55e6;overflow:hidden}canvas{display:block}</style></head><body>
<!-- #transparent で背景なし / ?still でアニメ停止（書き出し用） -->
<script type="module">
import * as THREE from './three.module.min.js';

const SIZE=900;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1.2);
renderer.setSize(SIZE,SIZE);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const transparent=location.hash.includes('transparent');
renderer.setClearColor(0x8a55e6,transparent?0:1);
document.body.appendChild(renderer.domElement);
if(transparent)document.body.style.background='transparent';

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,0.1,100);
camera.position.set(0,0.1,8.4);
camera.lookAt(0,-0.1,0);

scene.add(new THREE.HemisphereLight(0xffffff,0xd9b8ff,1.6));
const key=new THREE.DirectionalLight(0xffffff,1.7);key.position.set(2.5,3,4);scene.add(key);
const rim=new THREE.DirectionalLight(0xfff2a8,1.2);rim.position.set(-3,1,-2);scene.add(rim);

// ハート形の葉っぱ（先端が中心、丸い側が外）
const heart=new THREE.Shape();
heart.moveTo(0,0);
heart.bezierCurveTo(-0.08,0.12,-0.62,0.32,-0.62,0.72);
heart.bezierCurveTo(-0.62,1.04,-0.28,1.14,0,0.88);
heart.bezierCurveTo(0.28,1.14,0.62,1.04,0.62,0.72);
heart.bezierCurveTo(0.62,0.32,0.08,0.12,0,0);
const leafGeo=new THREE.ExtrudeGeometry(heart,{depth:0.06,bevelEnabled:true,bevelThickness:0.1,bevelSize:0.08,bevelSegments:8,curveSegments:40});
leafGeo.computeBoundingBox();
const c=new THREE.Vector3();leafGeo.boundingBox.getCenter(c);
leafGeo.translate(-c.x,-c.y,-c.z);
leafGeo.scale(0.86,1,1);

const leafMat=new THREE.MeshPhysicalMaterial({color:0xa8e34e,roughness:0.5,clearcoat:0.8,clearcoatRoughness:0.45,sheen:0.6,sheenColor:new THREE.Color(0xf6ffd0)});
const lineMat=new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.BackSide});
const veinMat=new THREE.MeshPhysicalMaterial({color:0xeaffb8,roughness:0.3,clearcoat:1});
const pinkMat=new THREE.MeshPhysicalMaterial({color:0xff86b6,roughness:0.3,clearcoat:1});

const clover=new THREE.Group();
scene.add(clover);
const leaves=new THREE.Group();clover.add(leaves);
for(let i=0;i<4;i++){
  const arm=new THREE.Group();arm.rotation.z=i*Math.PI/2+Math.PI/4;
  const tilt=new THREE.Group();tilt.rotation.x=-0.28;arm.add(tilt);   // ちょっとお椀型に
  const leaf=new THREE.Mesh(leafGeo,leafMat);leaf.position.set(c.x,c.y+0.1,c.z);tilt.add(leaf);
  const outline=new THREE.Mesh(leafGeo,lineMat);outline.position.copy(leaf.position);outline.scale.set(1.09,1.07,1.25);tilt.add(outline);
  // 白いハイライトの点
  const dot=new THREE.Mesh(new THREE.SphereGeometry(0.06,16,12),new THREE.MeshBasicMaterial({color:0xffffff}));
  dot.scale.set(1.4,0.8,0.4);dot.position.set(-0.24,0.82,0.17);dot.rotation.z=0.6;tilt.add(dot);
  leaves.add(arm);
}
// 真ん中のピンクのハート玉
const centerGem=new THREE.Mesh(new THREE.SphereGeometry(0.15,32,24),pinkMat);centerGem.position.z=0.12;clover.add(centerGem);
const centerLine=new THREE.Mesh(new THREE.SphereGeometry(0.15,32,24),lineMat);centerLine.scale.setScalar(1.3);centerLine.position.z=0.12;clover.add(centerLine);
// くき
const stemCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,0),new THREE.Vector3(0.05,-0.6,-0.05),new THREE.Vector3(0.25,-1.15,0),new THREE.Vector3(0.55,-1.45,0.05)]);
clover.add(new THREE.Mesh(new THREE.TubeGeometry(stemCurve,40,0.07,16),new THREE.MeshPhysicalMaterial({color:0x86c234,roughness:0.4,clearcoat:1})));
clover.add(new THREE.Mesh(new THREE.TubeGeometry(stemCurve,40,0.11,16),lineMat));
clover.scale.setScalar(1.25);
clover.position.y=0.35;

// まわりのキラキラ（板ポリ）
function sparkTex(color){const cv=document.createElement('canvas');cv.width=cv.height=128;const g=cv.getContext('2d');
  const star=()=>{g.beginPath();g.moveTo(64,6);g.quadraticCurveTo(70,58,122,64);g.quadraticCurveTo(70,70,64,122);g.quadraticCurveTo(58,70,6,64);g.quadraticCurveTo(58,58,64,6);g.closePath();};
  g.lineJoin='round';star();g.lineWidth=14;g.strokeStyle='#fff';g.stroke();star();g.fillStyle=color;g.fill();
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;}
const sparks=[[ -1.55,1.15,0.4,'#ffec80',0.55,0],[1.6,0.75,0.2,'#ffffff',0.45,1.7],[1.25,-1.3,0.3,'#d6f38a',0.5,3.1],[-1.4,-0.9,0.1,'#ffffff',0.38,4.4]]
 .map(([x,y,z,col,s,ph])=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(s,s),new THREE.MeshBasicMaterial({map:sparkTex(col),transparent:true,depthWrite:false}));
   m.position.set(x,y,z);scene.add(m);return {m,s,ph};});

// t秒の姿を描く（4秒でぴったりループ）
const LOOP=4, TAU=Math.PI*2;
window.render=function(t){
  const u=(t%LOOP)/LOOP;
  clover.rotation.y=u*TAU;                       // くるっと一回転
  clover.rotation.x=0.18*Math.sin(u*TAU*2);       // ゆらゆら
  clover.rotation.z=0.12*Math.sin(u*TAU);
  clover.position.y=0.35+0.12*Math.sin(u*TAU*2);  // ふわふわ
  const pop=1+0.04*Math.max(0,Math.sin(u*TAU*2)); // ぽよん
  clover.scale.set(1.25*pop,1.25/pop,1.25);
  centerGem.scale.setScalar(1+0.15*Math.sin(u*TAU*4));
  sparks.forEach(o=>{const k=0.35+0.65*Math.pow(Math.abs(Math.sin(u*TAU*2+o.ph)),2);o.m.scale.setScalar(k);o.m.rotation.z=u*TAU*0.5;});
  renderer.render(scene,camera);
};
window.ready=true;
if(!location.search.includes('still')){const t0=performance.now();const loop=()=>{render((performance.now()-t0)/1000);requestAnimationFrame(loop);};loop();}
else render(0.5);
</script></body></html>
